name: Validate and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate data
        run: python -m pear validate
      - name: Derive bounds
        run: python -m pear derive --out build/derived.json
      - run: pytest
      - name: Write site data
        run: python -m pear site --out build/site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site (KaTeX errors fail the build)
        working-directory: site
        run: |
          npm ci
          npx eleventy
