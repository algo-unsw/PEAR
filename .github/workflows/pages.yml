name: Deploy site to GitHub Pages

# Builds the data pipeline and the Eleventy site, then deploys to Pages.
# Needs Pages enabled with "GitHub Actions" as the source (Settings → Pages) and the
# repository variable PAGES_ENABLED set to "true"; until then the deploy is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Write site data
        run: python -m pear site --out build/site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        working-directory: site
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npx eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
