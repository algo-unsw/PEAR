id: steiner-forest
name: Steiner Forest
aliases: []
category: networks
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Steiner Tree, one of Karp's NP-complete problems, is the special case in which every pair of terminals is a demand (reduction steiner-tree--to--steiner-forest); membership in NP is immediate."
    reference: { paper: feldmann-lampis-2024, version: icalp, statement: "Section 1" }
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of edges of a Steiner forest (optimisation)" }
  d: { meaning: "the number of demand pairs $|D|$" }
  p: { meaning: "the number of terminals: the vertices that lie in at least one demand pair" }
  vc: { shared: vertex-cover-number }
  fes: { shared: feedback-edge-set-number }
constraints:
  - { constraint: "k \\le n", because: "A forest has fewer edges than vertices, so every instance with $k \\ge n$ is decided by checking whether every demand pair lies in one connected component of $G$." }
  - { constraint: "p \\le 2k", because: "Both vertices of a demand pair $\\{s, t\\}$ ($s \\ne t$) are endpoints of edges of the forest, and a forest with at most $k$ edges has at most $2k$ endpoints, so every instance with $p > 2k$ is a no-instance (decision, search); for optimisation $k$ is the optimum (added 21 November 2026)." }
  - { constraint: "p \\le 2d", because: "Every demand pair has two vertices." }
  - { constraint: "p \\le n", because: "The terminals are vertices." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "vc \\le n", because: "A vertex cover is a set of vertices." }
  - { constraint: "fes \\le m", because: "A feedback edge set is a set of edges." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$, a set $D$ of pairs $\\{s, t\\}$ of vertices (demands), and an integer $k$."
    question: "Is there a forest $H \\subseteq G$ with at most $k$ edges such that for every pair $\\{s, t\\} \\in D$, the vertices $s$ and $t$ are in the same connected component of $H$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$ and a set $D$ of pairs $\\{s, t\\}$ of vertices (demands)."
    goal: "Find the minimum number of edges of a forest $H \\subseteq G$ such that for every pair $\\{s, t\\} \\in D$, the vertices $s$ and $t$ are in the same connected component of $H$, or report that none exists."
  search:
    kind: search
    input: "A graph $G = (V, E)$, a set $D$ of pairs $\\{s, t\\}$ of vertices (demands), and an integer $k$."
    goal: "Find a forest $H \\subseteq G$ with at most $k$ edges such that for every pair $\\{s, t\\} \\in D$, the vertices $s$ and $t$ are in the same connected component of $H$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$, a set $D$ of pairs $\\{s, t\\}$ of vertices (demands), and edge weights $w \\colon E \\to \\mathbb{Z}_{\\ge 1}$."
    goal: "Find the minimum weight $\\sum_{e \\in E(H)} w(e)$ of a forest $H \\subseteq G$ such that for every pair $\\{s, t\\} \\in D$, the vertices $s$ and $t$ are in the same connected component of $H$, or report that none exists."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility (delete an edge and test again)."
related:
  - { problem: steiner-tree, relation: special-case }
