id: proportional-approval-voting
name: Proportional Approval Voting
aliases: [PAV, PAV Winner Determination, Winner Determination for Proportional Approval Voting, Thiele's Proportional Method]
category: social-choice
complexity:
  class: NP-complete
  source:
    paper: aziz-gaspers-gudmundsson-2014
    statements:
      arxiv-v1: { statement: "Theorem 1", page: 3 }
    note: "Theorem 1: winner determination for PAV is NP-complete even if each agent approves of two candidates (reduction from Independent Set). TODO(verify): Wikipedia's choice of source for the NP-hardness of PAV was not checked (WebFetch not used in this batch); Skowron, Faliszewski and Lang (Artificial Intelligence 2016) is the other usual citation."
objects:
  n: number of candidates
  m: number of voters (approval ballots)
  N: total encoding length of the input
parameters:
  k: { meaning: "the committee size $k$ in the input" }
  d: { meaning: "the score: the rational number $d$ in the input (decision, search), or the maximum PAV score of a committee of size $k$ (optimisation)" }
  vc: { shared: vertex-cover-number, of: "the incidence graph: the bipartite graph on the candidates and the ballots with an edge between $c$ and $A_i$ whenever $c \\in A_i$" }
constraints:
  - { constraint: "k \\le n", because: "A committee is a set of $k$ of the $n$ candidates; an instance with $k > n$ has no committee and is answered in polynomial time." }
  - { constraint: "d \\le m n", because: "Each voter contributes at most $\\sum_{j=1}^{k} 1/j \\le k \\le n$ to the score, so an instance with $d > mn$ is a no-instance, answered in polynomial time." }
  - { constraint: "vc \\le n", because: "The candidates form a vertex cover of the incidence graph." }
  - { constraint: "vc \\le m", because: "The ballots form a vertex cover of the incidence graph." }
versions:
  decision:
    kind: decision
    input: "A set $C$ of $n$ candidates, approval ballots $A_1, \\dots, A_m \\subseteq C$, an integer $k$ and a rational number $d$."
    question: "Is there a committee $W \\subseteq C$ with $|W| = k$ whose PAV score $\\sum_{i=1}^{m} \\sum_{j=1}^{|W \\cap A_i|} \\frac{1}{j}$ is at least $d$?"
  optimisation:
    kind: optimisation
    input: "A set $C$ of $n$ candidates, approval ballots $A_1, \\dots, A_m \\subseteq C$ and an integer $k$."
    goal: "Find the maximum PAV score $\\sum_{i=1}^{m} \\sum_{j=1}^{|W \\cap A_i|} \\frac{1}{j}$ of a committee $W \\subseteq C$ with $|W| = k$."
  search:
    kind: search
    input: "A set $C$ of $n$ candidates, approval ballots $A_1, \\dots, A_m \\subseteq C$, an integer $k$ and a rational number $d$."
    goal: "Find a committee $W \\subseteq C$ with $|W| = k$ whose PAV score $\\sum_{i=1}^{m} \\sum_{j=1}^{|W \\cap A_i|} \\frac{1}{j}$ is at least $d$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $d$ (every score is a multiple of $1/\\mathrm{lcm}(1, \\dots, k)$ between $0$ and $mn$, so $O(k + \\log(mn))$ steps) and self-reducibility (delete a candidate whenever the optimum does not drop)."
related:
  - { problem: independent-set, relation: variant }
review: { approved_by: null, date: null }
