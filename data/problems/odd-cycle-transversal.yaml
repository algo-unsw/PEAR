id: odd-cycle-transversal
name: Odd Cycle Transversal
aliases: [OCT, Graph Bipartization, Vertex Bipartization]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: garey-johnson-1979
    attested_by:
      - "https://en.wikipedia.org/wiki/Odd_cycle_transversal"
      - "https://arxiv.org/pdf/2402.11465"
      - "https://www.imsc.res.in/~vraman/exact/neel.pdf"
    note: "As on Wikipedia, which cites Garey and Johnson (GT21, induced subgraph with a hereditary property) and Yannakakis (STOC 1978). The other two sources give the general node-deletion result of Lewis and Yannakakis (JCSS 1980), which covers bipartite graphs. TODO(verify): Serge to confirm the citation choice."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of an odd cycle transversal (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is decided in polynomial time ($S = V$ is a solution)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is bipartite?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ is bipartite."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is bipartite, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$ and vertex weights $w \\colon V \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{v \\in S} w(v)$ of a set $S \\subseteq V$ such that $G - S$ is bipartite."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: feedback-vertex-set, relation: variant }
