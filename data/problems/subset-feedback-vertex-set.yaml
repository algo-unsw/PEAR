id: subset-feedback-vertex-set
name: Subset Feedback Vertex Set
aliases: [Subset FVS, SFVS, Subset-FVS]
category: graph
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "With $T = V$ it is Feedback Vertex Set (Karp 1972, NP-complete); membership in NP is immediate. The abstract of arXiv:1701.04634 (Papadopoulos, Tzimas) says Feedback Vertex Set is obtained for $S = V$, and that of arXiv:1512.02510 (Hols, Kratsch) that the problem generalises Feedback Vertex Set."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a subset feedback vertex set (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$, a set $T \\subseteq V$ of terminals and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that no cycle of $G - S$ contains a vertex of $T$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$ and a set $T \\subseteq V$ of terminals."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that no cycle of $G - S$ contains a vertex of $T$."
  search:
    kind: search
    input: "A graph $G = (V, E)$, a set $T \\subseteq V$ of terminals and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that no cycle of $G - S$ contains a vertex of $T$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: feedback-vertex-set, relation: special-case }
