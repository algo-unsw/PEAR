id: hamiltonian-cycle
name: Hamiltonian Cycle
aliases: [Hamiltonian Circuit, HAM-CYCLE, Undirected Hamiltonian Cycle]
category: graph
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/List_of_NP-complete_problems"
      - "https://arxiv.org/pdf/1902.10349"
      - "https://www.iitg.ac.in/rinkulu/note/npprobs-note.pdf"
    note: "Undirected Hamiltonian Circuit is one of Karp's 21 NP-complete problems."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  tw: { shared: treewidth }
constraints:
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$."
    question: "Is there a cycle in $G$ that contains every vertex exactly once?"
    generalises: [decision-max-degree-5]
  search:
    kind: search
    input: "A graph $G = (V, E)$."
    goal: "Find a cycle in $G$ that contains every vertex exactly once, or report that none exists."
  decision-max-degree-3:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $3$."
    question: "Is there a cycle in $G$ that contains every vertex exactly once?"
  search-max-degree-3:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $3$."
    goal: "Find a cycle in $G$ that contains every vertex exactly once, or report that none exists."
  decision-max-degree-4:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $4$."
    question: "Is there a cycle in $G$ that contains every vertex exactly once?"
    generalises: [decision-max-degree-3]
  search-max-degree-4:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $4$."
    goal: "Find a cycle in $G$ that contains every vertex exactly once, or report that none exists."
  decision-max-degree-5:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $5$."
    question: "Is there a cycle in $G$ that contains every vertex exactly once?"
    generalises: [decision-max-degree-4]
  search-max-degree-5:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $5$."
    goal: "Find a cycle in $G$ that contains every vertex exactly once, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, search]
    because: "Self-reducibility: delete edges one at a time while a Hamiltonian cycle remains."
  - versions: [decision-max-degree-3, search-max-degree-3]
    because: "Self-reducibility: delete edges one at a time while a Hamiltonian cycle remains; deleting edges keeps the maximum degree at most $3$."
  - versions: [decision-max-degree-4, search-max-degree-4]
    because: "Self-reducibility: delete edges one at a time while a Hamiltonian cycle remains; deleting edges keeps the maximum degree at most $4$."
  - versions: [decision-max-degree-5, search-max-degree-5]
    because: "Self-reducibility: delete edges one at a time while a Hamiltonian cycle remains; deleting edges keeps the maximum degree at most $5$."
related: []
implementations:
  as_of: 2026-11-13
  ranked: [concorde, sagemath]
