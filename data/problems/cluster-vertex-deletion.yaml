id: cluster-vertex-deletion
name: Cluster Vertex Deletion
aliases: [CVD]
category: graphs
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Vertex Cover reduces to it by attaching a pendant vertex to every vertex (see the reduction from Vertex Cover; Aprile, Drescher, Fiorini and Huynh, Section 1). NP-completeness is usually credited to Lewis and Yannakakis (\"The node-deletion problem for hereditary properties is NP-complete\", J. Comput. Syst. Sci. 20(2), 1980), as in Hüffner, Komusiewicz, Moser and Niedermeier (Theory Comput. Syst., author copy) and Le and Le (MFCS 2022). TODO(verify): Serge to choose between this folklore reduction and a citation of Lewis–Yannakakis (no open copy found; only two attesting sites checked)."
    reference: { paper: aprile-drescher-fiorini-huynh-2020, version: arxiv-v3, statement: "Section 1" }
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of vertices whose deletion leaves a cluster graph (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is a cluster graph, that is, a disjoint union of cliques?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ is a cluster graph, that is, a disjoint union of cliques."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is a cluster graph, that is, a disjoint union of cliques, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: 3-hitting-set, relation: generalisation }
  - { problem: cluster-editing, relation: variant }
