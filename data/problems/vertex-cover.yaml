id: vertex-cover
name: Vertex Cover
aliases: [Node Cover, VC, Minimum Vertex Cover]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/Karp%27s_21_NP-complete_problems"
      - "https://student.cs.uwaterloo.ca/~cs360/Hall/karp.html"
      - "https://www.tpointtech.com/daa-vertex-cover-problem"
    note: "Vertex Cover is one of Karp's 21 NP-complete problems."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a vertex cover (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "n \\le m", because: "Without loss of generality (suggested by Serge Gaspers, 18 November 2026): delete isolated vertices, and while a vertex $v$ has degree 1, with neighbour $u$, put $u$ in the cover and delete $u$ and $v$ ($k$ decreases by 1). With weights, if $w(v) \\ge w(u)$ do the same; otherwise delete $v$ and lower $w(u)$ by $w(v)$, adding $w(v)$ to the optimum. Afterwards every vertex has degree at least 2, so $2m \\ge 2n$." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that every edge has an endpoint in $S$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that every edge has an endpoint in $S$."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that every edge has an endpoint in $S$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$ and vertex weights $w \\colon V \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{v \\in S} w(v)$ of a set $S \\subseteq V$ such that every edge has an endpoint in $S$."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: independent-set, relation: complement }
implementations:
  as_of: 2026-11-08
  ranked: [wegotyoucovered, peaty, akiba-iwata-vertex-cover, kamis, sagemath]
review: { approved_by: Serge Gaspers, date: 2026-11-08 }
