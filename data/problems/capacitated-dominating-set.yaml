id: capacitated-dominating-set
name: Capacitated Dominating Set
aliases: [Capacitated Domination, CDS, Minimum Capacitated Dominating Set]
category: graphs
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Dominating Set is the special case where every vertex has capacity equal to its degree (see the reduction from Dominating Set); membership in NP holds because checking a given set $S$ is a maximum-matching or max-flow problem (Cygan, Pilipczuk and Wojtaszczyk, arXiv 0909.4021, Section 1)."
    reference: { paper: cygan-pilipczuk-wojtaszczyk-2009, version: arxiv, statement: "Section 1 (Notation and definitions)" }
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a capacitated dominating set (optimisation)" }
  tcw: { shared: tree-cut-width }
  nd: { meaning: "the neighbourhood diversity of $G$ (Lampis): the minimum number of classes in a partition of $V$ such that any two vertices in the same class have the same neighbours outside their two vertices" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "nd \\le n", because: "The partition into singletons has $n$ classes." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$, capacities $c \\colon V \\to \\mathbb{Z}_{\\ge 0}$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ and a map $f \\colon V \\setminus S \\to S$ such that $f(v)$ is a neighbour of $v$ for every $v \\in V \\setminus S$ and $|f^{-1}(u)| \\le c(u)$ for every $u \\in S$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$ and capacities $c \\colon V \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum size of a set $S \\subseteq V$ for which there is a map $f \\colon V \\setminus S \\to S$ such that $f(v)$ is a neighbour of $v$ for every $v \\in V \\setminus S$ and $|f^{-1}(u)| \\le c(u)$ for every $u \\in S$."
  search:
    kind: search
    input: "A graph $G = (V, E)$, capacities $c \\colon V \\to \\mathbb{Z}_{\\ge 0}$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ and a map $f \\colon V \\setminus S \\to S$ such that $f(v)$ is a neighbour of $v$ for every $v \\in V \\setminus S$ and $|f^{-1}(u)| \\le c(u)$ for every $u \\in S$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$; a solution set $S$ yields $f$ by maximum matching (or max flow) in polynomial time."
related:
  - { problem: dominating-set, relation: generalisation }
