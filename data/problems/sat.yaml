id: sat
name: SAT
aliases: [CNF-SAT, Satisfiability, Boolean Satisfiability]
category: satisfiability
complexity:
  class: NP-complete
  source:
    paper: cook-1971
    attested_by:
      - "https://en.wikipedia.org/wiki/Cook%E2%80%93Levin_theorem"
      - "https://www.cs.umd.edu/~gasarch/COURSES/452/F14/cookpaper.pdf"
      - "https://webhome.cs.uvic.ca/~wendym/courses/425/16/notes/425_05_np-complete.pdf"
    note: "The Cook–Levin theorem; Cook's Theorem 1 is stated for DNF tautologies, the complement of CNF satisfiability."
objects:
  n: number of variables
  m: number of clauses
  N: total encoding length of the input
parameters:
  L: { meaning: "the length of the formula: the total number of literal occurrences" }
  tw_p: { shared: primal-treewidth }
  tw_d: { shared: dual-treewidth }
  tw_i: { shared: incidence-treewidth }
  sb_horn: { meaning: "the size of a smallest strong Horn-backdoor set: a set $B$ of variables such that $F[\\tau]$ is Horn (every clause has at most one positive literal) for every truth assignment $\\tau$ to $B$; for Horn, strong and deletion backdoor sets coincide" }
  sb_krom: { meaning: "the size of a smallest strong 2-CNF-backdoor set (2-CNF formulas are also called Krom formulas): a set $B$ of variables such that every clause of $F[\\tau]$ has at most two literals for every truth assignment $\\tau$ to $B$; for 2-CNF, strong and deletion backdoor sets coincide" }
  db_qhorn: { meaning: "the size of a smallest deletion q-Horn-backdoor set: a set $B$ of variables such that the formula $F - B$, obtained by deleting all literals of variables in $B$ from the clauses, is q-Horn (Boros, Crama and Hammer)" }
  sb_forest: { meaning: "the size of a smallest strong Forest-backdoor set: a set $B$ of variables such that the incidence graph of $F[\\tau]$ is a forest for every truth assignment $\\tau$ to $B$" }
  sb_nest: { meaning: "the size of a smallest strong Nested-backdoor set: a set $B$ of variables such that $F[\\tau]$ is nested (Knuth) for every truth assignment $\\tau$ to $B$" }
constraints:
  - { constraint: "tw_p \\le n", because: "The primal graph has $n$ vertices." }
  - { constraint: "tw_d \\le m", because: "The dual graph has $m$ vertices." }
  - { constraint: "tw_i \\le n + m", because: "The incidence graph has $n + m$ vertices." }
  - { constraint: "m \\le L", because: "Every clause is nonempty after removing empty clauses (an empty clause makes the formula unsatisfiable)." }
  - { constraint: "n \\le L", because: "Variables that occur in no clause can be removed." }
  - { constraint: "sb_{horn} \\le n", because: "The set of all variables is a strong Horn-backdoor set: every total assignment leaves no clause or only the empty clause, which is Horn." }
  - { constraint: "sb_{krom} \\le n", because: "The set of all variables is a strong 2-CNF-backdoor set: every total assignment leaves no clause or only the empty clause." }
  - { constraint: "sb_{forest} \\le n", because: "The set of all variables is a strong Forest-backdoor set: every total assignment leaves a formula without variables, whose incidence graph has no edges." }
  - { constraint: "sb_{nest} \\le n", because: "The set of all variables is a strong Nested-backdoor set: every total assignment leaves a formula without variables, which is nested." }
  - { constraint: "db_{qhorn} \\le sb_{horn}", because: "Strong and deletion Horn-backdoor sets coincide, and Horn formulas are q-Horn, so a smallest strong Horn-backdoor set is a deletion q-Horn-backdoor set." }
  - { constraint: "db_{qhorn} \\le sb_{krom}", because: "Strong and deletion 2-CNF-backdoor sets coincide, and 2-CNF (Krom) formulas are q-Horn, so a smallest strong 2-CNF-backdoor set is a deletion q-Horn-backdoor set." }
versions:
  decision:
    kind: decision
    input: "A formula $\\varphi$ in conjunctive normal form over variables $x_1, \\dots, x_n$."
    question: "Is there an assignment of the variables that satisfies every clause of $\\varphi$?"
  search:
    kind: search
    input: "A formula $\\varphi$ in conjunctive normal form over variables $x_1, \\dots, x_n$."
    goal: "Find an assignment of the variables that satisfies every clause of $\\varphi$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, search]
    because: "Self-reducibility: fix variables one at a time."
related:
  - { problem: sharp-3-sat, relation: counting }
  - { problem: max-sat, relation: variant }
implementations:
  as_of: 2026-11-11
  ranked: [kissat, cadical]
