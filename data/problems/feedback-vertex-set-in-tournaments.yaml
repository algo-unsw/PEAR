id: feedback-vertex-set-in-tournaments
name: Feedback Vertex Set in Tournaments
aliases: [FVST, TFVS, Tournament Feedback Vertex Set, Minimum Feedback Vertex Set in Tournaments]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: speckenmeyer-1990
    attested_by:
      - "https://www.imsc.res.in/~vraman/pub/tourn-final.pdf"
      - "https://core.ac.uk/download/37882302.pdf"
      - "https://arxiv.org/html/2601.17169v1"
    note: "Speckenmeyer (WG '89) proved the problem NP-complete; membership in NP is immediate. Raman and Saurabh (Parameterized Algorithms for Feedback Set Problems and Their Duals in Tournaments, Section 1: \"Feedback vertex set problem is NP-complete in tournaments [19]\"), Cai, Deng and Zang (SIAM J. Comput. 30(6), 2001: \"remains NP-hard even in tournaments [18]\") and Spirkl and Xing (arXiv:2601.17169v1, Introduction) all cite Speckenmeyer for it. Wikipedia's Feedback vertex set article does not mention tournaments (checked 21 November 2026), so there is no Wikipedia choice to mirror."
objects:
  n: number of vertices
  m: number of arcs ($n(n-1)/2$ in a tournament)
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a feedback vertex set (optimisation)" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A tournament has exactly $n(n-1)/2$ arcs." }
versions:
  decision:
    kind: decision
    input: "A tournament $T = (V, A)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $T - S$ has no directed cycle?"
  optimisation:
    kind: optimisation
    input: "A tournament $T = (V, A)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $T - S$ has no directed cycle."
  search:
    kind: search
    input: "A tournament $T = (V, A)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $T - S$ has no directed cycle, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: directed-feedback-vertex-set, relation: generalisation }
  - { problem: 3-hitting-set, relation: generalisation }
  - { problem: feedback-arc-set-in-tournaments, relation: variant }
lean: { status: none }
review: { approved_by: null, date: null }
