id: independent-dominating-set
name: Independent Dominating Set
aliases: [Minimum Independent Dominating Set, Minimum Maximal Independent Set, Independent Domination, IDS, MIDS]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: garey-johnson-1979
    attested_by:
      - "https://en.wikipedia.org/wiki/Independent_dominating_set"
      - "https://arxiv.org/pdf/0905.1993"
      - "https://dmtcs.episciences.org/563"
    note: "As on Wikipedia, which cites Garey and Johnson for the NP-completeness of independent domination."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of an independent dominating set (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance: a maximal independent set, found greedily in polynomial time, is an independent dominating set." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$?"
    generalises: [decision-max-degree-4]
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$, or report that none exists."
  decision-max-degree-3:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $3$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$?"
  optimisation-max-degree-3:
    kind: optimisation
    input: "A graph $G = (V, E)$ of maximum degree at most $3$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$."
  decision-max-degree-4:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $4$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$?"
    generalises: [decision-max-degree-3]
  optimisation-max-degree-4:
    kind: optimisation
    input: "A graph $G = (V, E)$ of maximum degree at most $4$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that no two vertices of $S$ are adjacent and every vertex is in $S$ or has a neighbour in $S$."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
  - versions: [decision-max-degree-3, optimisation-max-degree-3]
    because: "Binary search on $k$."
  - versions: [decision-max-degree-4, optimisation-max-degree-4]
    because: "Binary search on $k$."
related:
  - { problem: dominating-set, relation: variant }
  - { problem: independent-set, relation: variant }
