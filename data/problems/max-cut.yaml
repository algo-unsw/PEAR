id: max-cut
name: Max Cut
aliases: [Maximum Cut, MaxCut, Simple Max Cut]
category: graph
complexity:
  class: NP-complete
  source:
    paper: garey-johnson-stockmeyer-1974
    attested_by:
      - "https://math.mit.edu/~goemans/PAPERS/maxcut-jacm.pdf"
      - "https://pesc.coppe.ufrj.br/~celina/ftp/j/jgt.22948.pdf"
      - "https://www.csie.ntu.edu.tw/~lyuu/complexity/2006/20060608.pdf"
    note: "Simple Max Cut (all edge weights 1) is NP-complete by Garey, Johnson and Stockmeyer, Theoretical Computer Science 1976 (chosen by Serge Gaspers, 18 November 2026). The three sources (Goemans and Williamson's MAX CUT paper, a J. Graph Theory paper on MaxCut on permutation graphs, and Lyuu's lecture notes) credit it to that paper. Karp (1972) proved the weighted version NP-complete (Garey–Johnson ND16); Wikipedia cites Karp and Garey–Johnson (1979)."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the cut size: the integer $k$ in the input (decision, search), or the maximum number of edges in a cut (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le m", because: "A cut has at most $m$ edges." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ such that at least $k$ edges have exactly one endpoint in $S$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the maximum number of edges with exactly one endpoint in $S$, over all sets $S \\subseteq V$."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ such that at least $k$ edges have exactly one endpoint in $S$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$ and edge weights $w \\colon E \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the maximum total weight of the edges with exactly one endpoint in $S$, over all sets $S \\subseteq V$."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related: []
