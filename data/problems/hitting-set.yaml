id: hitting-set
name: Hitting Set
aliases: [Minimum Hitting Set, Transversal, HS]
category: sets
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/List_of_NP-complete_problems"
      - "https://arxiv.org/pdf/1902.10349"
      - "https://www.iitg.ac.in/rinkulu/note/npprobs-note.pdf"
    note: "Hitting Set is one of Karp's 21 NP-complete problems."
objects:
  n: number of elements of the universe
  m: number of sets in the family
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a hitting set (optimisation)" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is decided by checking that no set of $\\mathcal{F}$ is empty." }
  - { constraint: "k \\le m", because: "A minimal hitting set has at most one element per set, so every instance with $k \\ge m$ is decided by checking that no set of $\\mathcal{F}$ is empty." }
versions:
  decision:
    kind: decision
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and an integer $k$."
    question: "Is there a set $S \\subseteq U$ with $|S| \\le k$ such that every set of $\\mathcal{F}$ contains an element of $S$?"
  optimisation:
    kind: optimisation
    input: "A finite universe $U$ and a family $\\mathcal{F}$ of subsets of $U$."
    goal: "Find the minimum size of a set $S \\subseteq U$ such that every set of $\\mathcal{F}$ contains an element of $S$, or report that none exists."
  search:
    kind: search
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and an integer $k$."
    goal: "Find a set $S \\subseteq U$ with $|S| \\le k$ such that every set of $\\mathcal{F}$ contains an element of $S$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and element weights $w \\colon U \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{u \\in S} w(u)$ of a set $S \\subseteq U$ such that every set of $\\mathcal{F}$ contains an element of $S$, or report that none exists."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: set-cover, relation: dual }
  - { problem: vertex-cover, relation: special-case }
implementations:
  as_of: 2026-11-11
  ranked: [uzl-pace-2025, bad-dominating-set-maker]
