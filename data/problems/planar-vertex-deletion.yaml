id: planar-vertex-deletion
name: Planar Vertex Deletion
aliases: [Vertex Planarization, k-Vertex Planarization]
category: graph
complexity:
  class: NP-complete
  source:
    paper: jansen-lokshtanov-saurabh-2014
    statements:
      author-copy: { statement: "Section 1 (Introduction)" }
    note: "The introduction states that the decision version of Vertex Planarization is NP-complete, by the general NP-completeness result for node-deletion problems of Lewis and Yannakakis (\"The node-deletion problem for hereditary properties is NP-complete\", J. Comput. Syst. Sci. 20(2), 1980). TODO(verify): Serge to choose whether to cite Lewis–Yannakakis directly (no open copy checked here; it would need three attestations) or this paper; no Wikipedia article on the problem was checked for its choice of source."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of vertices whose deletion leaves a planar graph (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is planar?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ is planar."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is planar, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: feedback-vertex-set, relation: variant }
