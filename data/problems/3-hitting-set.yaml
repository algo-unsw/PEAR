id: 3-hitting-set
name: 3-Hitting Set
aliases: [3-HS, Hitting Set with sets of size at most 3, 3-Set Transversal]
category: sets
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Vertex Cover (Karp 1972, NP-complete) is the special case in which every set has two elements."
objects:
  n: number of elements of the universe
  m: number of sets in the family
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a hitting set (optimisation)" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is decided by checking that no set is empty." }
  - { constraint: "m \\le n^{3}", because: "There are at most $n^3$ sets of at most three elements." }
versions:
  decision:
    kind: decision
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$ each of size at most 3, and an integer $k$."
    question: "Is there a set $S \\subseteq U$ with $|S| \\le k$ that intersects every set of $\\mathcal{F}$?"
  optimisation:
    kind: optimisation
    input: "A finite universe $U$ and a family $\\mathcal{F}$ of subsets of $U$ each of size at most 3."
    goal: "Find the minimum size of a set $S \\subseteq U$ that intersects every set of $\\mathcal{F}$, or report that none exists."
  search:
    kind: search
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$ each of size at most 3, and an integer $k$."
    goal: "Find a set $S \\subseteq U$ with $|S| \\le k$ that intersects every set of $\\mathcal{F}$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$ each of size at most 3, and element weights $w \\colon U \\to \\mathbb{Z}_{\\ge 1}$."
    goal: "Find the minimum weight $\\sum_{u \\in S} w(u)$ of a set $S \\subseteq U$ that intersects every set of $\\mathcal{F}$, or report that none exists."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: hitting-set, relation: special-case }
  - { problem: vertex-cover, relation: generalisation }
