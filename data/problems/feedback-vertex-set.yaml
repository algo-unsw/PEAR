id: feedback-vertex-set
name: Feedback Vertex Set
aliases: [Feedback Node Set, FVS, Decycling Set]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/List_of_NP-complete_problems"
      - "https://www.iitg.ac.in/rinkulu/note/npprobs-note.pdf"
      - "https://arxiv.org/pdf/1902.10349"
    note: "Feedback Node Set is one of Karp's 21 NP-complete problems (Garey–Johnson GT7)."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a feedback vertex set (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle?"
    generalises: [decision-max-degree-6]
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has no cycle."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$ and vertex weights $w \\colon V \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{v \\in S} w(v)$ of a set $S \\subseteq V$ such that $G - S$ has no cycle."
    generalises: [optimisation]
  decision-max-degree-4:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $4$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle?"
  optimisation-max-degree-4:
    kind: optimisation
    input: "A graph $G = (V, E)$ of maximum degree at most $4$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has no cycle."
  search-max-degree-4:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $4$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle, or report that none exists."
  decision-max-degree-5:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $5$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle?"
    generalises: [decision-max-degree-4]
  optimisation-max-degree-5:
    kind: optimisation
    input: "A graph $G = (V, E)$ of maximum degree at most $5$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has no cycle."
  search-max-degree-5:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $5$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle, or report that none exists."
  decision-max-degree-6:
    kind: decision
    input: "A graph $G = (V, E)$ of maximum degree at most $6$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle?"
    generalises: [decision-max-degree-5]
  optimisation-max-degree-6:
    kind: optimisation
    input: "A graph $G = (V, E)$ of maximum degree at most $6$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has no cycle."
  search-max-degree-6:
    kind: search
    input: "A graph $G = (V, E)$ of maximum degree at most $6$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
  - versions: [decision-max-degree-4, optimisation-max-degree-4, search-max-degree-4]
    because: "Binary search on $k$ and self-reducibility; the self-reduction only deletes vertices, so the maximum degree stays at most $4$."
  - versions: [decision-max-degree-5, optimisation-max-degree-5, search-max-degree-5]
    because: "Binary search on $k$ and self-reducibility; the self-reduction only deletes vertices, so the maximum degree stays at most $5$."
  - versions: [decision-max-degree-6, optimisation-max-degree-6, search-max-degree-6]
    because: "Binary search on $k$ and self-reducibility; the self-reduction only deletes vertices, so the maximum degree stays at most $6$."
related:
  - { problem: odd-cycle-transversal, relation: variant }
