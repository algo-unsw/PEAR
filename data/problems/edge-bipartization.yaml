id: edge-bipartization
name: Edge Bipartization
aliases: [Edge Odd Cycle Transversal, Edge OCT]
category: graphs
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Max Cut (NP-complete; Garey, Johnson and Stockmeyer 1976) reduces to it: a graph has a cut with at least $k$ edges if and only if deleting at most $m - k$ edges makes it bipartite (delete the edges that do not cross the cut). See the reduction from Max Cut. TODO(verify): Serge to choose a classic citation (no Wikipedia article on this problem was found)."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of edges whose deletion makes the graph bipartite (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le m", because: "Every instance with $k \\ge m$ is a yes-instance ($S = E$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq E$ with $|S| \\le k$ such that $G - S$ is bipartite?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq E$ such that $G - S$ is bipartite."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq E$ with $|S| \\le k$ such that $G - S$ is bipartite, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: odd-cycle-transversal, relation: variant }
  - { problem: max-cut, relation: complement }
