id: chordal-vertex-deletion
name: Chordal Vertex Deletion
aliases: [Chordal Deletion, ChVD]
category: graph
complexity:
  class: NP-complete
  source:
    paper: cao-marx-2014
    statements:
      arxiv-v1: { statement: "Section 1 (Introduction)" }
    note: "Section 1 states that chordal completion, chordal edge deletion and chordal vertex deletion are NP-hard, citing Yannakakis (1981), Natanzon et al. (2001), Krishnamoorthy and Deo (1979) and Lewis and Yannakakis (1980). Membership in NP: chordality is testable in polynomial time. TODO(verify): Serge to choose whether to cite Krishnamoorthy–Deo or Lewis–Yannakakis directly (no open copy checked; Wikipedia's choice not checked)."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of vertices whose deletion leaves a chordal graph (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is chordal, that is, has no induced cycle on at least four vertices?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ is chordal, that is, has no induced cycle on at least four vertices."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ is chordal, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: minimum-fill-in, relation: variant }
  - { problem: feedback-vertex-set, relation: variant }
