id: connected-feedback-vertex-set
name: Connected Feedback Vertex Set
aliases: [CFVS, Minimum Connected Feedback Vertex Set, Connected FVS]
category: graphs
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Feedback Vertex Set (one of Karp's 21 NP-complete problems) reduces to it by adding a universal vertex (`feedback-vertex-set--to--connected-feedback-vertex-set`); membership in NP is immediate. Grigoriev and Sitters (WG 2009) show NP-hardness on planar graphs. TODO(verify): Wikipedia has no page on the problem; no classic source was checked."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a connected feedback vertex set (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$ is a connected feedback vertex set, as $G$ is connected)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A connected graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle and $G[S]$ is connected?"
    generalises: [decision-max-degree-5]
  optimisation:
    kind: optimisation
    input: "A connected graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has no cycle and $G[S]$ is connected."
  search:
    kind: search
    input: "A connected graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle and $G[S]$ is connected, or report that none exists."
  decision-max-degree-3:
    kind: decision
    input: "A connected graph $G = (V, E)$ of maximum degree at most $3$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle and $G[S]$ is connected?"
  decision-max-degree-4:
    kind: decision
    input: "A connected graph $G = (V, E)$ of maximum degree at most $4$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle and $G[S]$ is connected?"
    generalises: [decision-max-degree-3]
  decision-max-degree-5:
    kind: decision
    input: "A connected graph $G = (V, E)$ of maximum degree at most $5$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has no cycle and $G[S]$ is connected?"
    generalises: [decision-max-degree-4]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility (Cygan et al., arXiv 1103.0534, construct a solution vertex by vertex with the constrained version)."
related:
  - { problem: feedback-vertex-set, relation: variant }
  - { problem: connected-vertex-cover, relation: variant }
  - { problem: connected-dominating-set, relation: variant }
review: { approved_by: null, date: null }
