id: group-steiner-tree
name: Group Steiner Tree
aliases: [GST]
category: networks
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Steiner Tree, one of Karp's NP-complete problems, is the special case in which every group has one vertex (reduction steiner-tree--to--group-steiner-tree; also observed by Misra et al., Section 1); membership in NP is immediate."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  g: { meaning: "the number of groups" }
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of edges of a group Steiner tree (optimisation)" }
constraints:
  - { constraint: "k \\le n", because: "A tree has fewer edges than vertices, so every instance with $k \\ge n$ is decided by checking whether some connected component meets every group." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$, sets $S_1, \\dots, S_g \\subseteq V$ (groups), and an integer $k$."
    question: "Is there a tree $H \\subseteq G$ with at most $k$ edges that contains at least one vertex of $S_i$ for every $i \\in \\{1, \\dots, g\\}$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$ and sets $S_1, \\dots, S_g \\subseteq V$ (groups)."
    goal: "Find the minimum number of edges of a tree $H \\subseteq G$ that contains at least one vertex of $S_i$ for every $i \\in \\{1, \\dots, g\\}$, or report that none exists."
  search:
    kind: search
    input: "A graph $G = (V, E)$, sets $S_1, \\dots, S_g \\subseteq V$ (groups), and an integer $k$."
    goal: "Find a tree $H \\subseteq G$ with at most $k$ edges that contains at least one vertex of $S_i$ for every $i \\in \\{1, \\dots, g\\}$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A graph $G = (V, E)$, sets $S_1, \\dots, S_g \\subseteq V$ (groups), and edge weights $w \\colon E \\to \\mathbb{Z}_{\\ge 1}$."
    goal: "Find the minimum weight $\\sum_{e \\in E(H)} w(e)$ of a tree $H \\subseteq G$ that contains at least one vertex of $S_i$ for every $i \\in \\{1, \\dots, g\\}$, or report that none exists."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility (delete an edge and test again)."
related:
  - { problem: steiner-tree, relation: special-case }
  - { problem: directed-steiner-tree, relation: variant }
