id: set-cover
name: Set Cover
aliases: [Minimum Set Cover, Set Covering, SC]
category: sets
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/List_of_NP-complete_problems"
      - "https://arxiv.org/pdf/1902.10349"
      - "https://www.iitg.ac.in/rinkulu/note/npprobs-note.pdf"
    note: "Set Covering is one of Karp's 21 NP-complete problems."
objects:
  n: number of elements of the universe
  m: number of sets in the family
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of sets in a cover (optimisation)" }
constraints:
  - { constraint: "k \\le n", because: "A minimal cover has at most one set per element, so every instance with $k \\ge n$ is decided by checking whether $\\mathcal{F}$ covers $U$." }
  - { constraint: "k \\le m", because: "Every instance with $k \\ge m$ is decided by checking whether $\\mathcal{F}$ covers $U$." }
versions:
  decision:
    kind: decision
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and an integer $k$."
    question: "Is there a subfamily $S \\subseteq \\mathcal{F}$ with $|S| \\le k$ such that every element of $U$ is in some set of $S$?"
  optimisation:
    kind: optimisation
    input: "A finite universe $U$ and a family $\\mathcal{F}$ of subsets of $U$."
    goal: "Find the minimum size of a subfamily $S \\subseteq \\mathcal{F}$ such that every element of $U$ is in some set of $S$, or report that none exists."
  search:
    kind: search
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and an integer $k$."
    goal: "Find a subfamily $S \\subseteq \\mathcal{F}$ with $|S| \\le k$ such that every element of $U$ is in some set of $S$, or report that none exists."
  weighted:
    kind: optimisation
    input: "A finite universe $U$, a family $\\mathcal{F}$ of subsets of $U$, and set weights $w \\colon \\mathcal{F} \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{F \\in S} w(F)$ of a subfamily $S \\subseteq \\mathcal{F}$ such that every element of $U$ is in some set of $S$, or report that none exists."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: hitting-set, relation: dual }
  - { problem: dominating-set, relation: special-case }
implementations:
  as_of: 2026-11-11
  ranked: [uzl-pace-2025, bad-dominating-set-maker]
