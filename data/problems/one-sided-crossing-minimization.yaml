id: one-sided-crossing-minimization
name: One-Sided Crossing Minimization
aliases: [OSCM, 1-Layer Crossing Minimization, One-Layer Crossing Minimization, Two-Layer Crossing Minimization with One Fixed Layer]
category: graph
complexity:
  class: NP-complete
  source:
    paper: eades-wormald-1994
    attested_by:
      - "https://link.springer.com/article/10.1007/s00453-014-9872-x"
      - "https://www.cs.mcgill.ca/~sue/papers/2layer.pdf"
      - "https://users.monash.edu/~davidwo/papers/Dujmovic-etal-GD01.pdf"
    note: "Kobayashi and Tamaki (Algorithmica 2015, open access): \"OSCM is known to be NP-complete\", citing Eades and Wormald (1994); Dujmović et al. (GD 2001 and the 2005 journal draft): 1- and 2-Layer Crossing Minimization are NP-complete, citing Eades and Wormald and Garey and Johnson (1983). Muñoz, Unger and Vrťo (GD 2001) show NP-hardness for sparse graphs. Wikipedia's choice of source was not checked."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of crossings (optimisation)" }
constraints:
  - { constraint: "k \\le m(m - 1)/2", because: "At most every pair of edges crosses, so every instance with $k \\ge m(m-1)/2$ is a yes-instance." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
versions:
  decision:
    kind: decision
    input: "A bipartite graph $G = (X \\cup Y, E)$ with every edge between $X$ and $Y$, a linear order $<_X$ of $X$, and an integer $k$."
    question: "Is there a linear order $<_Y$ of $Y$ with at most $k$ crossings, a crossing being a pair of edges $xy, x'y'$ with $x <_X x'$ and $y' <_Y y$?"
  optimisation:
    kind: optimisation
    input: "A bipartite graph $G = (X \\cup Y, E)$ with every edge between $X$ and $Y$, and a linear order $<_X$ of $X$."
    goal: "Find the minimum number of crossings of a linear order $<_Y$ of $Y$, a crossing being a pair of edges $xy, x'y'$ with $x <_X x'$ and $y' <_Y y$."
  search:
    kind: search
    input: "A bipartite graph $G = (X \\cup Y, E)$ with every edge between $X$ and $Y$, a linear order $<_X$ of $X$, and an integer $k$."
    goal: "Find a linear order $<_Y$ of $Y$ with at most $k$ crossings, a crossing being a pair of edges $xy, x'y'$ with $x <_X x'$ and $y' <_Y y$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: crossing-number, relation: variant }
