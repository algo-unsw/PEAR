id: bounded-degree-vertex-deletion
name: Bounded-Degree Vertex Deletion
aliases: [BDD, d-Bounded-Degree Vertex Deletion, Bounded Degree Deletion]
category: graph
complexity:
  class: NP-complete
  source:
    folklore: true
    note: "Vertex Cover is the special case $d = 0$ (see the reduction from Vertex Cover); membership in NP is clear. Ganian, Klute and Ordyniak (Algorithmica 2021, Section 1) state that BDD is \"NP-complete when parameterized only by $d$ (as witnessed by the case of $d = 0$, i.e., Vertex Cover)\", and Xiao (arXiv 1601.00163, abstract) that it \"is NP-hard for each fixed $d \\geq 0$\"."
    reference: { paper: ganian-klute-ordyniak-2018, version: journal, statement: "Section 1" }
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of vertices whose deletion leaves a graph of maximum degree at most $d$ (optimisation)" }
  d: { meaning: "the degree bound $d$ in the input" }
  tcw: { meaning: "the treecut width of $G$ (Wollan; as defined in Ganian, Klute and Ordyniak, Algorithmica 2021, Section 2): the minimum width of a treecut decomposition, where the width is the maximum adhesion and torso size over all nodes" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$), answered in polynomial time." }
  - { constraint: "d \\le n", because: "Every instance with $d \\ge n - 1$ is a yes-instance ($S = \\emptyset$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and integers $d \\ge 0$ and $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has maximum degree at most $d$?"
    generalises: [decision-d-at-least-3, decision-d-2]
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$ and an integer $d \\ge 0$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $G - S$ has maximum degree at most $d$."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and integers $d \\ge 0$ and $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has maximum degree at most $d$, or report that none exists."
  decision-d-at-least-3:
    kind: decision
    input: "A graph $G = (V, E)$ and integers $d \\ge 3$ and $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has maximum degree at most $d$?"
  decision-d-2:
    kind: decision
    input: "A graph $G = (V, E)$, the integer $d = 2$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $G - S$ has maximum degree at most $d$?"
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: vertex-cover, relation: variant }
  - { problem: hitting-set, relation: generalisation }
