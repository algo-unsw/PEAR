id: total-dominating-set
name: Total Dominating Set
aliases: [Minimum Total Dominating Set, Total Domination, TDS]
category: graph
complexity:
  class: NP-complete
  source:
    paper: pfaff-laskar-hedetniemi-1983
    attested_by:
      - "https://arxiv.org/pdf/2007.11997"
      - "https://core.ac.uk/download/512009421.pdf"
      - "https://ideas.repec.org/a/spr/jcomop/v50y2025i5d10.1007_s10878-025-01360-w.html"
    note: "NP-complete even for bipartite graphs (Pfaff, Laskar and Hedetniemi 1983). Wikipedia gives no source for it. Some papers cite instead Laskar, Pfaff, Hedetniemi and Hedetniemi, On the algorithmic complexity of total domination, SIAM J. Algebraic Discrete Methods 5(3), 1984."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a total dominating set (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is decided in polynomial time: $S = V$ is a total dominating set if and only if $G$ has no isolated vertex." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that every vertex has a neighbour in $S$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that every vertex has a neighbour in $S$, or report that none exists."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that every vertex has a neighbour in $S$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: dominating-set, relation: variant }
  - { problem: set-cover, relation: generalisation }
