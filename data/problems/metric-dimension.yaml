id: metric-dimension
name: Metric Dimension
aliases: [Resolving Set, Minimum Resolving Set, Metric Basis, MD]
category: graph
complexity:
  class: NP-complete
  source:
    paper: garey-johnson-1979
    attested_by:
      - "https://en.wikipedia.org/wiki/Metric_dimension_(graph_theory)"
      - "https://arxiv.org/pdf/2307.08149"
      - "https://drops.dagstuhl.de/storage/00lipics/lipics-vol327-stacs2025/html/LIPIcs.STACS.2025.33/LIPIcs.STACS.2025.33.html"
    note: "Problem GT61 in Garey and Johnson (A1.5, p. 204), as on Wikipedia. Foucaud et al. (arXiv 2307.08149v5, Introduction; STACS 2025, Introduction): Metric Dimension \"was first shown to be NP-complete in general graphs in Garey and Johnson's book\"."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision), or the minimum size of a resolving set (optimisation)" }
  vc: { shared: vertex-cover-number }
  tw: { shared: treewidth }
  diam: { meaning: "the diameter of $G$: the maximum distance $d(u, v)$ over all pairs of vertices" }
  ml: { meaning: "the max leaf number of $G$: the maximum number of leaves of a spanning tree of $G$" }
  mw: { meaning: "the modular-width of $G$: the maximum number of children of a prime node in the modular decomposition of $G$ (the graph is built from single vertices by disjoint union, join, and substituting graphs for the vertices of a prime graph with at most $mw$ vertices)" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n - 1$ is a yes-instance: all vertices but one form a resolving set." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "vc \\le n", because: "The whole vertex set is a vertex cover." }
  - { constraint: "tw \\le vc", because: "For a vertex cover $C$, the bags $C \\cup \\{v\\}$ for $v \\notin C$, arranged on a path, form a tree decomposition of width $|C|$." }
  - { constraint: "diam \\le n", because: "A shortest path in a connected graph has at most $n - 1$ edges." }
  - { constraint: "ml \\le n", because: "A spanning tree has at most $n$ leaves." }
  - { constraint: "mw \\le n", because: "A prime node of the modular decomposition has at most $n$ children." }
versions:
  decision:
    kind: decision
    input: "A connected graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that for every two distinct vertices $u, v \\in V$ some $w \\in S$ has $d(w, u) \\ne d(w, v)$?"
  optimisation:
    kind: optimisation
    input: "A connected graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that for every two distinct vertices $u, v \\in V$ some $w \\in S$ has $d(w, u) \\ne d(w, v)$."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation]
    because: "Binary search on $k$."
related:
  - { problem: hitting-set, relation: generalisation }
