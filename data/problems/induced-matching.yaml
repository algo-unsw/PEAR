id: induced-matching
name: Induced Matching
aliases: [Maximum Induced Matching, Strong Matching, MIM]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: stockmeyer-vazirani-1982
    attested_by:
      - "https://arxiv.org/abs/2212.13962"
      - "https://en.wikipedia.org/wiki/Induced_matching"
      - "https://tcs.rwth-aachen.de/~sikdar/index_files/mim.pdf"
    note: "Koana (STACS 2023) states that NP-hardness was proven independently by Stockmeyer and Vazirani (1982) and Cameron (1989). Wikipedia states NP-completeness without a source; Moser and Sikdar call the problem NP-complete."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the maximum size of an induced matching (optimisation)" }
  tw: { shared: treewidth }
  cw: { shared: clique-width }
  b: { meaning: "the below-average parameter $(\\nu(G) + \\alpha(G))/2 - k$, where $\\nu(G)$ is the maximum size of a matching and $\\alpha(G)$ the maximum size of an independent set of $G$ (Koana's Induced Matching Below Average)" }
  p: { meaning: "the below-trivial-guarantee parameter $n - 2k$: the number of vertices not covered by an induced matching of size $k$ (the deletion budget of Almost Induced Matching)" }
constraints:
  - { constraint: "k \\le n / 2", because: "An induced matching is a matching, so it has at most $n/2$ edges; every instance with $k > n/2$ is a no-instance." }
  - { constraint: "k \\le m", because: "An induced matching is a set of edges; every instance with $k > m$ is a no-instance." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
  - { constraint: "cw \\le n", because: "Giving every vertex its own label, every graph is built with $n$ labels." }
  - { constraint: "b \\le n", because: "$\\nu(G) \\le n/2$ and $\\alpha(G) \\le n$, so $b \\le 3n/4$." }
  - { constraint: "p \\le n", because: "$p = n - 2k$ and $k \\ge 0$." }
  - { constraint: "b \\le p / 2", because: "$\\nu(G) + \\alpha(G) \\le \\tau(G) + \\alpha(G) = n$ for the vertex cover number $\\tau(G)$, so $b \\le n/2 - k = p/2$ (Koana, Section 1)." }
versions:
  decision:
    kind: decision
    input: "A graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq E$ with $|S| \\ge k$ such that no two edges of $S$ share an endpoint and no edge of $G$ joins an endpoint of one edge of $S$ to an endpoint of another edge of $S$?"
  optimisation:
    kind: optimisation
    input: "A graph $G = (V, E)$."
    goal: "Find the maximum size of a set $S \\subseteq E$ such that no two edges of $S$ share an endpoint and no edge of $G$ joins an endpoint of one edge of $S$ to an endpoint of another edge of $S$."
  search:
    kind: search
    input: "A graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq E$ with $|S| \\ge k$ such that no two edges of $S$ share an endpoint and no edge of $G$ joins an endpoint of one edge of $S$ to an endpoint of another edge of $S$, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility (delete an edge and test again)."
related:
  - { problem: independent-set, relation: variant }
