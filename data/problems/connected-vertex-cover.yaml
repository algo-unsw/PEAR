id: connected-vertex-cover
name: Connected Vertex Cover
aliases: [CVC, Minimum Connected Vertex Cover]
category: graph
complexity:
  class: NP-complete
  source:
    paper: garey-johnson-1977
    attested_by:
      - "https://arxiv.org/pdf/1706.08050"
      - "https://www.lamsade.dauphine.fr/CahiersLAMSADE/CahiersLamsade262.pdf"
      - "https://durham-repository.worktribe.com/OutputFile/1294695"
    note: "Garey and Johnson proved Connected Vertex Cover NP-complete on planar graphs of maximum degree 4 (in their rectilinear Steiner tree paper), as these three papers state. Not on Wikipedia's list."
objects:
  n: number of vertices
  m: number of edges
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a connected vertex cover (optimisation)" }
  tw: { shared: treewidth }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is decided in polynomial time ($S = V$ is a solution, as $G$ is connected)." }
  - { constraint: "m \\le n(n - 1)/2", because: "A simple graph has at most $n(n-1)/2$ edges." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A connected graph $G = (V, E)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that every edge has an endpoint in $S$ and $G[S]$ is connected?"
  optimisation:
    kind: optimisation
    input: "A connected graph $G = (V, E)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that every edge has an endpoint in $S$ and $G[S]$ is connected."
  search:
    kind: search
    input: "A connected graph $G = (V, E)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that every edge has an endpoint in $S$ and $G[S]$ is connected, or report that none exists."
  weighted:
    kind: optimisation
    input: "A connected graph $G = (V, E)$ and vertex weights $w \\colon V \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{v \\in S} w(v)$ of a set $S \\subseteq V$ such that every edge has an endpoint in $S$ and $G[S]$ is connected."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: vertex-cover, relation: variant }
  - { problem: connected-dominating-set, relation: variant }
