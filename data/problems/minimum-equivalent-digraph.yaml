id: minimum-equivalent-digraph
name: Minimum Equivalent Digraph
aliases: [Minimum Equivalent Graph, MEG, MED, Minimum Equivalent Subdigraph]
category: graph
complexity:
  class: NP-complete
  source:
    paper: aho-garey-ullman-1972
    attested_by:
      - "https://en.wikipedia.org/wiki/Transitive_reduction"
      - "https://arxiv.org/abs/cs/0205040"
      - "https://imada.sdu.dk/u/jbj/DM209/JBJAYMSSS.pdf"
      - "https://www.csc.kth.se/tcs/compendium/node49.html"
    note: "As on Wikipedia (Transitive reduction: \"it is NP-hard to find the smallest subgraph of a given graph G with the same reachability (its minimum equivalent graph)\"), which cites Aho, Garey and Ullman (SIAM J. Comput. 1972). Khuller, Raghavachari and Young (arXiv cs/0205040, abstract: \"This problem is NP-hard\"), Bang-Jensen and Yeo (Discrete Applied Mathematics 2008, Section 1: the strongly connected case \"generalizes the hamiltonian cycle problem and hence is NP-hard\") and Kann's compendium (APX-complete; Garey and Johnson GT33) confirm it. The decision version is in NP (problem GT33 of Garey and Johnson, as the compendium says), hence NP-complete. TODO(verify): no open copy of Aho–Garey–Ullman was found."
objects:
  n: number of vertices
  m: number of arcs
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum number of arcs of an equivalent subdigraph (optimisation)" }
  W: { meaning: "the maximum arc weight (weighted version)", poly_bounded: false }
constraints:
  - { constraint: "k \\le m", because: "Every instance with $k \\ge m$ is a yes-instance ($A' = A$), answered in polynomial time." }
  - { constraint: "m \\le n(n - 1)", because: "A digraph without loops and parallel arcs has at most $n(n-1)$ arcs." }
versions:
  decision:
    kind: decision
    input: "A digraph $D = (V, A)$ without loops or parallel arcs and an integer $k$."
    question: "Is there a set $A' \\subseteq A$ with $|A'| \\le k$ such that for all $u, v \\in V$, $(V, A')$ has a directed path from $u$ to $v$ if and only if $D$ has one?"
  optimisation:
    kind: optimisation
    input: "A digraph $D = (V, A)$ without loops or parallel arcs."
    goal: "Find the minimum size of a set $A' \\subseteq A$ such that for all $u, v \\in V$, $(V, A')$ has a directed path from $u$ to $v$ if and only if $D$ has one."
  search:
    kind: search
    input: "A digraph $D = (V, A)$ without loops or parallel arcs and an integer $k$."
    goal: "Find a set $A' \\subseteq A$ with $|A'| \\le k$ such that for all $u, v \\in V$, $(V, A')$ has a directed path from $u$ to $v$ if and only if $D$ has one, or report that none exists."
  weighted:
    kind: optimisation
    input: "A digraph $D = (V, A)$ without loops or parallel arcs and arc weights $w \\colon A \\to \\mathbb{Z}_{\\ge 0}$."
    goal: "Find the minimum weight $\\sum_{a \\in A'} w(a)$ of a set $A' \\subseteq A$ such that for all $u, v \\in V$, $(V, A')$ has a directed path from $u$ to $v$ if and only if $D$ has one."
    generalises: [optimisation]
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: hamiltonian-cycle, relation: generalisation }
lean: { status: none }
review: { approved_by: null, date: null }
