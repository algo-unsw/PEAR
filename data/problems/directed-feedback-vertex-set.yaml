id: directed-feedback-vertex-set
name: Directed Feedback Vertex Set
aliases: [DFVS, Directed FVS]
category: graphs
complexity:
  class: NP-complete
  source:
    paper: karp-1972
    attested_by:
      - "https://arxiv.org/abs/2410.15411"
      - "https://en.wikipedia.org/wiki/Karp%27s_21_NP-complete_problems"
      - "https://www.iitg.ac.in/rinkulu/note/npprobs-note.pdf"
    note: "Karp's Feedback Node Set asks for a set of vertices meeting every directed cycle of a digraph, so it is this problem. Xiong and Xiao (arXiv:2410.15411v1, Section 1, opened) state that it is among Karp's first 21 NP-complete problems; the abstracts of arXiv:2003.02483 (Göke, Marx, Mnich) and arXiv:1112.5359 (Kelk et al.) say the same. TODO(verify): the Wikipedia page and the IIT Guwahati note were returned by a web search on 20 November 2026 (and the note is cited for Feedback Node Set in feedback-vertex-set.yaml) but could not be opened in this session."
objects:
  n: number of vertices
  m: number of arcs
  N: total encoding length of the input
parameters:
  k: { meaning: "the solution size: the integer $k$ in the input (decision, search), or the minimum size of a directed feedback vertex set (optimisation)" }
  tw: { shared: treewidth, of: "the underlying undirected graph" }
constraints:
  - { constraint: "k \\le n", because: "Every instance with $k \\ge n$ is a yes-instance ($S = V$)." }
  - { constraint: "m \\le n(n - 1)", because: "A directed graph without loops or parallel arcs has at most $n(n-1)$ arcs." }
  - { constraint: "tw \\le n", because: "A single bag containing all vertices is a tree decomposition of width $n - 1$." }
versions:
  decision:
    kind: decision
    input: "A directed graph $D = (V, A)$ and an integer $k$."
    question: "Is there a set $S \\subseteq V$ with $|S| \\le k$ such that $D - S$ has no directed cycle?"
  optimisation:
    kind: optimisation
    input: "A directed graph $D = (V, A)$."
    goal: "Find the minimum size of a set $S \\subseteq V$ such that $D - S$ has no directed cycle."
  search:
    kind: search
    input: "A directed graph $D = (V, A)$ and an integer $k$."
    goal: "Find a set $S \\subseteq V$ with $|S| \\le k$ such that $D - S$ has no directed cycle, or report that none exists."
default_version: decision
shared_bounds:
  - versions: [decision, optimisation, search]
    because: "Binary search on $k$ and self-reducibility."
related:
  - { problem: feedback-vertex-set, relation: undirected }
  - { problem: feedback-arc-set, relation: variant }
  - { problem: vertex-cover, relation: special-case }
