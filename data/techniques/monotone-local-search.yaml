    version: decision
    universe: n
    budget: k
    setting:
      statement: "Section 1 of arXiv v1 (Min-Ones $d$-SAT and $d$-Hitting Set)"
      because: "A special case of Min-Ones 3-SAT, cast as $\\Phi$-Subset with $U_I$ the variables (here the elements) and $\\mathcal{F}_I$ the solutions of weight at most $k$."
    extension:
      statement: "Section 1 and Table 1 of arXiv v1 ($d$-Hitting Set)"
      because: "The paper applies the theorems to $d$-Hitting Set with algorithms for the problem itself."
  - problem: feedback-vertex-set
    version: decision-max-degree-4
    universe: n
    budget: k
    setting:
      statement: "Section 1 of arXiv v1 ($\\Pi$-Vertex Deletion)"
      because: "Vertex deletion into forests on graphs of maximum degree at most $4$: $U_I = V(G)$ and $\\mathcal{F}_I$ is the family of sets $S$ of at most $k$ vertices with $G - S$ forest. Extended to the bounded-degree versions by Serge Gaspers, 21 November 2026."
    extension:
      statement: "Section 1 of arXiv v1 ($\\Pi$-Vertex Deletion)"
      because: "Deleting the vertices in $X$ solves the extension version with the same running time, and the graphs of maximum degree at most $4$ are closed under vertex deletion, so $G - X$ is again an instance of this version."
