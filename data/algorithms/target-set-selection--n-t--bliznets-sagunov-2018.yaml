  note: "Theorem 2: \"For Target Set Selection with all thresholds bounded by $t$ there is a $O^*((2-\\epsilon_t)^n)$-time algorithm\", with $\\epsilon_t > 0$ depending only on $t$; stated for the more general problem with a target $\\ell$ of activated vertices, which gives this problem with $\\ell = n$. Read in arXiv v2 (6 September 2018); the same statement is Theorem 4 of the IPEC 2018 version and Theorem 2 of the Algorithmica 2023 version. Corollary 1 of the same paper: $O^*(1.99001^n)$ when $\\mathrm{thr}(v) \\le \\lceil \\deg(v)/3 \\rceil$ for every $v$ (not entered: no such version)."
