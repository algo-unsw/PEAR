  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (a): Feedback Vertex Set by a Monte Carlo algorithm in time $2^{m/6+o(n)} \le 2^{n/3+o(n)} = O(1.2600^n)$ on graphs with $m$ edges and maximum degree 4. Proof (Appendix A.7.3): the Monte Carlo algorithms of Bojikian, Chekan, Hegerfeld and Kratsch for a given linear ordering of cutwidth ctw, in time $2^{\mathrm{ctw}} n^{O(1)}$ (their Theorems 12 and 43), run on an ordering computed in deterministic polynomial time (Theorem 10.3), of cutwidth at most $\frac m6 + o(n)$. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint. Stored in the theorem''s precise form; the rounded $O(1.2600^n)$ is the theorem''s own rounding.'
