  quantum: false
source:
  paper: samer-szeider-2007
  statements:
    author-copy: { statement: "Theorem 3 (with the standard dependency scheme: Theorem 1 and Proposition 3)" }
  note: "Theorem 3: for C in {QHorn, Q2CNF} and a cumulative, tractable dependency scheme, evaluating QCNF formulas is fixed-parameter tractable parameterized by the size of a smallest strong C-backdoor set; the standard dependency scheme is cumulative (Theorem 1) and its dependency sets are computed in $O(n)$ time (Proposition 3). The backdoor set is computed, not given. The proof finds it with a 3-Hitting Set algorithm running in $O(2.270^k + n)$ (Niedermeier, Rossmanith) and then evaluates at most $2^k$ formulas $F[\\tau]$ in Q2CNF, each in polynomial time; stored as stated (FPT). Read in the author copy at ac.tuwien.ac.at."
