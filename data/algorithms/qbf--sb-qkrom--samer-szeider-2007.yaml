id: qbf--sb-qkrom--samer-szeider-2007
problem: qbf
proved_for: decision
bound:
  as_stated: "f(sb_{qkrom}) N^{O(1)}"
  notation: O
  parameters: [sb_qkrom, N]
properties:
  randomized: false
  space:
    class: polynomial
    bound: "Not stated; educated guess: polynomial. A bounded search for the backdoor set (hitting set by branching), then the at most $2^k$ assignments to it are tried one at a time, each leaving a polynomial-time Q2CNF formula; no memoization or dynamic programming found."
  algebraic: false
