id: steiner-forest--d--chitnis-feldmann-manurangsi-2017
problem: steiner-forest
proved_for: weighted
bound:
  as_stated: '2^{O(d)} n^{O(1)}'
  notation: O
  parameters:
  - d
  - n
properties:
  randomized: false
  space:
    class: exponential
    note: 'Not stated; educated guess: exponential. Dynamic programming over all subsets of the demand pairs ($\mathrm{OPT}[X]$), each subset solved with the Dreyfus–Wagner dynamic program over subsets of terminals.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: chitnis-feldmann-manurangsi-2017
  statements:
    journal:
      statement: 'Proof of Theorem 1.6 (Section 3)'
  note: 'Steiner Forest with $k$ demand pairs and non-negative edge weights in $2^{O(k)} n^{O(1)}$ time: dynamic programming over subsets $X$ of the demand pairs, $\mathrm{OPT}[X] = \min_{\emptyset \ne Y \subseteq X} (\mathrm{DF}[Y] + \mathrm{OPT}[X \setminus Y])$ with Dreyfus–Wagner for $\mathrm{DF}[Y]$; the sum is bounded by $9 n^{O(1)} \sum_i \binom{k}{i} 9^i$. Read in the accepted manuscript of the journal version (White Rose repository) and in the LaTeX source of arXiv v7. The ESA 2018 version omits this proof and states its Theorem 6 with $2^{O(k \log k)} n^{O(1)}$; an older arXiv version (fetched as arxiv.org/pdf/1707.06499.pdf) also has $2^{O(k \log k)}$, by trying every partition of the terminals.'
