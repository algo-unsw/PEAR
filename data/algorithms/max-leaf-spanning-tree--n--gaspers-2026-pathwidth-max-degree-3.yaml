  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (b): "Maximum Leaf Spanning Tree has the bounds of Connected Dominating Set", which on graphs of maximum degree 3 is $3^{c_3 n+o(n)} = O(1.1661^n)$ by a Monte Carlo algorithm ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). Proof (Appendix A.7.3): a connected graph with $n \ge 3$ vertices has a spanning tree with at least $\ell$ leaves if and only if it has a connected dominating set of at most $n - \ell$ vertices, so the Connected Dominating Set algorithms apply. For maximum degree 3: the cutwidth algorithm of Bojikian et al. (their Theorem 23). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
