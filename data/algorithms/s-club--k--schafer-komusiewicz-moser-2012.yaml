  note: "Theorem 4: $s$-Club, $s \\ge 2$, is fixed-parameter tractable in $k$. Stored in the form of the introduction, $O((k-2)^k \\cdot k! \\cdot k^3 |V| + |V||E|)$; the text extracted from the theorem statement reads \"$O((k-2)^k \\cdot k! \\cdot kn + nm)$\", which may have lost a superscript (TODO(verify): the polynomial factor in Theorem 4). The stored form is implied by either reading. The paper asks for size exactly $k$; Hartung, Komusiewicz, Nichterlein and Suchý (arXiv 1305.3735, footnote in Section 1.1) state that the fixed-parameter tractability results other than the dual one hold for both variants. Read in the authors' copy (\"To appear in Optimization Letters\")."
