  note: 'Try all $2^n$ sets $A \subseteq V$; for each with $\emptyset \ne A \ne V$, list the edges with exactly one endpoint in $A$ and check in $O(n^2)$ time that they form a matching with at most $k$ edges (brute force baseline).'
