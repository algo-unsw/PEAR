id: 3-hitting-set--k--kundu-panolan-saurabh-xue-zehavi-2026
problem: 3-hitting-set
proved_for: search
bound:
  as_stated: '2^{O(k (\log\log k)^{2} / \sqrt{\log k})} N^{O(1)}'
  notation: O
  parameters:
  - k
  - N
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Educated guess: polynomial. The reduction builds polynomial-size formulas and calls the SAT algorithm of the Quantitative d-SAT Assumption, Anthropic''s algorithm, whose space we also guess to be polynomial; no memoization or dynamic programming found in the reduction.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
uses:
- sharp-3-sat--n--anthropic-2026
source:
  paper: kundu-panolan-saurabh-xue-zehavi-2026
  statements:
    stoc-submission:
      statement: 'Theorem 6.13 with $d = 3$, under the Quantitative d-SAT Assumption (Assumption 4.2); also Theorem 1.1'
  note: 'Deterministic; decides and finds a hitting set; stated as $\hat H_d(k)|I|^{O(1)}$ with $\hat H_d(k) = 2^{O_d(k\eta(k)^2/\sqrt{\lambda(k)})}$ ($\lambda(t) = \log_2(t+2)$, $\eta(t) = \log_2\log_2(t+4)$). Uses only the variable-based SAT bound for CNF formulas of width at most $\max\{3, 2d\} = 6$; Anthropic''s theorem covers every width.'
