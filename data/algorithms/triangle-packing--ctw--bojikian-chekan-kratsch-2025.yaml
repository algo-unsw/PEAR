  note: "'There exists an algorithm that given an instance $(G, k)$ of Triangle Packing together with a linear arrangement of $G$ of width at most ctw, runs in time $O^*(\\sqrt[3]{3}^{ctw})$ and outputs whether $G$ admits a triangle packing of size $k$'; stored as $3^{ctw/3}$. The linear arrangement is part of the input (PEAR's `given` field only records tree decompositions). Tight under SETH even for Partition into Triangles (same section)."
