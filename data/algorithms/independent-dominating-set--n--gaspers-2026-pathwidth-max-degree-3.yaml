      statement: 'Theorem 11.4(c)'
      page: 79
  note: 'Theorem 11.4 (bounded-degree graph problems), Section 11.4. Part (c): if $\Delta(G) \le 3$, a minimum independent dominating set can be found in time and space $O^*(3^{c_3 n_3+o(n)}) = O(1.1661^n)$ ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). The dynamic program for Independent Dominating Set in time $O(n^3 3^{\mathrm{tw}})$ of van Rooij ([vR11], Proposition 11.11) over a path decomposition of width at most $c_3 n_3 + o(n) \le c_3 n + o(n)$ (Lemma 11.2) for maximum degree 3, or $\beta_4(G) + o(n) \le F_4 n + o(n)$ (Theorem 7.1 and Theorem 1.5) for maximum degree 4, computed in polynomial time. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
