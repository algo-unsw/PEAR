  note: 'Time $O^*(2^{n/2})$ and space $O^*(2^{n/4})$, deterministic: Horowitz and Sahni''s meet in the middle, with the elements split into four quarters and the subset sums of each half generated in sorted order from two quarters with a min-heap instead of being stored (Wikipedia). The abstracts of Nederlof and Węgrzycki (STOC 2021) and of Belova, Chukhin, Kulikov and Mihajlin (arXiv 2402.13170) both describe it as the $O^*(2^{0.5n})$-time, $O^*(2^{0.25n})$-space algorithm for Subset Sum; Wikipedia and lacker.io give the same bounds. No open copy found.'
