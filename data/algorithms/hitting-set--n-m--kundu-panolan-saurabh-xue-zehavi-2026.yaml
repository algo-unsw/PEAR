  note: 'The universe of $m$ sets and one indexed set per element turn a Hitting Set instance into a Set Cover instance with $t = n + m$, with the same solutions; Theorem 8.1 then counts the hitting sets of size at most $b$ deterministically in time $2^{O(t\eta(t)^2/\sqrt{\lambda(t)})}$ and recovers one with at most $n + 1$ counting calls. Width at most three. Assumption 4.5 is OpenAI''s theorem (Section 4.2), whose Lean statement was checked on 12 November 2026.'
