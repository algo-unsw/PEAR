source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem 14.1(c)'
      page: 86
  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (c): Undirected Longest Path by a Monte Carlo algorithm in time $(2+\sqrt2)^{11n/32+o(n)} = O(1.5252^n)$ on graphs of maximum degree 5. Proof (Appendix A.7.3): Cygan, Kratsch and Nederlof decide whether a graph has a path of length $k$ in time $(2+\sqrt2)^{\mathrm{pw}} n^{O(1)}$ for a given path decomposition (their Theorem 4.6, stated with a proof sketch), run on the path decomposition of Theorem 10.1; a path of length $k$ has $k + 1$ vertices. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
