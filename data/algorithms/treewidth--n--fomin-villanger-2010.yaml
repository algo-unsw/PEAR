id: treewidth--n--fomin-villanger-2010
problem: treewidth
proved_for: optimisation
bound:
  as_stated: O^*(1.734601^{n})
  notation: O*
  parameters:
  - n
properties:
  randomized: false
  space:
    class: exponential
    note: 'Not stated; educated guess: exponential. The algorithm stores the list of potential maximal cliques and runs a dynamic programme over it (as for the entered $O(1.7549^n)$ algorithm, which the authors call exponential-space).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: fomin-villanger-2010
  statements:
    stacs:
      statement: 'Theorem 5.5: "All potential maximal cliques of an $n$-vertex graph can be enumerated in time $O(1.734601^n)$."'
  note: 'Combines two read statements (added at Serge''s request, 27 November 2026): the potential maximal cliques $\Pi_G$ are enumerated in $O(1.734601^n)$ (Theorem 5.5), and treewidth is computed in $O^*(|\Pi_G|)$ time when $\Pi_G$ is given (Proposition 8 of Fomin, Liedloff, Montealegre and Todinca, arXiv 1404.3882v1, citing Bouchitté and Todinca; their Proposition 7 restates $O(1.7347^n)$ potential maximal cliques, enumerated within the same time). Bergé, Limouzy and Schivre (arXiv 2610.19850v3, Section 1) also say this bound "offers the possibility to solve it in exponential time $O(1.7346^n)$". Section 1 of the STACS paper says the enumeration "directly implies faster exact algorithm computing the treewidth" without stating the bound. Deterministic; outputs a minimal triangulation of minimum width. Improves `treewidth--n--fomin-villanger-2008` ($O(1.7549^n)$).'
formal:
  status: informal
status: valid
