  note: "After Lemma 7: \"To derandomize the algorithm, we only need to derandomize the coloring step, which can be done in a standard way (Naor, Schulman, and Srinivasan 1995)\", by enumerating a family of $e^{t+o(t)} \\log n$ colourings, for a deterministic $(2e)^{t + o(t)} n^{O(1)}$ bound, with $t = k 2^{k} - k$ substituted here. Stated in prose, not as a numbered result. Read in arXiv:2601.08530 (PDF only), 21 November 2026."
