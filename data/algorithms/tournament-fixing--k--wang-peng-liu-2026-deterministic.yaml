id: tournament-fixing--k--wang-peng-liu-2026-deterministic
problem: tournament-fixing
proved_for: decision
bound:
  as_stated: "(2 \\mathrm{e})^{k 2^{k} - k + o(k 2^{k} - k)} n^{O(1)}"
  notation: O
