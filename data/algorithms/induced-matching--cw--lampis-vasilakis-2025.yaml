source:
  paper: lampis-vasilakis-2025
  statements:
    arxiv: { statement: "Theorem in Section 3 (Induced Matching), subsection Algorithm (LaTeX label thm:induced:cw)" }
  note: "Stated as: given $G$ and an irredundant clique-width expression of width $cw$, the algorithm counts the induced matchings of each size $\\ell \\in [0, n/2]$ in time $O^*(3^{cw})$. The expression must be given with the input (any expression can be made irredundant in linear time, Section 2). Optimal under the pw-SETH by the lower bound of the same paper for pathwidth, since $cw \\le pw + 2$. Read in the current arXiv version of 2502.14161 (20 November 2026)."
