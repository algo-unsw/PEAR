source:
  paper: bourgeois-giannakos-lucarelli-2012
  statements:
    cahier: { statement: "Lemma 3", page: 8 }
  note: "Lemma 3: densest k-subgraph \"can be solved on graphs of average degree $\\bar\\Delta \\le 3$ with running time $O^*(2^{21n/46})$\". A graph of maximum degree at most 3 has average degree at most 3, so the bound holds for the max-degree-3 version (a simple step). Theorem 4 extends it to average degree at most $d$: $O^*(2^{\\frac{d - 27/23}{d+1} n})$ for $d \\ge 3$. Read in the open Cahier du LAMSADE 324 (June 2012)."
