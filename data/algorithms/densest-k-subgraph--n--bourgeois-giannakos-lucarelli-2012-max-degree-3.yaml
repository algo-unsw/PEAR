    bound: "Not stated for this lemma; educated guess: polynomial. A branching (branch-and-cut) algorithm analysed by measure and conquer; no memoization or dynamic programming over subsets found. The introduction says the exact algorithms of the paper \"need only polynomial space\", in contrast to Cai's algorithm."
