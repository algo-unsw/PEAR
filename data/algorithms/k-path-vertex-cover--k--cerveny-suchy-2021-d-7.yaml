  note: "Computer-generated branching algorithm (7-PVC); the rule sets are published at the authors' GitHub repository (cited in the paper). Previously known: $O^*(5.951^k)$ (Tsur), as cited in Table 1. The abstract of arXiv v3 quotes $O(2.7^k \\cdot n^{O(1)})$ for 5-PVC while Table 1 gives $O^*(2.636^k)$; the table value is stored. TODO(verify): the WG 2023 version was not opened (paywalled); its numbers may differ."
