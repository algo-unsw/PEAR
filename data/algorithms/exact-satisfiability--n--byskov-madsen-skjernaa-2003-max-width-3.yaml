  note: "Theorem 1: \"The presented algorithms for XSAT and X3SAT run in time $O(2^{0.2325n})$ and $O(2^{0.1379n})$, respectively.\" X3SAT: at most three literals per clause (Section 1). $2^{0.1379} = 1.10030\\ldots$. Wahlström's PhD thesis (Linköping 2007) reports a stronger X3SAT bound; it could not be opened, so this may not be the best known bound. Read in the BRICS report (October 2003)."
