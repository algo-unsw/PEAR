  note: 'Stated for Maximum Bounded-Degree-1 Set (a largest $S$ with $G[S]$ of maximum degree at most 1, i.e. a maximum dissociation set): Theorem 1 solves Max 1-pibds, a generalisation with white and orange vertices, in $O^*(1.4613^n)$, and Section 3 notes that with all vertices white it is Max 1-bds. The complement of a dissociation set is a 3-path vertex cover. Measure and conquer; deterministic. Beats the $O^*(1.4656^n)$ polynomial-space algorithm of Xiao and Kou; their $O^*(1.3659^n)$ algorithm uses exponential space.'
