id: max-internal-spanning-tree--n--gaspers-2026-pathwidth-max-degree-6
problem: max-internal-spanning-tree
proved_for: decision-max-degree-6
bound:
  as_stated: '4^{7n/16 + o(n)}'
  notation: O
  parameters:
  - n
properties:
  randomized:
    error: one-sided
  space:
    class: exponential
    note: 'Exponential space, as stated (Theorem 14.1: all algorithms of the theorem use exponential space).'
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem 14.1(b)'
      page: 86
  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (b): Minimum Leaf Spanning Tree (equivalently, Maximum Internal Spanning Tree: a spanning tree with $\ell$ leaves has $n - \ell$ internal vertices, Appendix A.7.3) by a Monte Carlo algorithm in time $4^{7n/16+o(n)} = O(1.8341^n)$ on graphs of maximum degree 6. Proof (Appendix A.7.3): the Cut&Count algorithm of Cygan et al. in time $4^{\mathrm{tw}} n^{O(1)}$ for a given tree decomposition (their Theorem 1.2), run on a path decomposition computed in polynomial time (Theorem 10.1), of width at most $\frac{7}{16}n + o(n)$. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint. Stored in the theorem''s precise form; the rounded $O(1.8341^n)$ is the theorem''s own rounding.'
