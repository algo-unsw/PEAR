id: max-2-csp--m--gaspers-2026-pathwidth
problem: max-2-csp
proved_for: optimisation
bound:
  as_stated: 'O^*(r^{7m/48 + o(m)})'
  notation: O*
  parameters:
  - r
  - m
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Time and space, as stated (dynamic programming over a path decomposition, $r^{w+1}\mathrm{poly}(n)$ for width $w$).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem 11.3(2)'
      page: 78
  note: 'Theorem 11.3: Max $(r,2)$-CSP (real-valued scores, Section 11.1), or a semiring version, solved in time and space $O^*(r^{(7/48)m+o(m)})$ (part 2), via a path decomposition of width $\frac{7}{48}m + o(m)$ of the constraint graph (Corollary 1.4, Theorem 1.5); an optimal assignment is found (Lemma 11.1(a)). Part (1) gives $O^*(r^{\beta(G)+o(n)})$ with $\beta(G) = \sum_{d \ge 3} a_d n_d$ (Theorem 1.3), part (3) bounds for maximum degree 3 and 4, part (4) bounds by average degree. Previous record $r^{(13/75)m+o(m)}$ (Scott and Sorkin). arXiv v1, 3 November 2026 (read: LaTeX source and the v1 PDF); unrefereed preprint.'
