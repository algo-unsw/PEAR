id: min-ones-sat--d-k--fomin-gaspers-lokshtanov-saurabh-2015
problem: min-ones-sat
proved_for: decision
bound:
  as_stated: O^*(d^{k})
  notation: O*
  parameters:
  - d
  - k
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Not stated; a depth-$k$ branching algorithm with no memoization: polynomial space.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: fomin-gaspers-lokshtanov-saurabh-2015
  statements:
    arxiv-v1:
      statement: 'Section 1 (Our results: the branching algorithm for the extension problem of Min-Ones d-SAT)'
  note: 'Stated as $d^k \cdot n^{O(1)}$ for formulas with at most $d$ literals per clause: while some clause is unsatisfied by the current assignment (all variables 0 except those already set to 1), branch on which of its at most $d$ variables to set to 1; recursion depth $k$. Table 1 says its bounds suppress factors polynomial in the input size, so the bound is stored with $O^*$ (for unbounded $d$ the formula may have more than $n^{O(1)}$ clauses). The argument does not use that $d$ is a constant, so it holds for general CNF with $d$ the maximum clause length. The paper calls the algorithm simple and cites no source for it.'
