      statement: Corollary 7.2 with $q = 3$ (the vertex-cover number is at most $n$), under the Quantitative d-SAT Assumption (Assumption 4.2); also stated after Theorem 1.4
  note: 'Corollary 7.2: $2^{O_q(k\eta(k)/\sqrt{\lambda(k)})} n^{O_q(1)}$ for q-Coloring with vertex-cover number $k$; after Theorem 1.4 the paper states the $2^{O_q(n \log\log n/\sqrt{\log n})} n^{O_q(1)}$ bound for $X = V(G)$. The formula (Lemma 7.1) has width $q = 3$, so Assumption 4.2 at width three is used: the Anthropic theorem for 3-CNF. A coloring is recovered by further decision queries (proof of Corollary 7.2).'
