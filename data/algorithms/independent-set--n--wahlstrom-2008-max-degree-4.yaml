  quantum: false
source:
  paper: wahlstrom-2008
  statements:
    iwpec:
      statement: 'Lemma 6: "For a formula $F$ with $d(F) = 4$, $C(F)$ runs in time $O^*(1.2117^n)$", with Lemma 4 ($O^*(1.1499^n)$ for $d(F) \le 3$)'
      page: 209
  note: 'Theorem 1 is for #2SAT$_w$: a 2-CNF formula with a weight $w(\tilde v)$ and a cardinality on each literal; the algorithm returns the maximum weight of a model and the number of models of that weight (Section 4). The degree $d(x)$ of a variable is the number of clauses it occurs in, and $n$ is the number of variables (Section 2). Maximum Weight Independent Set is the special case with one variable per vertex, a clause $(\bar u \vee \bar v)$ per edge, $w(v)$ the vertex weight and $w(\bar v) = 0$ (vertices without edges are added to the solution directly); then a variable has the degree of its vertex, so $n$ and the maximum degree carry over (simple step, not stated in the paper). The paper does not restrict the weights; it only adds and compares them. It outputs the maximum weight, which is the goal of this version; a maximum-weight set follows by self-reduction. Lemma 4 gives $O^*(1.1499^n)$ for maximum degree 3, which the $O^*(2^{n/5+o(n)})$ through cubic Max 2-CSP already beats, so it is not entered.'
