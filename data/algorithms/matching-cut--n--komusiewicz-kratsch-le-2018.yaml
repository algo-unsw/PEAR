    journal: { statement: 'Theorem 4' }
  note: 'SAT-based: Matching Cut reduces in polynomial time to $O(n^2)$ 3-SAT instances with $n$ variables each (clauses $\neg x_v \lor x_u \lor x_w$ for every vertex $v$ and neighbours $u, w$, plus unit clauses fixing two vertices $a$, $b$ on opposite sides), solved with Hertli''s randomized 3-SAT algorithm (SIAM J. Comput. 2014). The paper does not state the error type; PPSZ-type algorithms have one-sided error (they never accept a formula without a satisfying assignment they found). Journal only: the IPEC 2018 version has no SAT-based algorithm. Read in the accepted manuscript (journal-author-copy).'
