      statement: 'Theorem 11.3(3) with $r = 2$'
      page: 78
  note: 'Theorem 11.3(3): Max $(r,2)$-CSP in time and space $O^*(r^{\beta_4(G)+o(n)})$ if the constraint graph $G$ has maximum degree at most 4, where $\beta_4(G) \le F_4 n$ and $F_4 < 0.24577198$ (Section 11.1); the implied $O^*(2^{0.24577198n+o(n)})$ is stored for $r = 2$. Max Cut with edge weights $w$ is the case $r = 2$: one variable per vertex and, for each edge $uv$, the score $w(uv)$ when $u$ and $v$ get different values and $0$ otherwise, so the constraint graph is $G$ itself (same maximum degree) and $m$ is the number of edges (as in `max-cut--m--gaspers-2026-pathwidth`). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
