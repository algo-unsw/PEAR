problem: matching-cut
proved_for: minimum-decision
bound:
  as_stated: '2^{O(k \log k)} n^{O(1)}'
  notation: O
  parameters: [k, n]
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential (in $k$). Dynamic programming over the compact unbreakable tree decomposition of Cygan et al. (TALG 2021), with tables indexed by subsets of adhesions of size $O(k)$.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: aravind-saxena-2021
  statements:
    arxiv-v3: { statement: 'Theorem 1 (with $d = 1$)' }
  note: 'Theorem 1 solves $k$-$d$-Cut (is there a $d$-cut with at most $k$ crossing edges, $d$ part of the input) in $2^{O(k\log k)} n^{O(1)}$ time; with $d = 1$ this is the minimum-decision version of Matching Cut. The paper does not say whether the algorithm is randomized; its family of separating subsets (Lemma 1, from Chitnis et al.) is stated as a construction with a running time and no error probability, so it is recorded as deterministic (TODO(verify)).'
