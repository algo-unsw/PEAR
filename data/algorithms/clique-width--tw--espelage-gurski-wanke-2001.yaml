id: clique-width--tw--espelage-gurski-wanke-2001
problem: clique-width
proved_for: optimisation
bound:
  as_stated: f(tw) \cdot n
  notation: O
  parameters: [tw, n]
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: $f(tw) \cdot n$. Dynamic programming over a binary tree decomposition that stores sets of connection types of $k$-labelled $l$-terminal graphs, for every $k \le 3 \cdot 2^{tw - 1}$.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: espelage-gurski-wanke-2001
  statements:
    journal:
      statement: Corollary 8.3, with Corollary 8.2
  note: 'Corollary 8.3: there exists a linear time algorithm for computing the clique-width of a graph of bounded tree-width (Corollary 8.2: for every $k$, deciding clique-width at most $k$ in linear time). Linear time is meant for a fixed tree-width bound; the paper gives no explicit function $f$ (TODO(verify) that the algorithm is uniform in the tree-width, as $f(tw) \cdot n$ claims). Every graph of tree-width at most $l$ has clique-width at most $3 \cdot 2^{l-1}$. The tree decomposition is computed with Bodlaender''s linear-time algorithm. The proof is constructive, but outputting a $k$-expression is not stated.'
