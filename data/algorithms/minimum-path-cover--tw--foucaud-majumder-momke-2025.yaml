source:
  paper: foucaud-majumder-momke-2025
  statements:
    arxiv-v1: { statement: "Theorem 16" }
  note: "Stated as $25^t |V|^{O(1)}$ for a tree decomposition of width $t$, given with the input; a Monte-Carlo algorithm with no false positives and false negatives with probability at most $1/2$ (Cut&Count with the Isolation Lemma). The authors note that fast subset convolution could reduce the base 25. TODO(verify): whether this result is in the CALDAM 2025 version, whose title mentions only Path Cover."
