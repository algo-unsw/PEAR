  statements:
    arxiv-v1: { statement: "Section Applications: the remark after Theorem thm:applications (\"Such modifications easily capture problems like computing a longest induced path\"), with Corollary cor:exact_algorithms (all these problems in $O(1.7347^n)$)" }
  note: "Not a numbered theorem: the main theorem (maximum induced subgraph of treewidth at most $t$ with a CMSO property, in time $|\\Pi_G| \\cdot n^{O(1)}$) applies with $t = 1$ and the property \"$G[F]$ is a path and $X = F$\", which is CMSO-expressible; the paper's remark says so for the longest induced path. The bound $O(1.7347^n)$ on the number of potential maximal cliques is from the abstract and Corollary cor:exact_algorithms."
