id: minimum-bisection--tw--eiben-lokshtanov-mouawad-2019
problem: minimum-bisection
proved_for: weighted
bound:
  as_stated: 'O(8^{tw} (tw W)^{O(1)} n^{1.864} \log n)'
  notation: O
  parameters: [tw, W, n]
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential in $tw$. Dynamic programming over a tree decomposition with tables indexed by subsets of bags, combined by (min,+)-convolutions.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
given: [tree-decomposition]
source:
  paper: eiben-lokshtanov-mouawad-2019
  statements:
    journal: { statement: "Theorem 1.3" }
  note: 'Stated as $O(8^t \cdot (tW)^{O(1)} \cdot n^{1.864} \cdot \log n)$ for integer edge weights between 1 and $W$ and a tree decomposition of width $t$ given with the input; $t$ is written $tw$ here (edges of weight 0 can be deleted first). Uses the deterministic $O((nD)^{1.864})$ bounded monotone (min,+)-convolution of Chan and Lewenstein (Theorem 3.1); TODO(verify) whether that subroutine should be tagged algebraic. Theorem 1.1 gives $O(8^t t^5 n^2 \log n)$ for arbitrary weights. Read in the accepted manuscript of the JCSS 2021 version (AUB ScholarWorks); preliminary version ESA 2019 (theorem numbers there not checked).'
