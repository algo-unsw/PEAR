bound:
  as_stated: "4^{dc} n^{O(1)}"
  notation: O
  parameters: [dc, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: $O^*(2^{dc})$. For each guess of $S_1, S_2 \\subseteq S$, a dynamic programming table $OPT[W, j, b]$ over all subsets $W$ of the remaining deletion set (proof of the SET-CoverWithPartition theorem)."
  algebraic: false
