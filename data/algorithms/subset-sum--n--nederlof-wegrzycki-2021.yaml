  note: 'Theorem 1.1: "Every instance of Subset Sum can be solved in $O^\star(2^{n/2})$ time and $O^\star(2^{0.249999n})$ space by a randomized Monte Carlo algorithm with constant success probability." The proof assumes the integers are at most $2^{O(n)}$, which "can be assured with a standard hashing argument" (Section 2). The first improvement on the space of Schroeppel and Shamir''s algorithm. Read in arXiv v2 (12 April 2021).'
