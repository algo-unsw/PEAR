  note: 'Bellman and, independently, Held and Karp gave a dynamic programming recurrence that solves the general TSP in $O(n^2 2^n)$ time (Björklund, FOCS 2010, Section 1); time and space are within a polynomial factor of $2^n$ (Björklund–Husfeldt–Kaski–Koivisto, TALG). No open copy found.'
