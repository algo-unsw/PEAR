id: travelling-salesman--n--held-karp-1962
problem: travelling-salesman
proved_for: optimisation
bound:
  as_stated: 'n^{2} 2^{n}'
  notation: O
  parameters:
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Stores a value for every subset and end vertex, as the attesting sources state.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: held-karp-1962
  attested_by:
  - https://arxiv.org/pdf/1008.0541
  - https://www.cs.helsinki.fi/u/mkhkoivi/publications/talg-2011.pdf
