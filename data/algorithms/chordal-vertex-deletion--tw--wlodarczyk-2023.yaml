  note: "Stated as: Chordal Vertex Deletion can be solved in deterministic time $O(c^k k^{\\omega+1} n)$ on $n$-vertex node-weighted graphs when a tree decomposition of width $k$ is provided, with $c = 2^{\\omega-1} \\cdot 3 + 1$. Section 1 adds that, with the single-exponential constant-factor approximation of treewidth of Bodlaender et al., this gives $2^{O(\\mathrm{tw})} n$ when no decomposition is given. Read in the LaTeX of the current arXiv version (version number not shown). The ICALP 2023 version (open access, CC BY 4.0) states it as Theorem 1.1 and defers the dynamic programming to the full version. TODO(verify): the theorem number in the arXiv version (presumably also 1.1); algebraic set because fast matrix multiplication is a sub-tag of it; constructive assumed (dynamic programming)."
