problem: k-plex
proved_for: optimisation
bound:
  as_stated: "O(n^{2s} + n (D d)^{s+1} 2^{(1 - \\varepsilon_{s}) D})"
  notation: O
  parameters: [n, s, D, d]
properties:
  randomized: false
  space:
    class: polynomial
    note: "Not stated; educated guess: polynomial. A Bron–Kerbosch-style branching (BKPivot) on seed graphs, one seed set at a time, keeping \"the status of at most $k$ vertices at each branch\" (remark after the theorem); no memoization or dynamic programming over subsets found."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: wang-zhou-xiao-2022
  statements:
    arxiv-v2: { statement: "Section 3.3 (Complexity analysis), the theorem labelled Thm:R-time: ListPlex lists all maximal $k$-plexes without repetition in time $O(n^{2k}+n(D\\Delta)^{k+1}\\gamma_k^D)$, where $\\gamma_k<2$ is the largest root of $1=x^{-1}+\\dots+x^{-k-1}$; proof in the appendix (Missing Proofs)" }
  note: "Stated as $O(n^{2k}+n(D\\Delta)^{k+1}\\gamma_k^D)$ for listing all maximal $k$-plexes ($k$ is $s$ here, $\\Delta$ is $d$, $D$ the degeneracy). Stored as $2^{(1 - \\varepsilon_s) D}$ with $1 - \\varepsilon_s = \\log_2 \\gamma_s$, where $\\gamma_s$ is the largest root of $1 = x^{-1} + \\dots + x^{-s-1}$; the bound language has no symbol for such a root (decided by Serge Gaspers, 21 November 2026). $\\gamma_s < 2$ for every $s$, since the sum is decreasing and below 1 at $x = 2$. Values computed by the site: $\\gamma_1 = 1.61803$ ($1 - \\varepsilon_1 = 0.69424$), $\\gamma_2 = 1.83929$ ($0.87915$), $\\gamma_3 = 1.92756$ ($0.94678$), $\\gamma_4 = 1.96595$ ($0.97523$), $\\gamma_5 = 1.98358$ ($0.98811$). A maximum $s$-plex is a maximal one, so returning the largest listed set solves the optimisation version within the same time. The remark after the theorem bounds $\\gamma_k$ by \"$O(2-\\frac{1}{2^{k+1}})$\". Xiao, Lin, Dai and Zeng (AAAI 2017) give $O^*(\\alpha_s^n)$ with the same bases ($\\alpha_1 = 1.618$, $\\alpha_2 = 1.839$, $\\alpha_3 = 1.928$, $\\alpha_4 = 1.966$, as quoted in arXiv 2306.13258, Section 2.3.1); this bound implies it through $D \\le d \\le n$ (record k-plex--n--wang-zhou-xiao-2022)."
