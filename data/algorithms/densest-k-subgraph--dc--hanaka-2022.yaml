id: densest-k-subgraph--dc--hanaka-2022
problem: densest-k-subgraph
proved_for: optimisation
bound:
  as_stated: "O(2^{dc} dc (k^{3} n + m))"
  notation: O
  parameters: [dc, k, n, m]
properties:
  randomized: false
  space:
    class: polynomial
    bound: "Not stated; educated guess: polynomial. A cluster vertex deletion set is computed by the branching algorithm of Boral et al.; then $2^{dc}$ guesses, each solved by dynamic programming over the block-cut tree with $O(k^2 n)$ table entries (polynomial)."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: hanaka-2022
  statements:
    arxiv: { statement: "Corollary at the end of Section 4 (Block Deletion Number)" }
  note: "The corollary: Densest $k$-Subgraph can be solved in time $4^{db(G)} n^{O(1)}$ and $O(2^{dc(G)} dc(G) (k^3 n + m))$, $dc(G)$ the cluster deletion number (the deletion set is computed, not given: Boral et al., $O(1.9102^{dc} dc (n + m))$). The paper's problem is to find $k$ vertices that induce the maximum number of edges (optimisation). Read in the arXiv LaTeX source (latest version, 21 November 2026); the JOCO 2023 version was not opened."
