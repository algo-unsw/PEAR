id: pathwidth--n--kitsunai-kobayashi-komuro-tamaki-tano-2012
problem: pathwidth
proved_for: optimisation
bound:
  as_stated: 'O(1.89^{n})'
  notation: O
  parameters: [n]
properties:
  randomized: false
  space:
    class: exponential
    note: 'Not stated; educated guess: exponential. The algorithm is Bellman–Held–Karp style dynamic programming over feasible vertex subsets (Section 1).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: kitsunai-kobayashi-komuro-tamaki-tano-2012
  statements:
    journal: { statement: 'Theorem 1' }
  note: 'Read in the full text (PDF in Serge''s Zotero library, 23 November 2026). Theorem 1 (Algorithmica 2016): "The directed pathwidth of a digraph with $n$ vertices can be computed in $O(1.89^n)$ time." Section 1: for an undirected graph $G$, replacing each edge by two opposite arcs gives a digraph whose directed path-decompositions are exactly the path-decompositions of $G$, so pathwidth is a special case (the abstract says so too). Entered for (undirected) pathwidth, as computing the width (optimisation). The IPEC 2012 version was not checked.'
