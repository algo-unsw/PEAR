id: domatic-number--n--bjorklund-husfeldt-koivisto-2009
problem: domatic-number
proved_for: decision
bound:
  as_stated: 2^{n} n^{O(1)}
  notation: O
  parameters: [n]
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Exponential: Theorem 2 builds, with the fast zeta transform, a table with an entry for every subset of $V$ (Section 3.2); Section 5 replaces this table to get polynomial space at the cost of $O^*(3^n)$ time.'
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: bjorklund-husfeldt-koivisto-2009
  statements:
    journal:
      statement: Theorem 2 with Section 4.2 (Domatic Number in Table 1.1; abstract)
  note: 'The abstract states exact algorithms in $2^n n^{O(1)}$ time for several partition problems including Domatic Number. Table 1.1 lists Domatic Number as partitioning $V$ into sets from $\mathcal{F}$, the dominating sets of $G$; Section 4.2 notes that membership in $\mathcal{F}$ is decided in polynomial time, so Theorem 2 (Counting Set Partitions in $O^*(2^n)$ time) applies: $G$ has a partition into $k$ dominating sets if and only if the count is positive.'
