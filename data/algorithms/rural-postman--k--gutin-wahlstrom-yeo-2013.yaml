id: rural-postman--k--gutin-wahlstrom-yeo-2013
problem: rural-postman
proved_for: decision-nonnegative-weights  # the paper allows weight 0 (26 November 2026)
bound:
  as_stated: '2^{k} (n + B)^{O(1)}'
  notation: O
  parameters:
  - k
  - n
  - B
properties:
  randomized: { error: one-sided }
  space:
    class: exponential
    note: '$O^*(2^k)$ space, as stated (tables over subsets of the components, fast zeta transform).'
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: gutin-wahlstrom-yeo-2013
  statements:
    arxiv:
      statement: 'Section 2, subsection "Fast evaluation", theorem on UEE ($O^*(2^k)$ time and space), with the proposition in subsection "The undirected case" reducing URPP to UEE with the same $k$'
  note: 'Stated as: Undirected Eulerian Extension (UEE) with $k$ components and $\ell$ bounded by a polynomial in the number of vertices can be solved by a randomized algorithm in $O^*(2^k)$ time and space; URPP reduces in polynomial time to UEE with the same number $k$ of components. The paper''s URPP asks for a closed walk of weight at most $w(R) + \ell$ (multigraphs, nonnegative integer weights). Stored as the implied $2^k (n + B)^{O(1)}$ with $\ell = B - w(R) \le B$: the proof (last lemma of the subsection "Main result for Eulerian Extension", which the undirected case reuses) uses $\mathrm{poly}(n + \ell)$ evaluations of the sieving polynomial $Q$ over $\mathrm{GF}(2^r)$ with $r = O(\log n + \log \ell)$, each in $O^*(2^k)$ time, with weights capped at $\ell + 1$. Error: Schwartz–Zippel, so a no-instance is never accepted. The arXiv version read is the latest one served by the arXiv tools on 21 November 2026.'
