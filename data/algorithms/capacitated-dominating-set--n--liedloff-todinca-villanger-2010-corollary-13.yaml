  note: "Corollary 13: \"By setting $\\gamma = 31/100$ and $\\beta = 15$, Algorithm minCDS runs in $O(n^{20} 1.8573^n)$ and exponential space\" (Section 3.3.2; Table 2 lists the same setting as $O^*(1.8573^n)$ with a polynomial factor of order $n^5 \\cdot n^{15}$). It trades the base of capacitated-dominating-set--n--liedloff-todinca-villanger-2010 ($O^*(1.8463^n)$, with $\\gamma = 0.30275$, $\\beta = 40000$ and a polynomial factor of order $n^5 \\cdot n^{40000}$) for a practical polynomial factor. Algorithm minCDS returns the size of a minimum capacitated dominating set; Remark 1 says it is straightforward to make it return the set. Read in the journal version (Zotero copy of the publisher PDF). Open access: Discrete Applied Mathematics is in Elsevier's open archive, which opens articles 4 years after publication (elsevier.com, 'free access to archived articles', mathematics list, read 21 November 2026); Zotero's Unpaywall lookup also linked an open PDF for this DOI."
