  note: 'Theorem 5.1 (Section 5.1): "The described algorithm solves #Dominating Set in $3^{n/5+o(n)}$ time and polynomial space on subcubic graphs" ($= O(1.2458^n)$, text before the theorem), where #Dominating Set computes the number of dominating sets of each size $k$, $0 \le k \le n$. Separator branching on the cubic structure of $G$ with a 3-way inclusion/exclusion branching, reusing the Max $(3,2)$-CSP analysis of Section 3. arXiv v2, 17 November 2017 (read: LaTeX source); ICALP 2015; ACM TALG 2017.'
