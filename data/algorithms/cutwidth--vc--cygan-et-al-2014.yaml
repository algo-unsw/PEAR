id: cutwidth--vc--cygan-et-al-2014
problem: cutwidth
proved_for: optimisation
bound:
  as_stated: "2^{vc} n^{O(1)}"
  notation: O
  parameters: [vc, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: exponential, about $2^{vc}$. The paper calls it a dynamic programming algorithm over a given vertex cover $C$, with $2^{|C|}$ running time; such a table is indexed by subsets of $C$."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: cygan-et-al-2014
  statements:
    algorithmica: { statement: "Abstract; Theorem 5" }
  note: "Abstract: cutwidth \"can be computed exactly in time $O(2^k n^{O(1)})$\", $k$ the size of a minimum vertex cover. Theorem 5: for a graph $G = (C \\cup I, E)$ with vertex cover $C$, the algorithm \"computes the cutwidth of G in running time $O(2^{|C|}(|C| + |I|)^{O(1)})$\". Theorem 5 also gives $O(2^{n/2} n^{O(1)})$ on bipartite graphs, not entered (no bipartite version). Read in the author copy of the Algorithmica version (sites.cs.ucsb.edu), 21 November 2026; the IPEC 2011 version was not opened."
