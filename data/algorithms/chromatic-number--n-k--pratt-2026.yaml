id: chromatic-number--n-k--pratt-2026
problem: chromatic-number
proved_for: decision
bound:
  as_stated: 'O((2 - \varepsilon_{k})^{n})'
  notation: O
  parameters:
  - n
  - k
properties:
  randomized:
    error: one-sided
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential. The preprocessing stores set families computed by fast subset convolution in a hash table (Lemma 4.1).'
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: pratt-2026
  statements:
    arxiv-v1:
      statement: Theorem 1.2
  note: 'For every $k$ there is $\varepsilon_k > 0$ such that $k$-coloring is solved in $O((2-\varepsilon_k)^n)$ time; randomized with one-sided error (accepts a yes-instance with probability at least 2/3, rejects every no-instance). Independent of Zamir (arXiv:2607.25973). Unrefereed preprint, 29 July 2026.'
