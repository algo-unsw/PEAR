id: equitable-coloring--dcc--gomes-guedes-dos-santos-2019
problem: equitable-coloring
proved_for: decision
bound:
  as_stated: "f(dcc) \\cdot n^{O(1)}"
  notation: O
  parameters: [dcc, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: $O^*(2^{dcc})$. For each guessed colouring $\\psi$ of the modulator and each set $P$ of its colours, a dynamic programming table indexed by $(S, p, q, j)$ with $S$ a subset of the modulator's colours (Lemma on $f_{\\psi,P}$), whose transitions run the max-flow algorithm of the distance-to-cluster section."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: gomes-guedes-dos-santos-2019
  statements:
    arxiv: { statement: "Theorem 9" }
  note: "Read in the current arXiv version (v2, 20 November 2026). Theorem 9 states FPT time; the proof assumes the modulator $U$ is given, tries $O^*(B_{|U|} 2^{|U|})$ cases ($B$ the Bell numbers), and solves each by a dynamic program in $O^*(3^{|U|})$ time."
