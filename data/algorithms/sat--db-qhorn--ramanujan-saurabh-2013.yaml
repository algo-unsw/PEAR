  note: 'Corollary after Theorem 6 (Section "Applications", subsection on Deletion q-Horn Backdoor Set Detection): an algorithm for Satisfiability that runs in time $O(12^k k^5 \ell)$, where $k$ is the size of a smallest q-Horn deletion backdoor set and $\ell$ the length of the formula. Read in the LaTeX source of the current arXiv version of 1304.7505; the numbers Theorem 6 and Corollary 1 come from the rendered PDF as reported by a fetch, TODO(verify). SODA 2014 and TALG 2017 versions not read.'
