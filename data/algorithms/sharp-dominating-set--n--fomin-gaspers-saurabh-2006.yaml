  note: "Weights $\\ge 1$ only: #MWDS (Section 5.1) has vertex weights $w \\colon V \\to \\mathbb{R}^+$ and counts all dominating sets of minimum weight, so here the bound holds for integer weights $\\ge 1$; PEAR's weighted version also allows weight 0, which the corollary does not cover (entered with this restriction, as decided by Serge Gaspers, 21 November 2026). Corollary 2: \"The #MWDS problem can be solved in $O(1.2464^{2n}) = O(1.5535^n)$ time\", through an #MWSC instance of size at most $2n$ (Section 5.1). Only the Algorithmica version is entered (decided by Serge Gaspers, 21 November 2026)."
