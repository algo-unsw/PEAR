  note: 'Stated for Generalized Thiele (each voter has its own Thiele sequence), which contains PAV (every voter has $w_j = 1/j$): "We can solve Generalized Thiele with a given candidate-deletion set of size $d$ in time $O^*(2^d)$" ($d$ there, $dc$ here); the problem there asks for a committee of size $k$ with total utility at least $U$. The same theorem shows that, under ETH, there is no $O^*(2^{o(d)})$-time algorithm, even for every non-constant $w$-Thiele rule. Numbering read from the LaTeX source of the arXiv version (all environments share one counter); TODO(verify) the numbering in the IJCAI 2022 version.'
