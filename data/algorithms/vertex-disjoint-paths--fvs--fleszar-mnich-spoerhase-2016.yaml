  note: "Stated for Maximum Node-Disjoint Paths (MaxNDP) on graphs with feedback vertex set number $r$ and $k$ terminal pairs; PEAR writes $fvs$ for $r$. The bound changed between versions: the arXiv Introduction states $(8k+8r)^{2r+2} \\cdot O(n)$ with no further condition; the open-access Mathematical Programming version (CC BY 4.0) states in Theorem 3 that MaxNDP 'can be solved in time $(k+r)^{O(r)} \\cdot n$' and, 'when a minimum feedback vertex set is given', in $(8k+8r)^{2r+3} \\cdot O(n)$. The journal's unconditional form is stored. MaxNDP is W[1]-hard parameterized by $r$ alone (same paper). The journal version was read through a PDF-to-text summary (repository copy at pure.mpg.de)."
