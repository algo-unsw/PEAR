  note: 'Improves the parametric factor $2^{O(k^3)}$ of Cygan et al. (STOC 2014). The colour coding is derandomized (Section 4: "We will present an already derandomized version"). Read in the current arXiv version of 1810.06864 (20 November 2026); TODO(verify) the printed theorem number and arXiv version number. Journal version: ACM TALG 2021.'
