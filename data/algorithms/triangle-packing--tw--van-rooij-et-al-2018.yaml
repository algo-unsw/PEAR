  note: "Stated for $\\gamma$-clique packings (here $\\gamma = \\{3\\}$): 'given a tree decomposition of a graph $G$ of width $k$, computes the number of $\\gamma$-clique packings ... using $\\kappa$, $0 \\le \\kappa \\le n$, cliques in $O(n^3 k^2 2^k i_\\times(nk + n\\log(n)))$ time', where $i_\\times(b)$ is the time to multiply $b$-bit numbers; stored as the implied $O^*(2^{tw})$. The decision version asks whether the count for $\\kappa = k$ is nonzero. The Introduction lists Maximum Triangle Packing among these problems. The number 3.17 is inferred from the order of the numbered environments in Section 3 (Corollary 3.6 is the Dominating Set result PEAR already cites)."
