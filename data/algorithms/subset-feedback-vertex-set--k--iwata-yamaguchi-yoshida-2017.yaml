id: subset-feedback-vertex-set--k--iwata-yamaguchi-yoshida-2017
problem: subset-feedback-vertex-set
proved_for: decision
bound:
  as_stated: 'O(4^{k} k m)'
  notation: O
  parameters: [k, m]
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Not stated; educated guess: polynomial. Branch and bound of depth at most $2k$ (Algorithm 1, Section 5.1); each node computes a farthest half-integral cover by augmenting-path search in linear time. No memoization or dynamic programming tables found.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: false
  quantum: false
source:
  paper: iwata-yamaguchi-yoshida-2017
  statements:
    arxiv:
      statement: 'Section 5.2 (Applications to Other Problems), paragraph on Subset Feedback Vertex Set; Table 1; read in the current arXiv version (v2)'
  note: 'Deterministic (Table 1: all algorithms in it are deterministic except the $O(25.6^k m)$ one of Lokshtanov, Ramanujan and Saurabh). Stated for the version with a terminal set $S \subseteq E$ of edges; the vertex version with terminals $T$ is the special case where $S$ is the set of edges incident to $T$, on the same graph with the same $k$. Table 1 gives $O^*(4^k)$ as the previous smallest $f(k)$ (Iwata, Wahlström, Yoshida, arXiv:1310.2841). FOCS 2018 version not opened.'
