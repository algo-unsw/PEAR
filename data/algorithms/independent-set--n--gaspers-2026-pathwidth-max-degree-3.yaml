  note: 'Theorem 11.4 (bounded-degree graph problems), Section 11.4. Part (b): a maximum weight independent set of $G$ can be found, and the maximum weight independent sets counted, in time and space $O^*(2^{c_3 n_3+o(n)}) = O(1.1018^n)$ if $\Delta(G) \le 3$ ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). Vertex weights are real numbers in Section 11. The dynamic program of Lemma 11.1(c) ($2^{w+1}\mathrm{poly}(n)$) over a path decomposition of width at most $c_3 n_3 + o(n) \le c_3 n + o(n)$ (Lemma 11.2) for maximum degree 3, or $\beta_4(G) + o(n) \le F_4 n + o(n)$ (Theorem 7.1 and Theorem 1.5) for maximum degree 4, computed in polynomial time. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
