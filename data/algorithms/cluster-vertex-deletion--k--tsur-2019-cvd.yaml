  note: "No numbered theorem: the abstract and Section 1 state the $O^*(1.811^k)$ running time, and Section 6 concludes that the largest branching number is at most 1.811. Improves the $O^*(1.911^k)$ algorithm of Boral, Cygan, Kociumaka and Pilipczuk (as cited in Section 1). Tian, Xiao and Yang (COCOON 2023; Theory Comput. Syst. 2025) improve it to $O^*(1.7549^k)$, entered from their abstract: cluster-vertex-deletion--k--tian-xiao-yang-2023."
