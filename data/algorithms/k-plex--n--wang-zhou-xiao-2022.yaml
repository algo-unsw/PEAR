  note: "Written by the site: for every fixed $s$, the theorem's $O(n^{2s} + n(D\\Delta)^{s+1}\\gamma_s^D)$ with $D \\le \\Delta \\le n$ is $O^*(\\gamma_s^n) = O^*(2^{(1 - \\varepsilon_s) n})$, where $1 - \\varepsilon_s = \\log_2 \\gamma_s$ and $\\gamma_s$ is the largest root of $1 = x^{-1} + \\dots + x^{-s-1}$ ($1 - \\varepsilon_1 = 0.69424$, $1 - \\varepsilon_2 = 0.87915$, $1 - \\varepsilon_3 = 0.94678$, $1 - \\varepsilon_4 = 0.97523$; values computed by the site). Xiao, Lin, Dai and Zeng (AAAI 2017, not reachable) state $O^*(\\alpha_s^n)$ with the same bases. Form decided by Serge Gaspers, 21 November 2026."
