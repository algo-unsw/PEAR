  statements:
    journal: { statement: "Theorem 5" }
  note: "The decomposition is computed, not assumed: the proof starts by applying Theorem 1 (a treecut decomposition of width at most $2k$, citing Kim et al.) and Lemma 1. The same paper shows BDD is W[1]-hard parameterized by the feedback vertex set number, pathwidth and treedepth (Corollary 2) and has no polynomial kernel in treecut width unless coNP ⊆ NP/poly (Theorem 6)."
