  note: 'Monotone Local Search with sample-dependent running times: the extension step contracts each component of the sample to one vertex with a new colour and runs the randomized $O^*(2^k)$ polynomial-space algorithm of Björklund, Kaski and Kowalik as a black box, in time $O^*(2^{k-|X|}2^{\mathrm{comp}(G[X])})$ (Section 11.3). The paper''s problem definition (multiset $M$, $G[S]$ connected, $\mathrm{col}(S) = M$) matches PEAR''s. The constant rests on a computer-checked certificate. arXiv v1, 1 November 2026; unrefereed preprint.'
