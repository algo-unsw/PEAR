id: directed-steiner-tree--t--feldmann-marx-2016
problem: directed-steiner-tree
proved_for: weighted
bound:
  as_stated: '2^{O(t)} n^{O(1)}'
  notation: O
  parameters:
  - t
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential. Dynamic programming with a table $T[i, Q, U, I, B, \mathcal{A}]$ over subsets $Q$ of the terminals and bags $U$ of a tree decomposition of the solution: $2^{O(k + \tau\omega\log\omega)} n^{O(\omega)}$ entries (Section 4 of the arXiv version).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: feldmann-marx-2016
  statements:
    journal:
      statement: 'Theorem 1.2(1), with the remark on DST in Section 1.1'
  note: 'Theorem 1.2(1): $\mathcal{H}$-DSN with parameter $k = |R|$ in $2^{O(k + \tau\omega\log\omega)} n^{O(\omega)}$ time for patterns in $\mathcal{C}^*_{\lambda,\delta}$, $\omega = (1+\lambda)(\lambda+\delta)$, $\tau$ the vertex cover number of the pattern. Out-stars (DST) lie in $\mathcal{C}^*_{1,0}$, and the paper remarks that Theorem 1.2(1) recovers that DST can be solved in $2^{O(k)} n^{O(1)}$ time. Arc-weighted graphs. Statement read in the accepted manuscript of the journal version (White Rose repository).'
