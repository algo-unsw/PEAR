id: minimum-bisection--n--folklore
problem: minimum-bisection
proved_for: weighted
bound:
  as_stated: '2^{n} (n + m)'
  notation: O
  parameters:
  - n
  - m
properties:
  randomized: false
  space:
    class: polynomial
    note: 'One set $A$ at a time.'
  algebraic: false
  fast_matrix_multiplication: false
