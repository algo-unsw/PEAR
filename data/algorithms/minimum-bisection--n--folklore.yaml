source:
  folklore: true
  note: 'Try all $2^n$ sets $A \subseteq V$ with $||A| - |V \setminus A|| \le 1$ and add up the weights of the edges between $A$ and $V \setminus A$ (brute force; added at Serge Gaspers''s request, 20 November 2026).'
