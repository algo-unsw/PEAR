id: set-packing--n--folklore
problem: set-packing
proved_for: optimisation
bound:
  as_stated: 2^{n} n m
  notation: O
  parameters:
  - n
  - m
properties:
  randomized: false
  space:
    class: exponential
    note: A table over all $2^n$ subsets of the universe.
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Dynamic programming over subsets: for $X \subseteq U$ with smallest element $x$, the largest packing inside $X$ is the larger of the largest packing inside $X \setminus \{x\}$ and $1$ plus the largest packing inside $X \setminus F$ over the sets $F \in \mathcal{F}$ with $x \in F \subseteq X$ (the empty set, if in $\mathcal{F}$, adds one at the end). Each of the $2^n$ entries checks $m$ sets in $O(n)$ time each.'
