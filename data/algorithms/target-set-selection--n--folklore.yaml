  folklore: true
  note: "Try all $2^n$ sets $S$; for each, simulate the activation process in $O(n + m)$ time with a queue and a counter of active neighbours per vertex. Bliznets and Sagunov (arXiv 1807.10789, Section 1) note that whether $O^*((2-\\epsilon)^n)$ is possible for general thresholds is open."
