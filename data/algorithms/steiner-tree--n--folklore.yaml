id: steiner-tree--n--folklore
problem: steiner-tree
proved_for: weighted
bound:
  as_stated: '2^{n} m \log n'
  notation: O
  parameters:
  - n
  - m
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'One set $S$ at a time.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Try all $2^n$ sets $S \subseteq V \setminus T$; if $G[T \cup S]$ is connected, take a minimum spanning tree of it. An optimal tree is a spanning tree of $G[T \cup S]$ for its own set $S$, so the cheapest of these trees is optimal (brute force; added at Serge Gaspers''s request, 20 November 2026).'
