id: maximum-edge-biclique--k--feng-li-zhou-2016
problem: maximum-edge-biclique
proved_for: decision
bound:
  as_stated: "O(n k^{2.5} k^{\\sqrt{k} + 1})"
  notation: O
  parameters: [n, k]
properties:
  randomized: false
  space:
    class: polynomial
    bound: "Not stated; educated guess: polynomial. Algorithm APEB enumerates, for each vertex $v$, the subsets of $N(v)$ of size at most $\\lceil\\sqrt{k}\\rceil$ one at a time; no memoization or tables."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: feng-li-zhou-2016
  statements:
    journal: { statement: "Theorem 3.3" }
  note: "Stated as $O(n k^{2.5} k^{\\lceil\\sqrt{k}\\rceil})$ for Parameterized Edge Biclique on bipartite graphs (find a biclique with at least $k$ edges or report that none exists); stored as the implied $O(n k^{2.5} k^{\\sqrt{k}+1})$, since the bound language has no ceiling. General graphs: Lemma 3.1 (a vertex of degree at least $k$ gives a solution), Lemma 3.2 (one side of a solution can be cut down to $\\lceil\\sqrt{k}\\rceil$ vertices) and the enumeration of Algorithm APEB (each vertex $v$ and each subset $S \\subseteq N(v)$ of size at most $\\lceil\\sqrt{k}\\rceil$, with the common neighbourhood of $S$ as the other side) use only that no vertex is its own neighbour, so the common neighbourhood of $S$ is disjoint from $S$ and the proof works verbatim for the non-induced bicliques of PEAR's general version; hence proved_for: decision. Read in the journal version (Zotero copy of the publisher PDF). Open access: Theoretical Computer Science is in Elsevier's open archive, which opens articles 4 years after publication (elsevier.com, 'free access to archived articles', mathematics list, read 21 November 2026); Zotero's Unpaywall lookup also linked an open PDF for this DOI."
formal: { status: informal }
