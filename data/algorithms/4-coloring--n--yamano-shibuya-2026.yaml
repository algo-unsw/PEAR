  note: 'Deterministic. The branching reductions of Wu et al. (ESA 2024) unchanged, with new algorithms for terminal instances (reduction to 3-coloring using the deterministic $O^*(1.3204^n)$ 3-coloring algorithm of Theorem 1.1, (3,2)-CSP with a triangle list cover, tree decomposition DP; the randomized version adds a randomized path decomposition DP) combined by a convex program with dual certificates (Appendix E). Section 2 and Appendix A: the search version within the same $O^*$ bound by self-reduction. arXiv v1, 2 November 2026 (read: LaTeX source and the Zotero PDF); unrefereed preprint.'
