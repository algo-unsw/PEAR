id: treedepth--n--folklore
problem: treedepth
proved_for: optimisation
bound:
  as_stated: 'n! (n + m)'
  notation: O
  parameters:
  - n
  - m
properties:
  randomized: false
  space:
    class: polynomial
    note: 'Recursion of depth at most $n$.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Recursion on the definition: the treedepth of a connected graph $G$ is $1 + \min_{v} \mathrm{td}(G - v)$, and that of a graph the maximum over its components (brute force; added at Serge Gaspers''s request, 20 November 2026).'
