  note: "Kernel with at most $2^k$ vertices (Theorem 2.9; Gramm, Guo, Hüffner and Niedermeier), then Set Cover-like dynamic programming on the edge set of the kernel. Theorem 14.20 (Cygan, Pilipczuk and Pilipczuk): no $O^*(2^{2^{o(k)}})$-time algorithm unless ETH fails. The bound was read in a text extraction of the PDF whose superscripts are split across lines (the characters after `O*(2` read `2O(k))`)."
