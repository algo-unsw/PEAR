    author-copy: { statement: "Theorem 4" }
  note: "Theorem 4: \"k-Vertex Planarization can be solved in $2^{O(k \\log k)} \\cdot n$ time\", for the construction version (input $G$ and $k$; output a minimum-size apex set, i.e. a set whose deletion leaves a planar graph, or no if $G$ is not $k$-apex). The conclusion leaves open whether $2^{O(k)} n$ is possible. Read in the author copy dated 31 October 2013 (via a PDF-to-text extraction); the theorem number in the SODA 2014 version was not checked (no open copy). TODO(verify): Serge to confirm the theorem number and that the result is deterministic."
