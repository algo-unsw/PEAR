  note: 'Theorem 2 (derandomized Monotone Local Search) gives $(2 - 1/1.6181)^{n + o(n)} N^{O(1)}$, base $1.38199\ldots$, so $O^*(1.3820^n)$ as in Table 1 (all bounds there suppress polynomial factors). Feedback Vertex Set in Tournaments is a $\Pi$-Vertex Deletion problem for the hereditary class of acyclic tournaments (Section 1). Theorem 1 gives the same base with a randomized (one-sided error) polynomial-space algorithm; not entered separately (see the notes of batch serge-04: the technique could cover it). STOC 2016; J. ACM 2019.'
