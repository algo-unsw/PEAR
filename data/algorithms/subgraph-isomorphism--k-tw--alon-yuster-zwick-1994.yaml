  statements:
    journal: { statement: "Theorem 6.3" }
  note: "Theorem 6.3: for $H$ on $k$ vertices with tree-width $t$, a subgraph of $G = (V, E)$ isomorphic to $H$, if one exists, can be found in $2^{O(k)} \\cdot V^{t+1}$ expected time and in $2^{O(k)} \\cdot V^{t+1} \\log V$ worst-case time; the worst-case bounds come from the derandomization of Section 4 (Section 2). Read in the author's copy of the J. ACM version (superscripts flattened in the text extraction). This entry is the deterministic worst-case bound."
