  note: 'Lemma: the Orienteering Problem with unit vertex profits on a graph of treewidth $k$ is solvable in $O(n^2) \cdot k^{O(k)}$ time. The paper''s Orienteering Problem asks for a walk that starts at $s$ (no end vertex) of cost at most $B$ maximising the profit collected; the proof assumes a nice tree decomposition of width $k$ (Cygan et al.), with $s$ added to every bag. Theorem numbers in the arXiv version are not visible in the LaTeX source; labels quoted.'
