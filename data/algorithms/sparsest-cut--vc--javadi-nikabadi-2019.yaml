  note: 'Theorem 2: 2SC is solved in $O(2^{vc} n^2 \log n)$ time and polynomial space. For each subset $\tilde{C}$ of a minimum vertex cover $C$ and each size $s$, the best $S$ with $S \cap C = \tilde{C}$ and $|S| = s$ takes the $s - |\tilde{C}|$ vertices of $V \setminus C$ with the smallest values $w(v, C \setminus \tilde{C}) - w(v, \tilde{C})$. A minimum vertex cover is found within the bound, e.g. in $O(2^{vc}(n + m))$ time by branching on the endpoints of an uncovered edge. Edge weights in $\mathbb{R}^+$ in the paper; nonnegative integer weights are handled identically.'
