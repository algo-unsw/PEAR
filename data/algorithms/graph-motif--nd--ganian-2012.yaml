id: graph-motif--nd--ganian-2012
problem: graph-motif
proved_for: decision
bound:
  as_stated: "O(2^{nd} \\sqrt{n} m)"
  notation: O
  parameters: [nd, n, m]
properties:
  randomized: false
  space:
    class: polynomial
    note: "Not stated; educated guess: polynomial. The algorithm runs through at most $2^{nd}$ connected selections of type classes in the type graph and, for each, solves a maximum bipartite matching between the colours of $M$ and the selected types; no memoization or dynamic programming found."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: ganian-2012
  statements:
    arxiv-v2: { statement: "Theorem in Section 'Algorithmic Results', subsection 'Graph Motif' (unnumbered in the LaTeX source)" }
  note: "Stated as \"The Graph Motif problem can be solved in time $O(2^{k}\\cdot\\sqrt{|V|}|E|)$ on graphs of neighborhood diversity at most $k$.\" The proof says a solution can then be constructed easily. A minimum partition into types can be found in polynomial time (Lampis, Theorem 5, as cited in Section 'Vertex Cover and Neighborhood Diversity'). Preprint only (DBLP lists only CoRR 2012). Read in arXiv 1201.3091 as served on 20 November 2026, taken to be v2 (17 January 2012), the latest version listed on the abstract page (v1: 15 January 2012); its LaTeX source also contains a twin-cover section with an $O(2^{k+2^k}\\sqrt{|V|}|E|)$ algorithm by vertex cover number, weaker than Bonnet and Sikora's. Bonnet and Sikora cite the neighbourhood-diversity result as $O^*(2^k)$ (arXiv 1503.05110, theorem labelled thm:Ganian, citing Ganian 2012)."
formal: { status: informal }
status: valid
