source:
  paper: anthropic-2026-eth
  statements:
    hexagon-v1:
      statement: Theorem 1
  note: Theorem 1 states $2^{O(\min\{k^2 n \log\log n/\sqrt{\log n},\ km/\sqrt{\log m}\})}$ for $k$-CNF, with an absolute constant; deterministic, word RAM. Entered as two bounds, one per term of the minimum, with $k = 3$. The paper states that the result is formalized in Lean 4 (https://github.com/anthropics/formal-math/tree/main/eth); which bound the Lean proof covers is not yet checked.
