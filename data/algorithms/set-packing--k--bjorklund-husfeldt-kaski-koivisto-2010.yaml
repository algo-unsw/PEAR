  note: 'Stated for families of size-3 subsets: randomized, constant one-sided error (never a false positive), determinant sieving. Sets of size 1 or 2 are padded with new elements, distinct for each set, which preserves disjointness, so the result holds for sets of size at most 3. The table after Theorem 3 lists $f(p, 3) = 1.4953^{3p}$, slightly above Theorem 2''s $1.493^{3p}$. Section 1.3 also gives $O^*(f(p,q))$ for $q$-sets. Corrected (Serge Gaspers, 21 November 2026: compute the actual number): Theorem 2''s $1.493^{3p}$ is below what the analysis gives. Section 4 ends with "time $O^*(3.3432^p)$ for $q=3$ with $\beta_1=0.281509$ and $\beta_2=0.679622$", and the table after Theorem 3 lists $1.4953^{3p}$; recomputed by the site from the running-time expression at the end of Section 4 (with $\langle a, b\rangle = a^a b^{-b} (a-b)^{-(a-b)}$): minimum $3.3431458^p$ at $\beta_1 = 0.281509$, $\beta_2 = 0.679623$, that is $1.4952659^{3p}$, while $1.493^3 = 3.3278$. Stored as the Section 4 statement $O^*(3.3432^{k})$.'
