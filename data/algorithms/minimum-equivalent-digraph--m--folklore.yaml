source:
  folklore: true
  note: "Try all $2^m$ sets $A' \\subseteq A$, compare the reachability of $(V, A')$ with that of $D$ by $n$ graph searches each, and keep the cheapest equivalent one (brute force baseline over arc subsets; it beats the $2^{4\\omega n}$ algorithm on sparse digraphs)."
