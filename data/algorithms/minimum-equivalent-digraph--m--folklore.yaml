problem: minimum-equivalent-digraph
proved_for: weighted
bound:
  as_stated: "O^*(2^{m})"
  notation: O*
  parameters: [m]
properties:
  randomized: false
  space:
    class: polynomial
    note: "One arc set $A'$ at a time."
  algebraic: false
  fast_matrix_multiplication: false
