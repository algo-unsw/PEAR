id: minimum-path-cover--n--folklore
problem: minimum-path-cover
proved_for: optimisation
bound:
  as_stated: "O(2^{n} n^{2})"
  notation: O
  parameters: [n]
properties:
  randomized: false
  space:
    class: exponential
    bound: "A table indexed by subsets of the vertices and an end vertex, $O(2^n n)$ entries."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: "Dynamic programming over subsets, in the style of Bellman and of Held and Karp: for $S \\subseteq V$ and $v \\in S$ let $f(S, v)$ be the minimum number of paths in a path partition of $G[S]$ in which $v$ ends a path. Then $f(\\{v\\}, v) = 1$ and, for $|S| \\ge 2$, $f(S, v) = \\min\\{\\min_{u \\in N(v) \\cap S \\setminus \\{v\\}} f(S \\setminus \\{v\\}, u),\\ 1 + \\min_{u \\in S \\setminus \\{v\\}} f(S \\setminus \\{v\\}, u)\\}$ (append $v$ to a path ending at a neighbour $u$, or make $v$ a path of its own); the optimum is $\\min_v f(V, v)$. $O(2^n n)$ entries, each in $O(n)$ time."
formal: { status: informal }
