id: connectivity-augmentation--k--korhonen-thorup-2026
problem: connectivity-augmentation
proved_for: decision
bound:
  as_stated: "2^{O(k \\log k)} N^{O(1)}"
  notation: O
  parameters: [k, N]
properties:
  randomized: false
  space:
    class: polynomial
    note: "Not stated; educated guess: polynomial. Irrelevant links are removed in polynomial time until $O(k)$ relevant links remain, one of which is in some solution, followed by branching on them; no dynamic programming or memoization found in the outline (Section 1)."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: korhonen-thorup-2026
  statements:
    arxiv-v1: { statement: "Theorem thm:edgeconn (stated in Section 1, proved in Section 4): \"There is an algorithm for the edge connectivity augmentation problem that runs in time $2^{O(k \\log k)} |G|^{O(1)}$.\"" }
  note: "Stated with $|G|^{O(1)}$; stored with $N^{O(1)}$, since $|G| \\le N$. The problem is exactly PEAR's decision version (Section 2.3: instance $(G, L, \\lambda, k)$, solution $S \\subseteq L$ with $|S| \\le k$ such that $G \\cup S$ is $\\lambda$-edge-connected), with no assumption on the connectivity of $G$. Unrefereed preprint (arXiv v1, 12 May 2026). Earlier results needed $G$ to be $(\\lambda-1)$-edge-connected or $\\lambda \\le 4$ (Marx and Végh, TALG 2015; Basavaraju et al., ICALP 2014; Carmesin and Ramanujan, SODA 2026)."
