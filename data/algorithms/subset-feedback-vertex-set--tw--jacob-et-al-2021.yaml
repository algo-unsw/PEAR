  note: 'Theorem 1 is stated for $n$-vertex graphs of treewidth $k$, even in the weighted setting; Section 2 works from a given tree decomposition of width $k$ ($k$ is written $tw$ here). TODO(verify): whether a decomposition must be given; it is recorded as given. Improves the polynomial factor of Bergougnoux, Bonnet, Brettell and Kwon ($2^{O(tw \log tw)} n^{O(1)}$, arXiv:2007.14179, IPEC 2020), who rule out $2^{o(tw \log tw)} n^{O(1)}$ under ETH. IPEC 2021 (LIPIcs) version not opened.'
