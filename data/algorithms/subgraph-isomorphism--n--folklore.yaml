  note: "Exhaustive search over the at most $n^k \\le n^n$ injective maps from $V_H$ to $V$, checking each in polynomial time. Cygan, Pachocki and Socała state that this exhaustive search runs in $2^{O(n \\log n)}$ time, with $n$ the total number of vertices of both graphs (at most $2n$ here)."
