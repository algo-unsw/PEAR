  statements:
    journal:
      statement: 'Theorem 5: "Connected Dominating Set can be solved exactly by an algorithm whose running time is in $O^*(1.8619^n)$ and uses polynomial space."'
  note: Reduces Connected Dominating Set on $G$ to Connected Red–Blue Dominating Set on a graph with $2|V|$ vertices (proof of Theorem 5) and solves that in $O^*(1.3645^{n})$ (Theorem 4) by branching and a reduction to Steiner Tree, solved with Nederlof's polynomial-space $O^*(2^k)$ algorithm; $1.3645^2 < 1.8619$. Deterministic. A minimum connected dominating set follows by self-reduction (the Steiner tree subroutine computes values; not stated).
