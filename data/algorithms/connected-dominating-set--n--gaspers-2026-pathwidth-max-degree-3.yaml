  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (b): Connected Dominating Set on graphs of maximum degree 3 by a Monte Carlo algorithm in time $3^{c_3 n+o(n)} = O(1.1661^n)$ ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). The same part also gives $4^{c_3 n+o(n)} = O(1.2139^n)$ (Cut&Count), which this record beats; not entered separately. Proof (Appendix A.7.3): the Monte Carlo algorithm of Bojikian et al. in time $3^{\mathrm{ctw}} n^{O(1)}$ for a given ordering of cutwidth ctw (their Theorem 23), on an ordering of cutwidth at most $c_3 n + o(n)$ (Corollary 10.2). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
