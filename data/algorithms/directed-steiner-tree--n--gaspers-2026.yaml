  note: 'Theorem 12.8: Directed Steiner Tree on digraphs with $n$ vertices by a randomized algorithm with one-sided error in time $2^{0.457n}n^{O(1)} = O(1.3727^n)$ and polynomial space. The paper asks for a Steiner set $S$ of non-terminals of least size (every terminal reachable from $r$ in $D[\{r\} \cup T \cup S]$); a minimum out-tree rooted at $r$ containing $T$ has exactly $|T| + |S|$ arcs for such a minimum $S$ (an out-arborescence of $D[\{r\} \cup T \cup S]$ reaching every vertex of a rooted Steiner set has one arc per non-root vertex; conversely the non-terminal vertices of an out-tree form a Steiner set), so the two optimisation versions are equivalent (a simple step). Inclusion–exclusion over branching walks as the extension step. arXiv v1, 1 November 2026; unrefereed preprint.'
