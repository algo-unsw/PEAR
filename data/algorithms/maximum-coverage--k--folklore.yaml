source:
  folklore: true
  note: 'Try all $\sum_{i \le k} \binom{m}{i} = O(m^k)$ subfamilies of at most $k$ sets (for $m \ge 2$) and count the covered elements of each in $O(N)$ time. The problem is W[2]-hard by $k$, since it contains Set Cover ($t = n$).'
