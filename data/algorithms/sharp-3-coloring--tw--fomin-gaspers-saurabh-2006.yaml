id: sharp-3-coloring--tw--fomin-gaspers-saurabh-2006
problem: sharp-3-coloring
proved_for: counting
bound:
  as_stated: '3^{tw} n^{O(1)}'
  notation: O
  parameters:
  - tw
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential. Dynamic programming over the tree decomposition, with a table entry for every colouring of a bag.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
given:
- tree-decomposition
source:
  paper: fomin-gaspers-saurabh-2006
  statements:
