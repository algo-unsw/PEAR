      statement: Lemma 5
  note: 'Lemma 5: given a tree decomposition of width $\ell$, #3-Coloring can be solved in time $O(3^{\ell} n^{O(1)})$. Stated without proof as a dynamic programming algorithm on graphs of bounded treewidth. Algorithmica version only. Fomin, Gaspers and Saurabh (COCOON 2007, Lemma 4) state $O(k^{\ell} n^{O(1)})$ for #$k$-Coloring on path decompositions.'
