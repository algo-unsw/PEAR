  note: 'Stated as "can be solved in $O(2^n)$ time and polynomial space", where the paper''s $O$ notation suppresses every factor polynomial in the input size (Section 2): stored as $O^*(2^n)$. Inclusion–exclusion over branching walks, counted by dynamic programming for each term (Section 4.3); no random choices. Decides whether a spanning tree with at least $c$ internal vertices exists. Preliminary version ICALP 2009.'
