  note: 'Stated as $O^*(r^{\beta_4(G)+o(n)})$ in time and space if the constraint graph $G$ has maximum degree at most 4, where $\beta_4(G) = \min\{F_4 n, F_3 n_3 + 0.2575 n_4, \frac{5}{32}n_3 + \frac14 n_4\} \le F_4 n$ and $F_4 < 0.24577198$ (Section 11.1); the implied $O^*(r^{0.24577198n+o(n)})$ is stored ($F_4$ is not expressible in the bound language). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
