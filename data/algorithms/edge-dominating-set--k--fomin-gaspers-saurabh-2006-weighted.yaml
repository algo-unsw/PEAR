id: edge-dominating-set--k--fomin-gaspers-saurabh-2006-weighted
problem: edge-dominating-set
proved_for: weighted
bound:
  as_stated: "2.4181^{k_w} n^{O(1)}"
  notation: O
  parameters: [k_w, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: exponential. The proof branches to build a partial vertex cover and then runs a dynamic program over a path decomposition of width $\\ell$ in $O(3^{\\ell} n^{O(1)})$ time (\"similar to the algorithm of Theorem 3\"), whose tables are exponential in the width."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: fomin-gaspers-saurabh-2006
  statements:
    journal-author-copy: { statement: "Theorem 6" }
  note: "Theorem 6 is proved for k-Weighted Edge Dominating Set with real weights $w(e) \\ge 1$ on every edge and $k \\in \\mathbb{R}^+$ (Section 6.2: find an edge set $D$ of weight at most $k$ such that every edge of $E \\setminus D$ is adjacent to an edge in $D$), so it covers PEAR's integer weights $\\ge 1$ (the default since 26 November 2026; entered on 21 November 2026 with a note that weight 0 was not covered). Theorem 6: \"k-Weighted Edge Dominating Set, k-Minimum Maximal Matching and k-Matrix Domination can be solved in time $O(2.4181^k n^{O(1)})$\". For the minimum weight $k_w$: with integer weights $\\ge 1$, trying $k = 1, 2, \\dots$ until a solution is found costs a geometric sum, $O(2.4181^{k_w} n^{O(1)})$ in total. Only the Algorithmica version is entered (decided by Serge Gaspers, 21 November 2026)."
