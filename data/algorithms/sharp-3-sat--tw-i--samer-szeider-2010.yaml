id: sharp-3-sat--tw-i--samer-szeider-2010
problem: sharp-3-sat
proved_for: counting
bound:
  as_stated: 4^{tw_i} N^{O(1)}
  notation: O
  parameters:
  - tw_i
  - N
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: dynamic programming over a nice tree decomposition, with a table of up to $2^{k}$ entries per node.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: false
  quantum: false
given:
- tree-decomposition
source:
  paper: samer-szeider-2010
  statements:
    preprint:
      statement: Theorem 3, for 3-CNF formulas
  note: 'Computes the number of satisfying assignments #(F) of a CNF formula, given a nice tree decomposition of width k of the incidence graph, in time $O(2^k (kl + 2^k (k + \\delta)) N)$, with $l$ the size of a largest clause, $\\delta$ the cost of arithmetic on the counts and $N$ the number of nodes of the decomposition. Conference version LPAR 2007; journal version J. Discrete Algorithms 2010.'
