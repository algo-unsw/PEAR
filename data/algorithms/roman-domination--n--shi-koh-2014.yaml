  note: "Theorem 3.1: \"The Roman domination problem can be solved in $\\mathcal{O}(1.5673^n)$ time and polynomial space.\" The algorithms count the minimum Roman dominating functions, which includes computing the Roman domination number (Algorithm 2, step 5, computes $\\gamma_R$ explicitly). Algorithm 1 (Section 3.1) models the problem as weighted Set Cover (universe $V$; sets $\\{v\\}$ of weight 1 and $N[v]$ of weight 2) and counts covers by weight with van Rooij's (2010) measure-and-conquer algorithm CWSC; Algorithm 2 (Section 3.2) uses Nederlof and van Rooij's (2010) algorithm CPSC for partial Red-Blue Dominating Set. Read in the arXiv PDF (v2, 10 March 2014; the paper was submitted as PDF only). Unrefereed preprint."
