id: edge-dominating-set--n--fomin-gaspers-saurabh-2006
problem: edge-dominating-set
proved_for: optimisation
bound:
  as_stated: '1.4082^{n}'
  notation: O
  parameters:
  - n
properties:
  randomized: false
  space:
    class: exponential
    note: 'Not stated; educated guess: exponential. The algorithm branches and switches to a dynamic program over a path decomposition (Lemma 2 of the ISAAC paper, Lemma 3 of the journal author copy: $O(3^p n^{O(1)})$ for width $p$) when the pathwidth is small.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: fomin-gaspers-saurabh-2006
  statements:
    journal-author-copy:
      statement: Theorem 1 and Corollary 1
  note: 'Theorem 1: a minimum maximal matching of a graph on $n$ vertices can be found in time $O(1.4082^n)$. Corollary 1: a minimum edge dominating set can be found in time $O(1.4082^n)$, since every minimum maximal matching is a minimum edge dominating set (Proposition 4). Only the Algorithmica version is cited (decided by Serge Gaspers, 21 November 2026: enter what is in the Algorithmica paper, not the ISAAC 2006 paper). Beaten by van Rooij and Bodlaender, $O(1.3226^n)$.'
