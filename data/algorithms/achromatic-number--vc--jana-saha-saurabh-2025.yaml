properties:
  randomized: true
  space:
    class: exponential
    note: "Not stated; educated guess: $2^{O(vc^2)} n^{O(1)}$. Guesses partitions of the vertex cover one at a time and solves Subgraph Isomorphism for a pattern of size $O(vc^2)$ and constant treewidth (Fact 2, colour coding), whose dynamic programme stores tables indexed by subsets of colours."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: jana-saha-saurabh-2025
  statements:
    conference: { statement: "Theorem 4" }
  note: "The algorithm reduces to Subgraph Isomorphism through the paper's Fact 2, which gives an expected-time bound (colour coding), so it is recorded as randomized; standard derandomization of colour coding would give a deterministic version, which the paper does not state. It also returns a complete colouring for yes-instances. Read in the LIPIcs PDF."
