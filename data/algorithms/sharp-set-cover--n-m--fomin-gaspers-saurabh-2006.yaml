  statements:
    journal-author-copy: { statement: "Theorem 4" }
  note: "#MWSC (Section 5.1) has a collection $S$ of non-empty subsets of $U$ with weights $w \\colon S \\to \\mathbb{R}^+$ and counts all set covers of minimum weight, so it covers PEAR's integer weights $\\ge 1$ (the default since 26 November 2026; entered on 21 November 2026 with a note that weight 0 was not covered). Theorem 4: \"Algorithm countMWSC solves #MWSC in time $O(1.2464^{|S|+|U|})$\", with $|S| = m$ sets and $|U| = n$ elements; it outputs the minimum weight and the number of set covers of that weight (Figure 2). It branches and runs a dynamic program over a path decomposition (Lemma 6). Only the Algorithmica version is entered (decided by Serge Gaspers, 21 November 2026)."
