source:
  paper: bojikian-firbas-ganian-2025
  statements:
    icalp: { statement: 'Theorem 3.1' }
  note: 'Theorem 3.1 solves unweighted Set of Degrees MST in $n^{O(k)}$ time given an NLC-decomposition with $k$ labels; the decision version here is the special case $D(v) = \{1, \dots, k\}$. An expression of clique-width $cw$ converts in polynomial time into an NLC-decomposition with at most $cw$ labels (NLC-width is at most clique-width), so the bound holds with $cw$; Section 1 states it as $n^{O(cw)}$. The decomposition is part of the input.'
