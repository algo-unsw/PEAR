id: exact-cover--n--folklore
problem: exact-cover
proved_for: decision
bound:
  as_stated: 2^{n} n m
  notation: O
  parameters:
  - n
  - m
properties:
  randomized: false
  space:
    class: exponential
    note: A table over all $2^n$ subsets of the universe.
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Dynamic programming over subsets: a set $X \subseteq U$ is exactly covered by sets of $\mathcal{F}$ iff $X = \emptyset$ or some $F \in \mathcal{F}$ contains the smallest element of $X$, satisfies $F \subseteq X$, and $X \setminus F$ is exactly covered. Each of the $2^n$ entries checks $m$ sets in $O(n)$ time each.'
