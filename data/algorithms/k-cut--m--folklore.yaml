id: k-cut--m--folklore
problem: k-cut
proved_for: weighted
bound:
  as_stated: '2^{m} (n + m)'
  notation: O
  parameters:
  - m
  - n
properties:
  randomized: false
  space:
    class: polynomial
    note: 'One set $S$ at a time.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Try all $2^m$ sets $S \subseteq E$ such that $G - S$ has at least $k$ components; merging components gives a partition into exactly $k$ nonempty sets that cuts at most the weight of $S$ (brute force; added at Serge Gaspers''s request, 20 November 2026).'
