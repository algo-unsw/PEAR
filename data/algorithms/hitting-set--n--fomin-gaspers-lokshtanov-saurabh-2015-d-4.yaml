source:
  paper: fomin-gaspers-lokshtanov-saurabh-2015
  statements:
    arxiv-v1:
      statement: 'Table 1 (row 4-Hitting Set: $3.0755^k$ of Fomin et al. 2010, new bound $1.6750^n$; Theorem 2)'
  note: 'Table 1 lists applications of Theorem 2 (deterministic); only its first row is randomized (caption). Theorem 2 with $c = 3.0755$ gives $(2 - 1/c)^{n + o(n)} N^{O(1)}$, base $1.67485\ldots$; the rounded-up base $1.6750$ absorbs the $2^{o(n)}$ factor. Theorem 1 gives the same base with one-sided error in polynomial space. Section 1 applies the theorems to $d$-Hitting Set as a special case of Min-Ones $d$-SAT. Previous bound in the table: $1.8704^n$ (Fomin et al. 2010).'
