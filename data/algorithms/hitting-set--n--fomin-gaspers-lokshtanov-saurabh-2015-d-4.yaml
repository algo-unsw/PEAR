  notation: O*
  parameters:
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: '$2^{o(n)}$ beyond the input algorithm: the deterministic variant needs "an additional $2^{o(n)}$ space requirement" (Conclusion of arXiv v1).'
