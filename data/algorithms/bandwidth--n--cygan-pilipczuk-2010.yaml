id: bandwidth--n--cygan-pilipczuk-2010
problem: bandwidth
proved_for: decision
bound:
  as_stated: O(9.363^{n})
  notation: O
  parameters: [n]
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Stated: polynomial space (abstract and Section 3); the states on a path are guessed with a divide-and-conquer recursion instead of being memoized.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: false
  quantum: false
source:
  paper: cygan-pilipczuk-2010
  statements:
    arxiv-v1:
      statement: Section 3 (Poly-space algorithm for Bandwidth) and abstract
  note: 'Section 3 opens: an $O(9.363^n)$-time and polynomial-space algorithm that, given $G$ and $1 \le b < n$, decides whether $G$ has an ordering of bandwidth at most $b$. Constructing the ordering is not stated. The introduction also states that the $O^*(20^{n/2})$ algorithm of Cygan and Pilipczuk (ICALP 2009) uses $O^*(20^{n/2})$ space, and a footnote says the analysis in an appendix proves that it runs in $O(4.383^n)$ time and space, to be published in the journal version of the ICALP paper (not stated as a result here).'
