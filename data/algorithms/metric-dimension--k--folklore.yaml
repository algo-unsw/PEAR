source:
  folklore: true
  note: "Try all $\\sum_{i \\le k} \\binom{n}{i} = O(n^k)$ sets of at most $k$ vertices and check each in polynomial time (Wikipedia, Metric dimension: \"testing all possible k-tuples\" is not FPT). Hartung and Nichterlein (CCC 2013) proved the problem W[2]-hard parameterized by $k$ (cited in arXiv 2405.01344v2, Introduction), so an XP baseline is the natural bound. TODO(verify): Serge to approve this XP baseline."
