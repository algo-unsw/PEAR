id: metric-dimension--k--folklore
problem: metric-dimension
proved_for: decision
bound:
  as_stated: "O^*(n^{k})"
  notation: O*
  parameters: [n, k]
properties:
  randomized: false
  space:
    class: polynomial
    note: "All-pairs distances, then one candidate set at a time."
  algebraic: false
