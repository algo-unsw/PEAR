id: steiner-forest--p--feldmann-lampis-2024
problem: steiner-forest
proved_for: weighted
bound:
  as_stated: '2^{O(p)} n^{O(1)}'
  notation: O
  parameters:
  - p
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential. The Dreyfus–Wagner dynamic program keeps a table over subsets of terminals and vertices, and the recurrence over subsets of the demands (Chitnis–Feldmann–Manurangsi, proof of Theorem 1.6) keeps one value per subset.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: feldmann-lampis-2024
  statements:
    icalp:
      statement: 'Section 1.2: "The algorithm of [15] can be generalized to solve Steiner Forest in $2^{O(p)} n^{O(1)}$ time (cf. [12])."'
    arxiv:
      statement: 'Section 1.2 of arXiv v2 (same sentence)'
  note: 'Stated as related work, with $p = |R|$ the number of terminals; [15] is Dreyfus–Wagner and [12] Chitnis–Feldmann–Manurangsi (ACM TALG 2021). The proof of Theorem 1.6 there runs its recurrence over subsets of the $d$ demand pairs, which gives $2^{O(d)} n^{O(1)}$ as written. A bound in $p$ follows from the same recurrence over subsets of the connected components of the demand graph (at most $p/2$ of them), since the solution forest joins every such component inside one tree; Dreyfus–Wagner gives the Steiner tree cost of every terminal subset in $3^p n^{O(1)}$ time. Through the constraint $p \le 2k$, PEAR derives $2^{O(k)} n^{O(1)}$ for the solution size (Serge Gaspers, 21 November 2026).'
