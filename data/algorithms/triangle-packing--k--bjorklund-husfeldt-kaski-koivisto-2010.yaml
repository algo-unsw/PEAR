  note: "Stated for $p$-packing of 3-sets: 'can be solved by a randomized algorithm in time $O^*(1.493^{3p})$ with constant one-sided error'; Section 1.2 names vertex-disjoint triangle packing as the case where the family consists of the vertex sets of triangles (at most $n^3$ sets, found in polynomial time). Determinant sieving, so algebraic. Never a false positive. The table there lists earlier deterministic bounds, best $3.523^{3p}$ (Wang and Feng) for 3-set packing. Corrected (Serge Gaspers, 21 November 2026: compute the actual number): Theorem 2's $1.493^{3p}$ is below what the analysis gives. Section 4 ends with \"time $O^*(3.3432^p)$ for $q=3$ with $\\beta_1=0.281509$ and $\\beta_2=0.679622$\", and the table after Theorem 3 lists $1.4953^{3p}$; recomputed by the site from the running-time expression at the end of Section 4 (with $\\langle a, b\\rangle = a^a b^{-b} (a-b)^{-(a-b)}$): minimum $3.3431458^p$ at $\\beta_1 = 0.281509$, $\\beta_2 = 0.679623$, that is $1.4952659^{3p}$, while $1.493^3 = 3.3278$. Stored as the Section 4 statement $O^*(3.3432^{k})$."
