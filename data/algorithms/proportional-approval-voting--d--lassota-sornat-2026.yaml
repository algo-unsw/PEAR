source:
  paper: lassota-sornat-2026
  statements:
    arxiv: { statement: "Proposition 15" }
  note: 'Stated for every Thiele sequence $w$ with $w_1 = 1$, so for PAV ($w_j = 1/j$): "$w$-Thiele can be solved in time $2^{d^{O(d)}} \cdot n m^{O(1)}$", where $d$ is the total score of an optimal committee and $n$ is the number of voters, $m$ the number of candidates there (renamed $m$ and $n$ here). The colour coding is derandomized with splitters (Naor, Schulman and Srinivasan), so the algorithm is deterministic. The decision version with target $d$ reduces to it with the same parameter, by the argument of the proof: if a candidate is approved by at least $d$ voters or a greedy committee represents at least $d$ voters the answer is yes; otherwise $k$ and the maximum number of approvals of a candidate are at most $d$, and Theorem 14 (FPT in $k + \Delta_C$) computes the optimum. Numbering read from the LaTeX source of the arXiv version (theorems, lemmas, propositions and definitions share one counter); TODO(verify) whether the AAAI 2026 version contains this proposition and its number there; marked unverified until then (the arXiv version, July 2026, is later than the AAAI paper, January 2026).'
