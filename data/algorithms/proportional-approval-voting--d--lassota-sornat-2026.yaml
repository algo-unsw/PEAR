    bound: 'Not stated; educated guess: $2^{d^{O(d)}} N^{O(1)}$. The algorithm reduces to $p$-partial set cover with $p \le d \cdot d! \cdot \Delta_C$ and uses Bläser''s $2^{O(p)} s t$-time algorithm (colour coding with dynamic programming over subsets of colours); when there are fewer voters than $k$, it calls an integer-programming algorithm for Thiele rules parameterized by the number of voters (Faliszewski et al.).'
