properties:
  randomized: { error: one-sided }
  space:
    class: polynomial
    note: "Not stated; educated guess: polynomial. Colour coding with $\\lceil e^{t} \\rceil$ independent repetitions; each repetition calls the colourful-subgraph routine of Lemma 1, stated to use polynomial space, and small instances ($k 2^{k} \\ge n$) go to the polynomial-space $2^{n} n^{O(1)}$ algorithm of Gupta et al. No memoization or dynamic programming over subsets found in the in-degree section."
