  paper: wang-peng-liu-2026
  statements:
    arxiv-v1: { statement: "Lemma 7 (Algorithm 1), giving Theorem 3" }
  note: "Lemma 7: Algorithm 1 runs in time $(2e)^{t} \\cdot n^{O(1)}$, where $t = k \\cdot 2^{k} - k$, stored here with $t$ substituted; $k = |N_{\\mathrm{in}}(v^*)|$. The paper calls it a one-sided error Monte Carlo algorithm with a constant probability of a false negative: a yes is always correct. Theorem 3 itself states only fixed-parameter tractability by the in-degree. Read in arXiv:2601.08530 (PDF only), 21 November 2026."
