source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem C.3(a)'
      page: 153
  note: "Theorem C.3(a): $r^{\\gamma n+o(n)}=r^{\\alpha m+o(m)}$ in polynomial space if the constraint graph is cubic, with $\\gamma=2c_3/(1+4c_3)<0.179341$ and $\\alpha=2\\gamma/3<0.119561$ (after the theorem); the implied bound is stored. The algorithm of Gaspers and Sorkin (Separate, Measure and Conquer, rules R1–R9) with the separators of Lemma C.2(a); rule R2 applies Reductions 1 and 2. Stated for cubic constraint graphs; it holds for maximum degree at most 3 (Serge Gaspers, 21 November 2026: transfer cubic results where they extend): the algorithm first applies Reductions 0, 1 and 2 of Scott and Sorkin, which take polynomial time, delete a vertex of degree at most 2 and never increase a degree, the number of vertices or the number of edges (Reduction 2 replaces $xy, yz$ by $xz$, merged with an existing edge), until the constraint graph is cubic or empty; the cubic instance has $n' \\le n$ vertices and $m' \\le m$ edges, so the cubic bound in $n'$ or $m'$ is at most the stated bound in $n$ or $m$. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version); unrefereed preprint."
