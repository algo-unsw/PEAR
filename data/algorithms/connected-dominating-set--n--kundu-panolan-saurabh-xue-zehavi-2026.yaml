  note: 'Stated as $2^{O(n\eta(n)^3/\sqrt{\lambda(n)})}$ ($\lambda(t) = \log_2(t+2)$, $\eta(t) = \log_2\log_2(t+4)$). On a yes-instance it returns a valid solution with probability at least 2/3; on a no-instance it always reports NO. Small-weight Cut\&Count with $2^{O(n/\log n)}$ isolation trials; the formulas have width at most four, and OpenAI''s Lean theorem covers every fixed width (Section 4.2 cites it for this assumption). Inputs have at least one edge (Section 8.2).'
