  note: 'Counts the index sets of size at most $b$ that cover the universe, deterministically, in time $2^{O(t\eta(t)^2/\sqrt{\lambda(t)})}$ with $t = |U| + q$ (here $n + m$); the count is positive exactly on yes-instances, and a cover is recovered with at most $q + 1$ counting calls (after Theorem 8.1). The formulas have width at most three. Assumption 4.5 is OpenAI''s theorem (Section 4.2), whose Lean statement was checked on 12 November 2026. The paper also states the Hitting Set case through the cardinality-preserving bijection after Theorem 8.1.'
