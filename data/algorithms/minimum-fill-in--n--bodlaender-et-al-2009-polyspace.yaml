id: minimum-fill-in--n--bodlaender-et-al-2009-polyspace
problem: minimum-fill-in
proved_for: optimisation
bound:
  as_stated: O^*(4^{n})
  notation: O*
  parameters: [n]
properties:
  randomized: false
  space:
    class: polynomial
    note: 'Stated: polynomial space (Theorems 3 and 10): the recurrence is evaluated recursively, splitting the ordering in the middle, without a table.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: bodlaender-et-al-2009
  statements:
    techreport:
      statement: Theorem 10 (2), with Theorem 3 (page 12)
  note: 'Theorem 10 lists Minimum Fill-In among the vertex ordering problems that "can be solved in $O^*(4^n)$ time and polynomial space" (the Gurevich–Shelah variant of the Held–Karp recurrence). The paper adds: "While for Treewidth there are polynomial space algorithms that are faster than the $O^*(4^n)$ bound implied by Theorem 3, this remains open for Minimum Fill-In" (Section 5.2). The faster known algorithms use exponential space.'
