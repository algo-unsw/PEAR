id: max-2-csp--m--gaspers-sorkin-2017
problem: max-2-csp
proved_for: optimisation
bound:
  as_stated: 'r^{9m/50 + o(m)}'
  notation: O
  parameters:
  - r
  - m
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Polynomial space, as stated (Theorem 3.1).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: gaspers-sorkin-2017
  statements:
    arxiv-v2:
      statement: 'Theorem 3.1'
  note: 'Theorem 3.1: on a Max 2-CSP instance whose constraint graph has $n$ vertices and $m$ edges, the algorithm runs in time $r^{n/5+o(n)} = r^{2m/15+o(m)}$ if the graph is cubic, $r^{7m/40+o(m)}$ for maximum degree 4, and $r^{9m/50+o(m)}$ in general, in polynomial space. The paper''s scores are real numbers; integer scores are a special case. Edwards (J. Comput. Syst. Sci. 2016) independently obtained the same running times (Section 1.2). Branching on separator vertices, no randomization. arXiv v1 3 April 2014, v2 17 November 2017 (read); ICALP 2015; ACM TALG 2017.'
