  note: 'Held–Karp-style dynamic programming over vertex orderings. Section 5.7 defines Directed Feedback Arc Set (minimum number, or weight, of arcs whose removal leaves the digraph acyclic) and Lemma 9 rewrites it as a minimum over linear orderings, so Theorem 1 applies; Theorem 10 lists it among the problems solvable in $O^*(2^n)$ time and space. Read in the open technical report UU-CS-2009-023 through a web fetch (text extracted by a summariser; formulas garbled in extraction). Journal version (Theory Comput. Syst. 2012) not opened.'
