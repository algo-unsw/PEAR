bound:
  as_stated: 'O(1.6181^{k} + n^{O(1)})'
  notation: O
  parameters: [k, n]
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Not stated for the whole algorithm; educated guess: polynomial. The families of set pairs are enumerated in polynomial space, as stated (arXiv v1, Lemmas 4 and 5); the rest is the kernel of Dom et al., branching, and a divide-and-conquer recursion over balanced edge partitions. No memoization or dynamic programming found.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: kumar-lokshtanov-2015
  statements:
    stacs: { statement: "Theorem 14" }
  note: 'arXiv v1 states $O(1.618^k + n^{O(1)})$ (Theorem 1); the STACS version states $1.6181^k$, which is stored ($1.618$ is below the golden ratio, the root of the branching recurrence $f(k) \le f(k-1) + f(k-2)$). Still the fastest known in 2024 according to the abstract of Jana, Kanesh, Kundu and Saurabh (IPEC 2024, LIPIcs). Earlier: $2^k n^{O(1)}$ by Dom, Guo, Hüffner, Niedermeier and Truss (CIAC 2006; J. Discrete Algorithms 2010) and $O(2.42^k n^{O(1)})$ by Raman and Saurabh, as cited in Section 1.'
