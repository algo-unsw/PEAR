id: dominating-set--k--patrascu-williams-2010
problem: dominating-set
proved_for: decision
bound:
  as_stated: n^{k + o(1)}
  notation: O
  parameters:
  - n
  - k
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: $n^{k + o(1)}$. The algorithm forms the product $A_k A_k^{T}$ of $\binom{n}{k/2} \times n$ Boolean matrices (rectangular matrix multiplication), an $\binom{n}{k/2} \times \binom{n}{k/2}$ table.'
  algebraic: true
  fast_matrix_multiplication: true
  constructive: true
  quantum: false
source:
  paper: patrascu-williams-2010
  statements:
    soda:
      statement: Proposition 2
  note: 'For every fixed $k \ge 7$. Uses Coppersmith''s rectangular matrix multiplication ($n \times n^{0.294}$ by $n^{0.294} \times n$ in $n^{2+o(1)}$ ring operations). The introduction attributes the $n^{k+o(1)}$ bound for $k \ge 7$ also to Eisenbrand and Grandoni (TCS 2004). Read in a course copy of the SODA 2010 paper.'
