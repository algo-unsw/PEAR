id: hamiltonian-cycle--n--cygan-kratsch-nederlof-2013-max-degree-3
problem: hamiltonian-cycle
proved_for: decision-max-degree-3
bound:
  as_stated: (1 + \sqrt{2})^{n/6} n^{O(1)}
  notation: O
  parameters:
  - n
properties:
  randomized:
    error: one-sided
  space:
    class: exponential
    note: 'Not stated in the corollary; educated guess: exponential. Dynamic programming over a path decomposition of width about $n/6$.'
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: cygan-kratsch-nederlof-2013
  statements:
    arxiv-v1:
      statement: 'Corollary 4.5: "There exists a Monte-Carlo algorithm that given a graph $G$ of maximum degree three solves the Hamiltonian cycle problem in $(1+\sqrt{2})^{n/6} n^{O(1)} \le 1.1583^n n^{O(1)}$ time."'
  note: 'The algorithm "cannot give false positives and may give false negatives with probability at most 1/2" (Corollary 4.5). Decision only. The introduction writes the base as $(2+\sqrt{2})^{n/6}$, which does not match $1.1583^n$; the corollary''s $(1+\sqrt{2})^{n/6}$ does. Read in arXiv v1, 27 November 2026. TODO(verify): the numbering in the STOC 2013 and JACM 2018 versions.'
formal:
  status: informal
status: valid
