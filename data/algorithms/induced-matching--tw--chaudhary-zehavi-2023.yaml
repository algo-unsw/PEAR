id: induced-matching--tw--chaudhary-zehavi-2023
problem: induced-matching
proved_for: decision
bound:
  as_stated: "3^{tw} tw^{O(1)} n"
  notation: O
  parameters: [n, tw]
properties:
  randomized: false
  space:
    class: exponential
    bound: "Not stated; educated guess: $3^{tw} n^{O(1)}$. Dynamic programming over a nice tree decomposition (with the deferred edge property), with fast subset convolution at join nodes; tables indexed by states of the bag vertices."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
given: [tree-decomposition]
source:
  paper: chaudhary-zehavi-2023
  statements:
    arxiv-v1: { statement: "Section 3 (Main Results), theorem on Induced Matching (the first theorem of the paper), proved in Section 5" }
  note: "Stated as \"Induced Matching can be solved in $3^{tw} \\cdot tw^{O(1)} \\cdot n$ time by a deterministic algorithm\", for an input given with a tree decomposition of width $tw$. Improves the $O(4^{tw} \\cdot n)$ algorithm of Moser and Sikdar (DAM 2009, Theorem 27). A later paper (arXiv 2502.14161) shows that the base 3 is optimal under the pw-SETH."
