source:
  folklore: true
  note: 'Assign each vertex to one of the $p$ terminals, each terminal to itself, in all at most $p^n$ ways, and add up the weights of the edges between different classes: merging the components of $G - S$ without a terminal into a class with one does not cut more edges (brute force; added at Serge Gaspers''s request, 20 November 2026).'
