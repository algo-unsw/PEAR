id: boxicity--vc--adiga-chitnis-saurabh-2010
problem: boxicity
proved_for: optimisation
bound:
  as_stated: "2^{O(2^{vc} vc^{2})} n"
  notation: O
  parameters: [vc, n]
properties:
  randomized: false
  space:
    class: polynomial
    bound: "Not stated; educated guess: polynomial. The algorithm keeps one vertex per neighbourhood class of the independent set, enumerates box representations of the reduced graph (by endpoint orderings, Proposition 1) and checks each for extendability (Lemma 3); no dynamic programming, memoization or ILP found."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: adiga-chitnis-saurabh-2010
  statements:
    full-version: { statement: "Theorem 1", page: 8 }
  note: "Theorem 1: \"For graphs on $n$ vertices with vertex cover bounded by $k$, the boxicity and an optimal box-representation can be computed in time $2^{O(2^k k^2)} n$.\" A $k$-vertex cover is computed in $O(2^k + kn)$ time (page 6). Read in the authors' full version (undated; \"A preliminary version of this paper was presented in ISAAC 2010\"); the ISAAC version was not opened. Ganian (2011) extends the result to twin cover, and Bruhn et al. to cluster vertex deletion."
