  note: 'The bound the Lean formalization proves, for every fixed $k \ge 2$ (here $k = 3$): a deterministic machine counts the satisfying assignments of a canonically encoded $k$-CNF in $(L+1)^{O_k(1)} 2^{O_k(n(\log\log n)^2/\sqrt{\log n})}$ time, $L$ the bit length of the encoding (here $N$), visiting at most $(L+1)^{O_k(1)}$ tape cells. Scope: https://github.com/openai/math/blob/main/lean/docs/378.md'
