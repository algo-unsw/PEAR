id: sharp-3-sat--n--openai-2026-lean
problem: sharp-3-sat
proved_for: counting
bound:
  as_stated: N^{O(1)} 2^{O(n (\log\log n)^{2} / \sqrt{\log n})}
  notation: O
  parameters:
