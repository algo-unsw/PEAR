source:
  paper: openai-2026-eth
  statements:
    preprint:
      statement: 'Lean theorem OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat (lean/ComparatorChallenges/SubexponentialSAT.lean; scope document 378)'
  note: 'The Lean theorem, for every fixed $k \ge 2$ (here $k = 3$): one deterministic multi-tape Turing machine, given the canonical encoding of a CNF over $n$ variables with at most $k$ literals per clause, writes the number of satisfying assignments in at most $C (L+1)^{d} 2^{A n (\log\log(n+16))^{2}/\sqrt{\log(n+16)}}$ steps, $L$ the bit length of the encoding, and visits at most $S (L+1)^{e}$ tape cells at every step. The canonical encoding writes $n$ and the literal codes $2i + [\text{positive}]$ in unary, with clauses and formulas as sorted sets; $L = O(n + mn)$, and our input is brought to that form in time polynomial in $n + N$; the factor $(L + 1)^{O(1)}$ becomes $N^{O(1)}$, as any factor $n^{O(1)}$ is absorbed by the exponential term. Checked against commit 4eaee87 of github.com/openai/math (29 October 2026); the proof file has no sorry and declares no axioms.'
formal:
  status: proved
  prover: lean
  link: https://github.com/openai/math/blob/4eaee87/lean/ComparatorChallenges/SubexponentialSAT.lean
  statement_checked: 'Claude, 12 November 2026, at Serge Gaspers'' request: same problem (count over all $2^n$ assignments of $x_1, \dots, x_n$; clauses with at most 3 literals), bound in $n$ and the encoding length; definitions in the challenge file read in full.'
