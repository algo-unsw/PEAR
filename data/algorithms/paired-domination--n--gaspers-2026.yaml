  note: 'Theorem 12.10: "For graphs $G$ with $n$ vertices and no isolated vertex, $\gamma_{\mathrm{pr}}(G)$ can be computed by a randomized algorithm with one-sided error in time $O(1.6302^n)$ and polynomial space." Monotone Local Search with sample-dependent running time; the extension (Lemma 12.9) uses inclusion–exclusion over undominated vertices and a Tutte matrix with Schwartz–Zippel identity testing (algebraic). The base is $2^{\psi_{\mathrm{pr}}} = 1.63015\ldots$ with $\psi_{\mathrm{pr}} = h_6(y^*)$, $y^* = (3\sqrt3 - 1)/16$, which has no closed form in the bound language, so the stated $1.6302$ is stored; the analysis is tight for this algorithm (Proposition 12.11). Vertex weights in unary give the same bound (a theorem stated after Proposition 12.11 and proved in an appendix; its number was not checked; not entered). Previous: $O(1.7159^n)$, polynomial space, by Andreev, Bliznets, Kundu, Saurabh, Tripathi and Verma (IWOCA 2024; entered as `paired-domination--n--andreev-bliznets-kundu-saurabh-tripathi-verma-2024`). Numbering read from the LaTeX source (one counter per section), matching the serge-08 notes; unrefereed preprint.'
