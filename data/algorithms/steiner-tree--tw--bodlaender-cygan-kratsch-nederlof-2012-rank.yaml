source:
  paper: bodlaender-cygan-kratsch-nederlof-2012
  statements:
    arxiv-v1:
      statement: Theorem 3.8
  note: 'Rank-based approach, deterministic (abstract). Theorem 3.8 is for edge weights $w \colon E \to \mathbb{N} \setminus \{0\}$ (Section 3.3; the paper writes $\omega$ for the weights too), hence proved for the weighted version (Serge Gaspers, 20 November 2026). PEAR''s weighted version also allows weight 0, which the theorem does not: contract every zero-weight edge first. An optimal tree maps to a subgraph of the contracted graph of no larger weight, and a tree there lifts back by adding zero-weight spanning trees of the contracted parts. Replacing each vertex in the bags of the given decomposition by its image gives a decomposition of the contracted graph of no larger width (decided by Claude with this note, under Serge''s rule of 21 November 2026); $n(1+2^{\omega})^{pw} pw^{O(1)}$ with a path decomposition.'
