id: steiner-tree--tw--bodlaender-cygan-kratsch-nederlof-2012-rank
problem: steiner-tree
proved_for: weighted
bound:
  as_stated: '(1 + 2^{\omega + 1})^{tw} tw^{O(1)} n'
  notation: O
  parameters:
  - tw
  - n
properties:
  randomized: false
  space:
    class: exponential
    note: 'Not stated; educated guess: exponential. Dynamic programming over the given tree decomposition keeps tables exponential in the width.'
  algebraic: true
  fast_matrix_multiplication: true
  constructive: true
  quantum: false
given:
- tree-decomposition
source:
  paper: bodlaender-cygan-kratsch-nederlof-2012
  statements:
    arxiv-v1:
      statement: Theorem 3.8
  note: 'Rank-based approach, deterministic (abstract). Theorem 3.8 is for edge weights $w \colon E \to \mathbb{N} \setminus \{0\}$ (Section 3.3; the paper writes $\omega$ for the weights too), hence proved for the weighted version (Serge Gaspers, 20 November 2026), whose weights are the positive integers (26 November 2026; until then PEAR allowed weight 0, handled by contracting zero-weight edges first); $n(1+2^{\omega})^{pw} pw^{O(1)}$ with a path decomposition.'
