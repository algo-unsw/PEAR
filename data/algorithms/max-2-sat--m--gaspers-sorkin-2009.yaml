source:
  paper: gaspers-sorkin-2009
  statements:
    arxiv-v1:
      statement: 'Theorem 4 with Table 2 ($p = 0$, $\Delta(F) \ge 6$), and Section 12'
      page: 11
  note: 'Theorem 4 bounds the time of the hybrid Max 2-CSP algorithm by $O^*(2^{m((1-p)w_e + p w_h)})$ for the pairs $(w_e, w_h)$ of Table 2; a Max 2-SAT instance has $p = 0$, and Table 2 gives $w = 0.15819$, while Section 12 states "$O^*(2^{0.1582 m})$ or $O^*(2^{m/6.321})$" (and gives $w_e \approx 0.15820$). Stored as the headline $O^*(2^{m/6.321})$ (abstract of the SODA version, Section 1.2), the weakest of the three ($1/6.321 = 0.15820\ldots$). In the paper $m$ counts the 2-variable clauses (unit clauses are monadic score functions), so the bound also holds with $m$ the number of all clauses. The algorithm returns an optimal assignment. arXiv v1 18 June 2009 (read); SODA 2009; J. Comput. Syst. Sci. 2012.'
