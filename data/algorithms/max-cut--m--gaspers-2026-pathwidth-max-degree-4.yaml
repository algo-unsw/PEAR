  note: 'Theorem 11.3(3): Max $(r,2)$-CSP in time and space $O^*(r^{3F_4m/(2+16F_4)+o(m)})$ if the constraint graph has maximum degree at most 4; the paper states $\frac{3F_4}{2+16F_4} < 0.12429$, so the implied $O^*(2^{0.12429m+o(m)})$ is stored for $r = 2$. Max Cut with edge weights $w$ is the case $r = 2$: one variable per vertex and, for each edge $uv$, the score $w(uv)$ when $u$ and $v$ get different values and $0$ otherwise, so the constraint graph is $G$ itself (same maximum degree) and $m$ is the number of edges (as in `max-cut--m--gaspers-2026-pathwidth`). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
