  note: "Abstract of the conference (ESA 2011) version only; the full text was not read (closed). Entered under the rule of 21 November 2026. The abstract (Zotero item KAVNHLPH, from the publisher's metadata): \"an induced planar subgraph of maximum size can be found in time O(1.7347^n)\" (superscript flattened in the metadata). Stated for Maximum Induced Planar Subgraph: $V \\setminus S$ induces a planar graph if and only if $G - S$ is planar, so a maximum induced planar subgraph gives a minimum planar deletion set (the optimisation version). TODO(verify): deterministic and constructive assumed; space not stated in the abstract."
