id: minimum-bisection--tw--hanaka-kobayashi-sone-2020
problem: minimum-bisection
proved_for: weighted
bound:
  as_stated: 'O(2^{tw}(tw n)^{2})'
  notation: O
  parameters: [tw, n]
properties:
  randomized: false
  space:
    class: exponential
    bound: 'Not stated; educated guess: exponential in $tw$. Dynamic programming over a nice tree decomposition with a value for every subset $S$ of a bag and every size $d \le n$ (Section 3.1).'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
given: [tree-decomposition]
source:
  paper: hanaka-kobayashi-sone-2020
  statements:
    arxiv: { statement: "Abstract and Theorem thm:twdp (Section 3.2), which is stated for Max Bisection; Section 3 opens by noting that with arbitrary real edge weights Min Bisection is essentially equivalent to Max Bisection" }
  note: 'Stated as $O(2^t(tn)^2)$ for a tree decomposition of width $t$ given with the input and real edge weights (negative weights allowed); $t$ is written $tw$ here. Refines the $O(2^t n^3)$ analysis of Jansen, Karpinski, Lingas and Seidel (SIAM J. Comput. 2005). Read in the current arXiv version of 2002.12706 (20 November 2026); TODO(verify) the printed theorem number. Theoretical Computer Science 2021.'
