problem: graph-genus
proved_for: decision
bound:
  as_stated: "O(f(g) n)"
  notation: O
  parameters: [g, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: at most the running time, $O(f(g) n)$, so linear in $n$ but possibly exponential in $g$. The steps found include dynamic programming over tree decompositions of width bounded in $g$ (tables exponential in the width). TODO(verify)."
  algebraic: false
