      page: 82
  note: 'Theorem 13.1 counts the dominating sets of each size deterministically in time and space $O(1.4815^n)$; the minimum size of a dominating set is the least $\ell$ with a nonzero count, which gives the optimisation version (a simple step). The theorem also covers the counts of each size and weight for real vertex weights with $n^{O(1)}$ distinct subset sums, a restriction PEAR''s weighted version does not have. The algorithm is that of Nederlof, van Rooij and van Dijk with a later switch to dynamic programming; the paper reports a gap in their analysis (their algorithm runs in $O(1.5004^n)$ instead of the stated $O(1.5002^n)$; Section 13 and the appendix section "A gap in the previous analysis", p. 182). Computer-assisted. arXiv v1, 3 November 2026 (read: LaTeX source and the v1 PDF); unrefereed preprint.'
