  notation: O*
  parameters:
  - n
properties:
  randomized: false
  space:
    class: polynomial
    note: 'Not stated; educated guess: polynomial. Depth-first branching analysed with Measure and Conquer, checking minimality at each leaf; no memoization, dynamic programming or stored tables found.'
