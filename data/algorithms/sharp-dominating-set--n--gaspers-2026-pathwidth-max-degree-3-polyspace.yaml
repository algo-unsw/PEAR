      page: 153
  note: 'Theorem C.3 (polynomial-space Max 2-CSP), last sentence: "The numbers of dominating sets of each size of an $n$-vertex graph of maximum degree at most 3 can be computed in polynomial space and time $3^{\gamma n+o(n)}$", with $\gamma = 2c_3/(1+4c_3) < 0.179341$; the text after the theorem: $3^\gamma < 1.21778$, "so the last bound is $O(1.2178^n)$". The counting algorithm of Gaspers and Sorkin (Section 5.1 of their TALG paper) with the separators of Lemma C.2. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
