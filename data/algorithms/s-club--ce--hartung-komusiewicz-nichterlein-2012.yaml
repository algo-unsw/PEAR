  note: "Corollary 1: \"(Weighted) $s$-Club for $s \\ge 2$ parameterized by the size $k$ of a cluster editing set can be solved in $O(6.86^k \\cdot k^3 + n + m)$ time.\" Read in the open-access JGAA version (2015). TODO(verify): whether a minimum cluster editing set must be given or computed (the kernel of Theorem 2 is computed in $O(n + m)$ time)."
