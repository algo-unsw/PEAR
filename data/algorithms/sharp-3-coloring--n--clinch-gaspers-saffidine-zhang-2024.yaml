  note: 'Piecewise analysis of the #3-Coloring algorithm of Fomin, Gaspers and Saurabh (COCOON 2007), whose original analysis gave $O(1.6262^n)$. Theorem 8 (Section 5.2) of the latest arXiv version (v3, 29 June 2024; read: arXiv PDF and the Zotero copy). Not the best known: Zhu, Wu and Shao (Discrete Appl. Math. 322, 2022) state $O(1.588^n)$ in their abstract, but no open copy was found (unreachable ledger, serge-05).'
