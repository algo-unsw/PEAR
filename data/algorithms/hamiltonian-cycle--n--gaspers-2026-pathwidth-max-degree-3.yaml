  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (c): Hamiltonian Cycle by a Monte Carlo algorithm in time $(1+\sqrt2)^{c_3 n+o(n)} = O(1.1312^n)$ on graphs of maximum degree 3 ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). Proof (Appendix A.7.3): the Monte Carlo algorithm of Bojikian, Chekan and Kratsch in time $(1+\sqrt2)^{\mathrm{ctw}} n^{O(1)}$ for a given ordering of cutwidth ctw (their Theorem 47), on an ordering of cutwidth at most $c_3 n + o(n)$ (Corollary 10.2). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
