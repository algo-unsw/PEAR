    bound: 'Not stated; educated guess: $f(s) \cdot n$. The algorithm ends with Courcelle''s theorem (dynamic programming over a tree decomposition of width bounded by a function of $s$) and calls the Jansen–Lokshtanov–Saurabh planarization algorithm, itself a dynamic programming over tree decompositions.'
