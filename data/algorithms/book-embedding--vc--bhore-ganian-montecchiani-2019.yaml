  note: 'JGAA Theorem 3: "A book embedding of $G$ with minimum number of pages can be computed in $O(2^{\tau^{O(\tau)}} + \tau \log \tau \cdot n)$ time", $\tau$ the vertex cover number. The arXiv LaTeX source (latest version) states the corollary as $O(\tau^{\tau^{O(\tau)}} + \tau \log \tau \cdot n)$, the same up to the form of the hidden constant. Kernel of size $O(k^{\tau})$ plus brute force over linear orders and page assignments.'
