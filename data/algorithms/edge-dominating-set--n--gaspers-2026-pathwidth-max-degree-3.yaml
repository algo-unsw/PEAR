source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem 11.4(d)'
      page: 79
  note: 'Theorem 11.4 (bounded-degree graph problems), Section 11.4. Part (d): if $\Delta(G) \le 3$, a minimum edge dominating set and a minimum maximal matching of $G$ can be found in time and space $O^*(3^{c_3 n_3+o(n)}) = O(1.1661^n)$ ($c_3 = \frac{3}{4\pi}\arccos\frac56 < 0.1398222$). The dynamic program of van Rooij and Bodlaender for a minimum weight maximal matching in time $O^*(3^{\mathrm{pw}})$ (their Lemma 3) over a path decomposition of width at most $c_3 n_3 + o(n) \le c_3 n + o(n)$ (Lemma 11.2) for maximum degree 3, or $\beta_4(G) + o(n) \le F_4 n + o(n)$ (Theorem 7.1 and Theorem 1.5) for maximum degree 4, computed in polynomial time; a minimum edge dominating set can be turned in polynomial time into a maximal matching of the same size (Yannakakis and Gavril). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
