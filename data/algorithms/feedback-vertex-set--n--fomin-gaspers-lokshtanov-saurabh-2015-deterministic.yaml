  statements:
    arxiv-v1:
      statement: 'Theorem 2 (derandomized Monotone Local Search, $(2 - 1/c)^{n + o(n)}$) with $c = 2 + \phi$, the Kociumaka–Pilipczuk bound'
  note: 'Corrected (approved by Serge Gaspers, 18 November 2026). Table 1 of arXiv v1 lists $1.7217^n$, from $c = 3.592$: the $3.592^k$ algorithm of Kociumaka–Pilipczuk, arXiv:1306.3566v1, Theorem 1, which their journal version (Information Processing Letters 2014) does not contain. With the journal bound $(2+\phi)^k$ ($\phi$ the golden ratio), Theorem 2 gives $(2 - 1/(2+\phi))^{n + o(n)} n^{O(1)}$, base $1.72360\ldots$, so $O(1.7237^n)$, rounded up as in Table 1 (the comparator cannot yet compare $c^{n + o(n)}$ with other bounds). The derandomization needs an additional $2^{o(n)}$ space (as stated). STOC 2016; J. ACM 2019.'
review: { approved_by: Serge Gaspers, date: 2026-11-18 }
