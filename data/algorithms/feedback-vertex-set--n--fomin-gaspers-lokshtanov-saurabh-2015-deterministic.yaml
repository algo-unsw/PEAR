  statements:
    arxiv-v1:
      statement: 'Table 1 (Theorem 2 with a deterministic $3.592^k$ algorithm)'
  note: 'Derandomized Monotone Local Search, $(2 - 1/c)^{n + o(n)}$ with $c = 3.592$; the derandomization needs an additional $2^{o(n)}$ space (as stated). The $3.592^k$ algorithm is Theorem 1 of Kociumaka–Pilipczuk (arXiv:1306.3566v1); Iwata and Kobayashi cite their deterministic bound as $3.619^k$ (Theorem 2 there, $(2+\phi)^k$), so whether the published version keeps $3.592^k$ is still to be checked; with $3.619^k$ the base would be $2 - 1/3.619 \approx 1.7237$. STOC 2016; J. ACM 2019.'
