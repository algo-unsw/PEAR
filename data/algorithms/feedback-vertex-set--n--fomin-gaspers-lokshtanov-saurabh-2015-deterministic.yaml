  note: 'Derandomized Monotone Local Search, $(2 - 1/c)^{n + o(n)}$ with $c = 3.592$; the derandomization needs an additional $2^{o(n)}$ space (as stated). The $3.592^k$ algorithm is Theorem 1 of Kociumaka–Pilipczuk (arXiv:1306.3566v1); the journal version gives $(2+\phi)^k \le 3.619^k$ instead (decided 17 November 2026: use the journal version), with which this base would be $2 - 1/3.619 \approx 1.7237$. Under review. STOC 2016; J. ACM 2019.'
