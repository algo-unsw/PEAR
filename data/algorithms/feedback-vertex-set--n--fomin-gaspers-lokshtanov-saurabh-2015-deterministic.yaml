id: feedback-vertex-set--n--fomin-gaspers-lokshtanov-saurabh-2015-deterministic
problem: feedback-vertex-set
proved_for: decision
bound:
  as_stated: '1.7217^{n} n^{O(1)}'
  notation: O
  parameters:
  - n
properties:
  randomized: false
  space:
    class: exponential
    bound: 'An additional $2^{o(n)}$ space for the derandomization, as stated.'
  algebraic: false
