source:
  paper: gaspers-2026-pathwidth
  statements:
    arxiv-v1:
      statement: 'Theorem 11.3(2)'
      page: 78
  note: 'Theorem 11.3(2): every semiring version of Max $(r,2)$-CSP is solved in time and space $O^*(r^{(7/48)m+o(m)})$ (semiring operations), via a path decomposition of width $\frac{7}{48}m + o(m)$ of the constraint graph. Section 11.1: counting the solutions of a binary CSP is the semiring $(\mathbb{N}, +, \times)$ with scores in $\{0, 1\}$. Here $r = 3$, the constraint graph is $G$, every vertex score is 1 and $s_{uv}(a, b) = 1$ if and only if $a \ne b$, so $Z$ is the number of 3-colourings; the numbers have $O(n)$ bits, so each operation takes polynomial time (simple specialisation, decided by the worker). Theorem number and page from the v1 PDF as recorded for `max-2-csp--m--gaspers-2026-pathwidth`; statement read in the LaTeX source. arXiv v1, 3 November 2026; unrefereed preprint.'
