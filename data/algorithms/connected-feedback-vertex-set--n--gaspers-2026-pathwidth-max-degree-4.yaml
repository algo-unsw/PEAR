  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (b): Connected Feedback Vertex Set by a Monte Carlo algorithm in time $4^{F_4 n + o(n)} = O(1.4060^n)$ ($F_4 < 0.24577198$ is a numerically certified constant, so the rounded form is stored) on graphs of maximum degree 4. The Cut&Count algorithm of Cygan et al. in time $4^{\mathrm{tw}} n^{O(1)}$ (their Theorem 1.2) run on a path decomposition computed in polynomial time. arXiv v1, 3 November 2026 (read: the LaTeX source of the arXiv version; numbering as in the existing records from this theorem); unrefereed preprint.'
