id: rural-postman--m--folklore
problem: rural-postman
proved_for: optimisation
bound:
  as_stated: '2^{m} n^{O(1)}'
  notation: O
  parameters:
  - m
  - n
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'One edge set $S$ at a time.'
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  folklore: true
  note: 'Try all sets $S$ with $R \subseteq S \subseteq E$ whose edges form a connected graph; an optimal closed walk traverses exactly the edges of some such $S$ and is then a minimum Chinese Postman tour of the graph formed by $S$, which is computable in polynomial time (minimum-weight $T$-join by matching); keep the cheapest (brute force over edge subsets).'
