  note: "Proof: $v^*$ must win $\\log n$ matches, so $d < \\log n$ gives a no-instance; otherwise $n \\le 2^{d}$ and the $2^{n} n^{O(1)}$ algorithm of Gupta et al. applies. Theorem 2 rules out $2^{2^{d/c}} n^{O(1)}$ for every constant $c > 1$ under ETH. Theorem 3 (in-degree $k$) is entered as `tournament-fixing--k--wang-peng-liu-2026`. The same Theorem 1 is Theorem 1 of the merged arXiv:2602.13422v2 (Liu, Peng, Wang, Xiao)."
