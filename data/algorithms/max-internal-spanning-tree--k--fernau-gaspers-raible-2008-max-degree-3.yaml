id: max-internal-spanning-tree--k--fernau-gaspers-raible-2008-max-degree-3
problem: max-internal-spanning-tree
proved_for: decision-max-degree-3
bound:
  as_stated: '2.1364^{k} n^{O(1)}'
  notation: O
  parameters:
  - k
  - n
properties:
  randomized: false
  space:
    class: polynomial
    bound: 'Polynomial space: the branching algorithm of Theorem 1, whose space Section 1 states is polynomial.'
  algebraic: false
