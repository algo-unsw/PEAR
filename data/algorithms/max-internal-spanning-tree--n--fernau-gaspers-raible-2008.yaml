  note: 'Theorem 2 (Section 2.2, "Speed-up by subset convolution"): computes a spanning tree with a minimum number of leaves in time and space $O^*(2^n)$. Not in the arXiv v3 / WG 2009 version, which gives $O^*(3^n)$. Read in the author copy of the Algorithmica version on Serge Gaspers''s homepage; the paper notes that Nederlof''s $O^*(2^n)$ algorithm needs only polynomial space.'
