    arxiv-v1:
      statement: Theorem 1.4
      page: 3
  note: 'One-sided Monte Carlo: always rejects no-instances, accepts yes-instances with constant probability (Section 2). Uses the randomized path decomposition DP for terminal instances (Section 5.6) and the randomized $O^*(1.3159^n)$ 3-coloring algorithm of Theorem 1.2. arXiv v1, 2 November 2026; unrefereed preprint.'
