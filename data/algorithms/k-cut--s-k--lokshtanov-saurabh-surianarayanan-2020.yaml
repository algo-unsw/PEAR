id: k-cut--s-k--lokshtanov-saurabh-surianarayanan-2020
problem: k-cut
proved_for: decision
bound:
  as_stated: "s^{O(k)} n^{O(1)}"
  notation: O
  parameters: [s, k, n]
properties:
  randomized: false
  space:
    class: exponential
    note: "Not stated; educated guess: $s^{O(k)} n^{O(1)}$. Dynamic programming over an edge-unbreakable tree decomposition, with tables trimmed to $s^{O(k)}$ states per bag."
  algebraic: false
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
source:
  paper: lokshtanov-saurabh-surianarayanan-2020
  statements:
    arxiv: { statement: "Theorem 1.2" }
  note: "Unweighted multigraphs: decides whether $G$ has a $k$-cut of weight at most $s$; a partition is found by self-reduction (Section 1). Theorem 1.2 is not stated as randomized, unlike the approximation scheme of Theorem 1.1; TODO(verify). Read in arXiv 2005.00134 (the version served on 20 November 2026; the arXiv tool listed v3). Earlier FPT algorithms in $s$ alone: Kawarabayashi and Thorup ($s^{s^{O(s)}} n^2$), Chitnis et al. ($s^{O(s^2)} n^{O(1)}$), Cygan et al. ($s^{O(s)} n^{O(1)}$), as listed in Section 1."
