source:
  folklore: true
  note: 'Try all $B_n$ partitions of $V$ (Bell number) that separate every terminal pair and count the edges between different parts: the components of $G - S$ for an optimal $S$ form such a partition, and the edges between the parts of any such partition form a multicut (brute force; added at Serge Gaspers''s request, 20 November 2026).'
