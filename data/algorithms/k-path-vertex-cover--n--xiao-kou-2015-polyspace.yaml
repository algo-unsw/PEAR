  note: "Stated for Maximum Dissociation Set: \"A maximum dissociation set in graph with $n$ vertices can be computed in $O^*(1.4656^n)$ time and polynomial space.\" A vertex set $D$ is a dissociation set if and only if $V \\setminus D$ is a 3-path vertex cover (abstract), so the same algorithm outputs a minimum 3-path vertex cover. Read in the journal version (Zotero copy of the publisher PDF). Open access: Theoretical Computer Science is in Elsevier's open archive, which opens articles 4 years after publication (elsevier.com, 'free access to archived articles', mathematics list, read 21 November 2026); Zotero's Unpaywall lookup also linked an open PDF for this DOI."
