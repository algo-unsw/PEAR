source:
  paper: fomin-gaspers-kratsch-liedloff-saurabh-2008
  statements:
    mfcs:
      statement: 'Figure 1 (row 5, column MHS_k)'
  note: 'Figure 1 of the MFCS author copy ("Running times for #MHS$_k$ and MHS$_k$"): the row $k = 5$ gives MHS$_5$ in $O^*(1.9489^n)$ as a result of this paper (no citation in that cell). The base matches the MFCS Theorem 3 bound $\min_{1/2 \le \alpha \le 1} \max\{\binom{n}{\alpha n}, 2^{\alpha n} a_4^{(1-\alpha) n}\}$ with $a_4 = 1.8704$ (our arithmetic: $1.94886$). The journal version has the same kind of table (Table 1, "Running times of the algorithms for #MHS$_d$ and MHS$_d$"), whose cells were not readable in the text extraction. Beaten by Monotone Local Search.'
