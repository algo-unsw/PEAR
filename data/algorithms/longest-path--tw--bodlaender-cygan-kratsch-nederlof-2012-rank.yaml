source:
  paper: bodlaender-cygan-kratsch-nederlof-2012
  statements:
    arxiv-v1:
      statement: Theorem 3.20 (page 21)
  note: 'Theorem 3.20: "There exist algorithms that given a graph $G$ and integer $k$ finds a path of length $k$ in time $n(2 + 2^{\omega/2})^{pw}(k + pw)^{O(1)}$ time if a path decomposition of width $pw$ of $G$ is given, and in time $n(5 + 2^{(\omega+2)/2})^{tw}(k + tw)^{O(1)}$ time if a tree decomposition of width $tw$ of $G$ is given." A modification of the Hamiltonian Cycle dynamic program of Section 3.4; deterministic (rank-based approach). Whether "length" counts vertices or edges changes $k$ by one, which the factor $(k + tw)^{O(1)}$ absorbs. The pathwidth bound is not entered: Longest Path has no pathwidth parameter. Statement read in the current arXiv version (dated 8 November 2012).'
