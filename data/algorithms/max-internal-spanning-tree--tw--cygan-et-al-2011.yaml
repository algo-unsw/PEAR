id: max-internal-spanning-tree--tw--cygan-et-al-2011
problem: max-internal-spanning-tree
proved_for: decision
bound:
  as_stated: '4^{tw} n^{O(1)}'
  notation: O
  parameters: [tw, n]
properties:
  randomized: { error: one-sided }
  space: { class: exponential, note: 'Not stated; educated guess: exponential. Dynamic programming over the given tree decomposition keeps tables exponential in the width (with fast subset convolution at join bags).' }
  algebraic: true
  fast_matrix_multiplication: false
  constructive: true
  quantum: false
given: [tree-decomposition]
source:
  paper: cygan-et-al-2011
  statements:
    arxiv-v1: { statement: 'Theorem 1.2, item 10 (Exact $k$-Leaf Spanning Tree, which includes Minimum Leaf Tree)' }
  note: 'Cut&Count; Monte Carlo without false positives. Minimum Leaf Tree asks for a spanning tree with at most $\ell$ leaves (Section 4); $G$ has a spanning tree with at least $k$ internal vertices if and only if it has one with at most $n - k$ leaves, so one call with $\ell = n - k$ decides the instance.'
