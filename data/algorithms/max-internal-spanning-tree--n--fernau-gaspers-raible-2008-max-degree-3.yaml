  quantum: false
source:
  paper: fernau-gaspers-raible-2008
  statements:
    arxiv-v3:
      statement: 'Theorem 1'
      page: 9
  note: 'Theorem 1: "Max Internal Spanning Tree can be solved in time $O^*(1.8669^n)$ on subcubic graphs" (a subcubic graph has maximum degree at most three, Section 1). Branching algorithm analysed by Measure & Conquer; it returns a spanning tree with most internal vertices. Polynomial space, as stated in Section 1 (Our Results (b)). Superseded on graphs of maximum degree 3 by $O(1.2139^n)$ (Gaspers 2026, Theorem 14.1(b), exponential space, Monte Carlo). Read in arXiv:0811.1875v3 (12 June 2009). The Algorithmica version improves the analysis (author copy: $O(1.8612^n)$, Theorem 6, as recorded by serge-02; not re-read here: TODO(verify) its statement before adding a `journal-author-copy` statement).'
