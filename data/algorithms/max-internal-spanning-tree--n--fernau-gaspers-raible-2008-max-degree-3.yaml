id: max-internal-spanning-tree--n--fernau-gaspers-raible-2008-max-degree-3
problem: max-internal-spanning-tree
proved_for: optimisation-max-degree-3
bound:
  as_stated: 'O^*(1.8669^{n})'
  notation: O*
  parameters:
  - n
properties:
  randomized: false
  space:
    class: polynomial
    note: 'Polynomial space, as stated (Section 1, Our Results (b)).'
  algebraic: false
  fast_matrix_multiplication: false
