  note: 'Theorem 9: an exponential-space $O^*(3.41^k)$-time algorithm for $k$-Internal Out-Branching (directed); deterministic per Table 1 of the paper ("det, exp, directed, $3.41^k$"). Applied to Maximum Internal Spanning Tree: a $k$-IST instance $(G, k)$ is a $k$-IOB instance $(D, k + 1)$ on the symmetric digraph $D$ of $G$: a spanning tree with $i$ internal vertices, rooted at one of its leaves and oriented away from the root, is an out-branching with $i + 1$ vertices of positive out-degree (the root has one child), and conversely only the root of an out-branching can be a leaf of the underlying tree, so an out-branching with at least $k + 1$ vertices of positive out-degree gives a spanning tree with at least $k$ internal vertices ($n \ge 3$). The bound applies with $c^{k+1} = O(c^{k})$. Gutin et al. (arXiv 1706.03698, Section 1) and Li et al. (arXiv 1412.8296v1, Section 1) note that $k$-IOB algorithms solve $k$-IST. arXiv version number not shown by the tools.'
