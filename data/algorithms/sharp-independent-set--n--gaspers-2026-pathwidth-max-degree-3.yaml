  note: 'Theorem C.6(a): the number of independent sets of $G$ can be computed in polynomial space and time $O(1.1304^n)$ if $\Delta(G) \le 3$. The analysis of Gaspers and Lee (Algorithmica 2023) rerun with $c_3$ in place of $\frac16$, with condition (30) of Gaspers and Sorkin added (computer-assisted); previous bound $O(1.1389^n)$ (Gaspers and Lee, Lemma 5), whose analysis the appendix reports to have gaps. arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
