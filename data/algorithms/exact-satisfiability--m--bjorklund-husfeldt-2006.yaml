  note: "The conference version (ICALP 2006) is recorded from its abstract only. Proposition 4(3), p. 235: \"Exact Satisfiability with $n$ variables and $m$ clauses and total size $l$ can be solved in polynomial space and time $2^m l^{O(1)}$\" ($l$ is written $N$ here). Proof (p. 236): Theorem 2, inclusion–exclusion over the $2^m$ subsets of clauses (the clauses are the universe after removing negations, Section 3.2), with a small dynamic programme per term; deterministic. It decides by checking that the sum is nonzero; an exactly satisfying assignment follows by self-reduction within the same bound (not stated in the paper). The same count gives the number of solutions (abstract). Proposition 2 also gives $4^m l^{O(\\log m)}$ in polynomial space, which this bound beats."
