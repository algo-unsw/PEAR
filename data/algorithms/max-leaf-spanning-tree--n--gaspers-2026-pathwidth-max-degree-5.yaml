  note: 'Theorem 14.1 (connectivity problems): polynomial factors omitted, all algorithms use exponential space, and the Monte Carlo algorithms have one-sided error at most $\frac12$. Part (b): Maximum Leaf Spanning Tree (as part of Exact $k$-Leaf Spanning Tree, and with the bounds of Connected Dominating Set) by a Monte Carlo algorithm in time $4^{11n/32+o(n)} = O(1.6105^n)$ on graphs of maximum degree 5. Proof (Appendix A.7.3): the Cut&Count algorithm of Cygan et al. in time $4^{\mathrm{tw}} n^{O(1)}$ for a given tree decomposition (their Theorem 1.2), run on a path decomposition computed in polynomial time (Theorem 10.1). arXiv v1, 3 November 2026 (read: the LaTeX source of the latest arXiv version, and the v1 PDF for theorem numbers and pages); unrefereed preprint.'
