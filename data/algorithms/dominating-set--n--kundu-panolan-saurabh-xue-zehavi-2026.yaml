  note: 'Counts the dominating sets of size at most $b$, deterministically, in time $2^{O(n\eta(n)^2/\sqrt{\lambda(n)})}$ ($\lambda(t) = \log_2(t+2)$, $\eta(t) = \log_2\log_2(t+4)$); the count is positive exactly on yes-instances. Via Theorem 8.1 with one closed neighbourhood per vertex ($t = 2n$); the formulas have width at most three. Assumption 4.5 is OpenAI''s theorem (the paper cites it for this assumption, Section 4.2), whose Lean statement was checked on 12 November 2026. Recovery of a set by self-reducibility is stated for Set Cover after Theorem 8.1.'
