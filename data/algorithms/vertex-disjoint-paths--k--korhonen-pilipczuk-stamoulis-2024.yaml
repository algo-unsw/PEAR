  note: "Stated as $\\mathcal{O}_k(m^{1+o(1)})$ where $m$ is the total number of vertices and edges and $\\mathcal{O}_k$ hides a computable factor in $k$; stored with PEAR's $n + m$. Computability of $f$ is contingent on Kawarabayashi, Thomas and Wollan's new proof of the Structure Theorem (not yet peer reviewed, per the Introduction); without it the result is a non-uniform algorithm (a separate almost-linear algorithm for every fixed $k$). The main theorem also returns a witnessing model, so the paths are found. Improves Kawarabayashi, Kobayashi and Reed's $O_k(n^2)$ (JCTB 2012) and Robertson and Seymour's $O_k(n^3)$."
