id: clique-cover--to--chromatic-number
from: { problem: clique-cover, version: decision }
to: { problem: chromatic-number, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n^{2})"
parameter_map: { n: "n", m: "n (n - 1) / 2 - m", k: "k" }
source:
  folklore: true
  note: "A map $c \\colon V \\to \\{1, \\dots, k\\}$ puts only adjacent vertices of $G$ into the same class if and only if it is a proper colouring of the complement $\\overline{G}$, so $(G, k) \\mapsto (\\overline{G}, k)$."
