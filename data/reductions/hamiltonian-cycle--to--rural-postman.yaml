id: hamiltonian-cycle--to--rural-postman
from: { problem: hamiltonian-cycle, version: decision }
to: { problem: rural-postman, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "2 n", m: "m + n", k: "n", B: "3 n" }
source:
  paper: lenstra-rinnooy-kan-1974
  statements:
    report: { statement: "Theorem in Section 2, proof of the undirected case" }
  note: "For $H = (V, E)$ with $|V| \\ge 3$: vertices $V \\times \\{0, 1\\}$, a required edge $\\{(s, 0), (s, 1)\\}$ of weight $0$ for every $s \\in V$, an edge $\\{(s, 0), (t, 0)\\}$ of weight $1$ for every edge $st \\in E$, and $B = |V|$; $H$ has a Hamiltonian circuit if and only if the new graph has a postman tour of weight at most $B$. If $H$ is disconnected (no Hamiltonian cycle; the new graph would be disconnected), output a fixed no-instance instead (a site-written detail). PEAR's weights are positive integers (26 November 2026), so the required edges get weight 1 instead of 0 and $B = 3|V|$ (site-written, to be approved by Serge): each $(s, 1)$ is a leaf, so a postman tour traverses each required edge at least twice, at cost at least $2|V|$; a tour of weight at most $3|V|$ therefore uses at most $|V|$ other edges, which form a closed walk through all $|V|$ vertices $(s, 0)$, that is, a Hamiltonian circuit of $H$ (as $|V| \\ge 3$); conversely a Hamiltonian circuit with a detour to each leaf costs exactly $3|V|$."
