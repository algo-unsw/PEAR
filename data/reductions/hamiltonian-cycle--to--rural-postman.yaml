id: hamiltonian-cycle--to--rural-postman
from: { problem: hamiltonian-cycle, version: decision }
to: { problem: rural-postman, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "2 n", m: "m + n", k: "n", B: "n" }
source:
  paper: lenstra-rinnooy-kan-1974
  statements:
    report: { statement: "Theorem in Section 2, proof of the undirected case" }
  note: "For $H = (V, E)$ with $|V| \\ge 3$: vertices $V \\times \\{0, 1\\}$, a required edge $\\{(s, 0), (s, 1)\\}$ of weight $0$ for every $s \\in V$, an edge $\\{(s, 0), (t, 0)\\}$ of weight $1$ for every edge $st \\in E$, and $B = |V|$; $H$ has a Hamiltonian circuit if and only if the new graph has a postman tour of weight at most $B$. If $H$ is disconnected (no Hamiltonian cycle; the new graph would be disconnected), output a fixed no-instance instead (a site-written detail)."
