id: max-cut--to--max-2-csp
from: { problem: max-cut, version: decision }
to: { problem: max-2-csp, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "n", m: "m", r: "2", k: "k" }
variants:
  - id: weighted
    note: "Weighted versions: the same construction, with score $w(uv)$ for a cut edge."
    from: { problem: max-cut, version: weighted }
    to: { problem: max-2-csp, version: optimisation }
    parameter_map: { n: "n", m: "m", r: "2" }
    source:
      folklore: true
      note: "The score function of edge $uv$ returns $w(uv)$ when the endpoints get different colours and 0 otherwise."
source:
  paper: gaspers-sorkin-2017
  statements:
    arxiv-v2: { statement: "Section 1 (Outline of the paper)" }
  note: "Max Cut is the special case of Max 2-CSP with $r = 2$ in which every vertex score is 0 and every edge score is 1 if the endpoints get different colours and 0 otherwise (Section 1 of arXiv v2); the constraint graph is the input graph."
