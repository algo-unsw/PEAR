id: 4-coloring--to--graph-homomorphism
from: { problem: 4-coloring, version: decision }
to: { problem: graph-homomorphism, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "n", m: "m", h: "4", b: "0", tw: "tw", tw_H: "3" }
source:
  folklore: true
  note: "$G \\mapsto (G, K_4)$: a 4-colouring of $G$ is exactly a homomorphism from $G$ to $K_4$. The complement of $K_4$ has no edges, so its bandwidth is $0$; $K_4$ has treewidth 3."
