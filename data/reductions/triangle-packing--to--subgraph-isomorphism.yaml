source:
  folklore: true
  note: "Keep $G$ as the host and take the pattern $H$ to be $k$ disjoint triangles ($3k$ vertices, treewidth 2); an injective map of $H$ into $G$ that preserves edges is exactly a choice of $k$ vertex-disjoint triangles. (After the polynomial-time check $3k \\le n$.)"
