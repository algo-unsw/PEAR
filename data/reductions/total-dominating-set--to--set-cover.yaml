id: total-dominating-set--to--set-cover
from: { problem: total-dominating-set, version: decision }
to: { problem: set-cover, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "n", m: "n", k: "k" }
variants:
  - id: red-blue
    note: "The same construction gives Red-Blue Dominating Set: red vertices $V$, blue vertices a copy $V'$ of $V$, and $u$ adjacent to $v'$ when $uv \\in E$."
    to: { problem: red-blue-dominating-set, version: decision }
    parameter_map: { n: "2 n", m: "2 m", k: "k", r: "n", b: "n" }
    source:
      folklore: true
      note: "A set $S \\subseteq V$ is a total dominating set of $G$ if and only if $S$, as red vertices, dominates every blue vertex $v'$, since $v'$ is adjacent exactly to $N(v)$."
source:
  folklore: true
  note: "Universe $V$ and family $\\{N(v) : v \\in V\\}$ of open neighbourhoods; a set $S \\subseteq V$ is a total dominating set if and only if $\\{N(v) : v \\in S\\}$ covers $V$."
status: valid
