id: sat--to--max-sat
from: { problem: sat, version: decision }
to: { problem: max-sat, version: decision }
type: polytime-deterministic
calls: 1
time: "O(N)"
parameter_map: { n: "n", m: "m", k: "m" }
source:
  folklore: true
  note: "A formula with $m$ clauses is satisfiable if and only if some assignment satisfies at least $k = m$ of its clauses; the formula is unchanged."
