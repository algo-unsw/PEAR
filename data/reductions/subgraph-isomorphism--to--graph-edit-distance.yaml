id: subgraph-isomorphism--to--graph-edit-distance
from: { problem: subgraph-isomorphism, version: decision }
to: { problem: graph-edit-distance, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m + k^{2})"
parameter_map: { n: "n + k", m: "m + k (k - 1)/2", k: "n + m" }
source:
  folklore: true
  note: "Zeng et al. (2009): if $k \\le n$ and $|E_H| \\le m$, then $H$ is isomorphic to a subgraph of $G$ if and only if the edit distance from $H$ to $G$ is at most $(n - k) + (m - |E_H|)$ (every operation changes the number of vertices or of edges by one, so only insertions fit this budget); otherwise output a fixed no-instance. So $(G, H) \\mapsto (G_1 = H, G_2 = G, (n - k) + (m - |E_H|))$. TODO(verify): cite Zeng et al. directly once their paper is opened."
  reference: { paper: limmer-kriege-2026, version: arxiv-v1, statement: "Section 2.2, Equation (3)" }
