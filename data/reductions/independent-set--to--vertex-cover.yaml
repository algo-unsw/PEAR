id: independent-set--to--vertex-cover
from: { problem: independent-set, version: decision }
to: { problem: vertex-cover, version: decision }
type: polytime-deterministic
calls: 1
time: "O(n + m)"
parameter_map: { n: "n", m: "m", k: "n - k" }
source:
  folklore: true
  note: "$S$ is an independent set of $G$ if and only if $V \\setminus S$ is a vertex cover of $G$, so $(G, k) \\mapsto (G, n - k)$."
variants:
  - id: weighted
    note: "Weighted versions: the same complementation, on the same graph and weights."
    from: { problem: independent-set, version: weighted }
    to: { problem: vertex-cover, version: weighted }
    parameter_map: { n: "n", m: "m", tw: "tw" }
    source:
      folklore: true
      note: "The maximum weight of an independent set is $w(V)$ minus the minimum weight of a vertex cover of the same graph."
review: { approved_by: Serge Gaspers, date: 2026-11-08 }
