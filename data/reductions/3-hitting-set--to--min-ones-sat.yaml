id: 3-hitting-set--to--min-ones-sat
from:
  problem: 3-hitting-set
  version: decision
to:
  problem: min-ones-sat
  version: decision-max-clause-size-3
type: polytime-deterministic
calls: 1
time: O(N)
parameter_map:
  n: n
  m: m
  k: k
  d: '3'
source:
  folklore: true
  note: Each element becomes a variable and each set the clause of its elements as positive literals (at most three per clause, so $d \le 3$); hitting sets of size at most $k$ are exactly the satisfying assignments with at most $k$ true variables.
