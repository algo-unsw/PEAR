source:
  paper: gaspers-sorkin-2017
  statements:
    arxiv-v2: { statement: "Section 5 (introduction and Section 5.2)" }
  note: "Universe $V$ and the multiset $\\{N[v] : v \\in V\\}$ of closed neighbourhoods (one member per vertex, so true twins give two equal members). Section 5.2: \"there is a cardinality-preserving bijection between dominating sets of the graph and set covers of the instance\", so the counts by size are equal. A counting reduction (rulebook §2a)."
