  note: "Variables $V$, domain $\\{1, 2, 3\\}$, and for every edge $uv$ the constraint with scope $(u, v)$ and relation $\\{(a, b) : a \\ne b\\}$; the primal graph is $G$. Beigel and Eppstein (arXiv cs/0006046, Section 2) describe this translation of 3-colouring into $(3,2)$-CSP."
