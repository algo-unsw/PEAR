  note: 'The paper''s reduction (Lemma 1 and Corollary 2): for every vertex $v$, build $H_v$ with vertex set $N(v) \cup N_2(v)$ ($N_2(v)$: the vertices at distance exactly 2), the edges of $G$ inside $N(v)$ and inside $N_2(v)$, and the non-edges of $G$ between $N(v)$ and $N_2(v)$ as edges; a set $B \ni v$ with $B \setminus \{v\} \subseteq V(H_v)$ is a biclique of $G$ if and only if $B - v$ is independent in $H_v$, and the paper outputs $\max_v (1 + \alpha(H_v))$ from $n$ calls. **How it is modified here:** the paper allows $X$ or $Y$ to be empty, and a biclique with an empty side (an independent set of $G$) need not lie within distance 2 of one of its vertices, so the $n$ calls can miss it (a perfect matching on $n$ vertices has maximum biclique $n/2$, while $\max_v (1 + \alpha(H_v)) = 2$). Add one call on $G$ itself and output $\max(\alpha(G), \max_v (1 + \alpha(H_v)))$. Correctness: if both sides are nonempty, pick $v \in X$; then $Y \subseteq N(v)$ and every other vertex of $X$ is adjacent to all of $Y$, so $X \setminus \{v\} \subseteq N_2(v)$ and $B$ is found through $H_v$; if a side is empty, $B$ is an independent set of $G$ and the extra call finds it. The bound is unchanged ($n + 1$ calls on graphs with at most $n$ vertices); $k_B \le k_A$ since $1 + \alpha(H_v) \le k_A$ and $\alpha(G) \le k_A$. Fix written by the site, approved by Serge Gaspers on 21 November 2026.'
