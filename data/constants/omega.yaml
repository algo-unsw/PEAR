id: omega
name: Matrix multiplication exponent
symbol: "\\omega"
definition: "The infimum of the real numbers $\\tau$ such that, for every $\\varepsilon > 0$, two $n \\times n$ matrices over $\\mathbb{C}$ can be multiplied in $O_\\varepsilon(n^{\\tau + \\varepsilon})$ arithmetic operations."
