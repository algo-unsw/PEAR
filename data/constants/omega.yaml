id: omega
name: Matrix multiplication exponent
symbol: "\\omega"
definition: "The infimum of the real numbers $\\tau$ such that, for every $\\varepsilon > 0$, two $n \\times n$ matrices over $\\mathbb{C}$ can be multiplied in $O_\\varepsilon(n^{\\tau + \\varepsilon})$ arithmetic operations."
definition_source:
  paper: openai-2026
  statements: { preprint: { statement: "Section 1", page: 1 } }
bounds:
  - relation: le
    value: "9/4"
    status: claimed
    sources:
      - paper: openai-2026
        statements: { preprint: { statement: "Theorem 1.1", page: 1 } }
      - paper: pass-2026
        statements: { arxiv-v2: { statement: "Theorem 1.1", page: 2 } }
        note: "Constructive proof. Theorem 1.1 (arXiv v2, 30 October 2026): \"For every $\\gamma > 0$, there is an explicit recursive algorithm that, for every positive integer $n$, multiplies two $n \\times n$ integer matrices with $O(n^{9/4+\\gamma})$ integer arithmetic operations. In particular, $\\omega \\le 9/4$.\" Entered on 8 November 2026 from the arXiv v1 abstract."
  - relation: le
    value: "2.371339"
    status: established
    sources:
      - paper: alman-duan-vassilevska-williams-xu-xu-zhou-2024
        statements: { arxiv-v2: { statement: "Section 1 (\"Our new bound on $\\omega$ is $\\omega < 2.371339$\") and Table 1" } }
        note: "The best published bound (SODA 2025), as on Wikipedia (Matrix multiplication algorithm), checked 18 November 2026."
  - relation: le
    value: "2.371177"
    status: claimed
    sources:
      - paper: alman-duan-vassilevska-williams-xu-xu-zhou-2024
        statements: { arxiv-v3: { statement: "Section 1 and Table 1", page: 2 } }
        note: "arXiv v3 (19 August 2026), Section 1: \"A recent work [DEK+ 26] further improves the bound derived from our method to $\\omega < 2.371177$\", from parameters found by Dupont et al. (arXiv:2608.16884) for the eighth power of the CW tensor, \"based on the same algorithm and analysis as in this paper\" (also Section 8, page 42); the fourth power gives $\\omega < 2.371339$. Not yet published."
  - relation: ge
    value: "2"
    sources:
      - folklore: true
        note: "Each of the $n^2$ entries of the product needs at least one arithmetic operation."
review: { approved_by: Serge Gaspers, date: 2026-11-07 }
