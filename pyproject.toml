[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pear"
version = "0.0.0"
description = "Data pipeline for PEAR: Parameterized and Exact Algorithms and Reductions"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
